          /** Ligne de la liste des infos : en-tête de zone (header 1 à 4) ou une info (header 0) */
          class Row(val header: Int, val mod: Mod?)

          class ModHolder(
              v: View,
              val handle: TextView,
              val emoji: TextView,
              val title: TextView,
              val sub: TextView,
              val up: TextView,
              val down: TextView,
              val sw: Switch,
              val gear: TextView
          ) : RecyclerView.ViewHolder(v)

          class HeadHolder(v: View, val tv: TextView) : RecyclerView.ViewHolder(v)

          class ModAdapter(private val act: MainActivity, private val ui: Ui, private val rows: MutableList<Row>) :
              RecyclerView.Adapter<RecyclerView.ViewHolder>() {

              var helper: ItemTouchHelper? = null

              override fun getItemCount(): Int = rows.size

              override fun getItemViewType(position: Int): Int = rows[position].header

              private fun smallBtn(t: String): TextView {
                  val v = ui.tv(t, 18f, Pal.TXT)
                  v.setPadding(ui.dp(8), ui.dp(6), ui.dp(8), ui.dp(6))
                  return v
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): RecyclerView.ViewHolder {
                  val lp = RecyclerView.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  lp.setMargins(ui.dp(10), ui.dp(4), ui.dp(10), ui.dp(4))
                  if (viewType != 0) {
                      val t = ui.tv("", 13f, Pal.ACCENT)
                      t.setPadding(ui.dp(8), ui.dp(12), ui.dp(8), ui.dp(2))
                      t.layoutParams = lp
                      return HeadHolder(t, t)
                  }
                  val root = LinearLayout(act)
                  root.orientation = LinearLayout.HORIZONTAL
                  root.gravity = android.view.Gravity.CENTER_VERTICAL
                  root.setPadding(ui.dp(4), ui.dp(6), ui.dp(8), ui.dp(6))
                  root.background = ui.round(Pal.CARD, 14)
                  root.layoutParams = lp

                  val handle = smallBtn("≡")
                  val emoji = ui.tv("", 22f, Pal.TXT)
                  emoji.setPadding(ui.dp(2), 0, ui.dp(8), 0)
                  val col = LinearLayout(act)
                  col.orientation = LinearLayout.VERTICAL
                  val title = ui.tv("", 14f, Pal.TXT)
                  title.setSingleLine(true)
                  title.ellipsize = android.text.TextUtils.TruncateAt.END
                  val sub = ui.tv("", 11f, Pal.SUB)
                  sub.setSingleLine(true)
                  sub.ellipsize = android.text.TextUtils.TruncateAt.END
                  col.addView(title)
                  col.addView(sub)
                  val up = smallBtn("▲")
                  val down = smallBtn("▼")
                  val sw = Switch(act)
                  val gear = smallBtn("⚙️")

                  root.addView(handle)
                  root.addView(emoji)
                  root.addView(col, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  root.addView(up)
                  root.addView(down)
                  root.addView(sw)
                  root.addView(gear)
                  return ModHolder(root, handle, emoji, title, sub, up, down, sw, gear)
              }

              private fun summary(m: Mod): String {
                  val parts = ArrayList<String>()
                  if (m.showLed) parts.add("LED")
                  if (m.showIcon) parts.add("Icône")
                  if (m.showText) parts.add("Texte")
                  val o = m.kind.opts
                  if (o.isNotEmpty()) parts.add(o[m.opt.coerceIn(0, o.size - 1)])
                  return parts.joinToString(" · ")
              }

              private fun moveBy(pos: Int, delta: Int) {
                  val to = pos + delta
                  if (pos < 0 || to <= 0 || to >= rows.size) return
                  rows.add(to, rows.removeAt(pos))
                  notifyItemMoved(pos, to)
                  act.syncFromRows(rows)
              }

              override fun onBindViewHolder(h: RecyclerView.ViewHolder, position: Int) {
                  val r = rows[position]
                  if (h is HeadHolder) {
                      h.tv.text = arrayOf(
                          "⇤  BORD GAUCHE de la barre",
                          "◀  À GAUCHE du trou",
                          "À DROITE du trou  ▶",
                          "BORD DROIT de la barre  ⇥"
                      )[(r.header - 1).coerceIn(0, 3)]
                      return
                  }
                  val mh = h as ModHolder
                  val m = r.mod ?: return
                  mh.emoji.text = m.icon
                  mh.title.text = m.kind.title
                  mh.sub.text = summary(m)
                  mh.itemView.alpha = if (m.enabled) 1f else 0.5f
                  mh.sw.setOnCheckedChangeListener(null)
                  mh.sw.isChecked = m.enabled
                  mh.sw.setOnCheckedChangeListener { _, on ->
                      m.enabled = on
                      mh.itemView.alpha = if (on) 1f else 0.5f
                      act.commit()
                  }
                  mh.up.setOnClickListener { moveBy(mh.bindingAdapterPosition, -1) }
                  mh.down.setOnClickListener { moveBy(mh.bindingAdapterPosition, 1) }
                  mh.gear.setOnClickListener { act.openMod(m) }
                  mh.handle.setOnTouchListener { _, e ->
                      if (e.actionMasked == MotionEvent.ACTION_DOWN) helper?.startDrag(mh)
                      false
                  }
              }
          }
