              private fun setSideEdit(v: Boolean) {
                  if (Store.sideEdit == v) return
                  Store.sideEdit = v
                  IslandAccessibilityService.instance?.reload()
              }

              private fun showTab(i: Int) {
                  tab = i
                  setMaskEdit(i == 9)
                  for (k in 0 until tabRow.childCount) ui.styleChip(tabRow.getChildAt(k) as TextView, k == i)
                  content.removeAllViews()
                  val v = when (i) {
                      0 -> scroll(tabShape())
                      1 -> scroll(tabStyle())
                      2 -> scroll(tabHole())
                      3 -> tabInfos()
                      5 -> scroll(tabColors())
                      6 -> scroll(tabHistory())
                      7 -> scroll(tabGauges())
                      8 -> scroll(tabAnim())
                      9 -> scroll(tabMask())
                      else -> scroll(tabOptions())
                  }
                  content.addView(v, FrameLayout.LayoutParams(ui.MATCH, ui.MATCH))
              }

              /** Reconstruit l'onglet courant en gardant la position de défilement */
              private fun rebuild() {
                  val sy = (content.getChildAt(0) as? ScrollView)?.scrollY ?: 0
                  showTab(tab)
                  handler.post { (content.getChildAt(0) as? ScrollView)?.scrollTo(0, sy) }
              }

              // ---------------------------------------------------------------- HISTORIQUE 5G

              private fun fmtDur(ms: Long): String {
                  val sec = ms / 1000
                  return when {
                      sec >= 3600 -> String.format("%d h %02d min", sec / 3600, (sec % 3600) / 60)
                      sec >= 60 -> String.format("%d min %02d s", sec / 60, sec % 60)
                      else -> sec.toString() + " s"
                  }
              }

              private fun tabHistory(): View {
                  val c = Store.cfg
                  val b = ui.vbox()
                  b.addView(ui.section("Détection de la 5G"))
                  b.addView(ui.chips("Mode", listOf("Strict (5G réellement connectée)", "Large (comme l'icône du téléphone)"), { c.det5g.coerceIn(0, 1) }, { c.det5g = it }) { rebuild() })
                  b.addView(ui.hint("Strict évite d'afficher 5G quand elle est seulement disponible. Si l'app affiche 4G alors que l'icône du téléphone montre 5G, passe en Large."))
                  b.addView(ui.hint("Diagnostic : " + (if (Diag5g.text.isEmpty()) "pas encore de mesure (barre masquée ?)" else Diag5g.text)))
                  b.addView(ui.section("Enregistrement"))
                  b.addView(ui.toggle("Enregistrer l'historique de la 5G", { c.hist5g }, { c.hist5g = it }))
                  b.addView(ui.hint("Chaque connexion et chaque perte de la vraie 5G est notée avec l'heure. L'historique reste sur ton téléphone (300 événements au maximum). Il n'enregistre que lorsque la barre est affichée : si tu la masques (écran de verrouillage, AOD), les changements pendant ce temps ne sont pas vus."))

                  val evs = Hist5g.load(applicationContext)
                  val now = System.currentTimeMillis()
                  val cal = java.util.Calendar.getInstance()
                  cal.set(java.util.Calendar.HOUR_OF_DAY, 0)
                  cal.set(java.util.Calendar.MINUTE, 0)
                  cal.set(java.util.Calendar.SECOND, 0)
                  cal.set(java.util.Calendar.MILLISECOND, 0)
                  val dayStart = cal.timeInMillis
                  val df = java.text.SimpleDateFormat("dd/MM HH:mm:ss", java.util.Locale.getDefault())

                  var totalAll = 0L
                  var totalToday = 0L
                  var countAll = 0
                  var countToday = 0
                  var onStart = -1L
                  val lines = ArrayList<String>()
                  for (e in evs) {
                      if (e.on) {
                          if (onStart < 0) onStart = e.t
                          countAll++
                          if (e.t >= dayStart) countToday++
                          val extra = if (e.note.isNotEmpty()) " (" + e.note + ")" else ""
                          lines.add("✅ " + df.format(java.util.Date(e.t)) + "  5G connectée" + extra)
                      } else {
                          var dur = ""
                          if (onStart >= 0) {
                              val d = e.t - onStart
                              totalAll += d
                              totalToday += maxOf(0L, e.t - maxOf(onStart, dayStart))
                              dur = "  (restée " + fmtDur(d) + ")"
                              onStart = -1L
                          }
                          val to = if (e.note.isNotEmpty()) " → " + e.note else ""
                          lines.add("❌ " + df.format(java.util.Date(e.t)) + "  5G perdue" + to + dur)
                      }
                  }
                  var inProgress = ""
                  if (onStart >= 0) {
                      totalAll += now - onStart
                      totalToday += maxOf(0L, now - maxOf(onStart, dayStart))
                      inProgress = "En ce moment : 5G connectée depuis " + fmtDur(now - onStart) + "."
                  }

                  b.addView(ui.section("Résumé"))
                  b.addView(ui.hint("Aujourd'hui : " + countToday + " connexion(s) 5G, " + fmtDur(totalToday) + " cumulées."))
                  b.addView(ui.hint("Depuis le début de l'historique : " + countAll + " connexion(s), " + fmtDur(totalAll) + " cumulées."))
                  if (inProgress.isNotEmpty()) b.addView(ui.hint(inProgress))

                  b.addView(ui.section("Derniers événements"))
                  if (lines.isEmpty()) {
                      b.addView(ui.hint("Rien pour l'instant. Les événements apparaîtront ici quand le téléphone se connectera à la 5G ou la perdra."))
                  } else {
                      for (l in lines.asReversed().take(60)) b.addView(ui.hint(l))
                  }

                  b.addView(ui.button("↻ Actualiser") {
                      rebuild()
                  })
                  b.addView(ui.button("📋 Copier l'historique") {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("historique 5G", lines.joinToString("\n")))
                      toast("Historique copié")
                  })
                  b.addView(ui.button("🗑️ Effacer l'historique") {
                      Hist5g.clear(applicationContext)
                      rebuild()
                  })
                  return b
              }

