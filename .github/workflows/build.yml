          package com.example.island

          import android.content.Context
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.telephony.TelephonyCallback
          import android.telephony.TelephonyDisplayInfo
          import android.telephony.TelephonyManager
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.TextView
          import androidx.annotation.RequiresApi
          import androidx.core.graphics.ColorUtils

          /** Deuxième encoche : affiche le type de réseau mobile (5G, 4G+, H+, 3G, 2G…) */
          class NetworkIsland(private val ctx: Context, private val windowType: Int) {

              companion object {
                  /** Constante cachée dans l'API Android : 4G+ (agrégation de porteuses) */
                  private const val NETWORK_TYPE_LTE_CA = 19

                  /** Couleur d'aperçu pendant le choix d'une couleur (0 = aucun aperçu) */
                  @Volatile
                  var previewColor: Int = 0
              }

              private val wm = ctx.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private val prefs = Prefs(ctx)
              private val handler = Handler(Looper.getMainLooper())
              private val bg = IslandDrawable()
              private val textView = TextView(ctx)
              private var root: FrameLayout? = null
              private var lp: WindowManager.LayoutParams? = null

              @Volatile
              private var overrideType = 0 // 1-2 : 4G+, 3 : 5G (NSA), 4 : 5G+ (NR avancé)
              private var callback: Any? = null

              private val poll = object : Runnable {
                  override fun run() {
                      registerCallback()
                      updateText()
                      handler.postDelayed(this, 2000)
                  }
              }

              private fun dp(v: Int) = (v * ctx.resources.displayMetrics.density).toInt()

              // ---------- Cycle de vie ----------

              fun start() {
                  stop()
                  (textView.parent as? ViewGroup)?.removeView(textView)
                  textView.gravity = Gravity.CENTER
                  textView.maxLines = 1
                  textView.includeFontPadding = false
                  textView.setTypeface(Typeface.DEFAULT_BOLD)

                  val v = FrameLayout(ctx).apply { background = bg }
                  v.addView(
                      textView,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.CENTER
                      )
                  )

                  val params = WindowManager.LayoutParams(
                      prefs.n2Width,
                      prefs.n2Height,
                      windowType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      if (Build.VERSION.SDK_INT >= 30) {
                          layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                      } else if (Build.VERSION.SDK_INT >= 28) {
                          layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                  }
                  root = v
                  lp = params
                  wm.addView(v, params)
                  applyLive()
                  handler.post(poll)
              }

              fun stop() {
                  handler.removeCallbacksAndMessages(null)
                  unregisterCallback()
                  root?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  root = null
              }

              /** Relit les réglages et met la fenêtre à jour immédiatement */
              fun applyLive() {
                  val v = root ?: return
                  val params = lp ?: return

                  bg.set(prefs.n2Flare.toFloat(), prefs.n2BottomRadius.toFloat(), prefs.n2BgColor)
                  textView.setTextSize(TypedValue.COMPLEX_UNIT_SP, prefs.n2TextSize.toFloat())

                  params.width = prefs.n2Width
                  params.height = prefs.n2Height
                  params.x = prefs.n2XOffset
                  params.y = 0
                  v.visibility = if (prefs.n2Enabled) View.VISIBLE else View.INVISIBLE
                  try { wm.updateViewLayout(v, params) } catch (_: Exception) {}

                  updateText()
              }

              // ---------- Type de réseau ----------

              private fun updateText() {
                  val key = networkKey()
                  textView.text = if (key == "none") "—" else key
                  val c = when {
                      previewColor != 0 -> previewColor
                      prefs.n2Colored -> prefs.netColor(key)
                      ColorUtils.calculateLuminance(prefs.n2BgColor) > 0.6 -> Color.BLACK
                      else -> Color.WHITE
                  }
                  textView.setTextColor(c)
              }

              private fun networkKey(): String {
                  val dt = try {
                      val tm = ctx.getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
                      tm.dataNetworkType
                  } catch (_: Exception) {
                      TelephonyManager.NETWORK_TYPE_UNKNOWN
                  }
                  if (dt == TelephonyManager.NETWORK_TYPE_UNKNOWN) return "none"

                  when (overrideType) {
                      4 -> return "5G+"
                      3 -> return "5G"
                      1, 2 -> if (dt == TelephonyManager.NETWORK_TYPE_LTE ||
                          dt == NETWORK_TYPE_LTE_CA
                      ) return "4G+"
                  }

                  return when (dt) {
                      TelephonyManager.NETWORK_TYPE_NR -> "5G"
                      NETWORK_TYPE_LTE_CA -> "4G+"
                      TelephonyManager.NETWORK_TYPE_LTE -> "4G"
                      TelephonyManager.NETWORK_TYPE_HSPAP,
                      TelephonyManager.NETWORK_TYPE_HSDPA,
                      TelephonyManager.NETWORK_TYPE_HSUPA,
                      TelephonyManager.NETWORK_TYPE_HSPA -> "3G+"
                      TelephonyManager.NETWORK_TYPE_UMTS,
                      TelephonyManager.NETWORK_TYPE_EVDO_0,
                      TelephonyManager.NETWORK_TYPE_EVDO_A,
                      TelephonyManager.NETWORK_TYPE_EVDO_B,
                      TelephonyManager.NETWORK_TYPE_EHRPD,
                      TelephonyManager.NETWORK_TYPE_TD_SCDMA -> "3G"
                      TelephonyManager.NETWORK_TYPE_GPRS,
                      TelephonyManager.NETWORK_TYPE_EDGE,
                      TelephonyManager.NETWORK_TYPE_CDMA,
                      TelephonyManager.NETWORK_TYPE_1xRTT,
                      TelephonyManager.NETWORK_TYPE_IDEN -> "2G"
                      else -> "none"
                  }
              }

              // ---------- Détail 5G / 5G+ / 4G+ (Android 12 et plus) ----------

              @RequiresApi(31)
              private inner class DisplayCb : TelephonyCallback(), TelephonyCallback.DisplayInfoListener {
                  override fun onDisplayInfoChanged(telephonyDisplayInfo: TelephonyDisplayInfo) {
                      overrideType = telephonyDisplayInfo.overrideNetworkType
                      handler.post { updateText() }
                  }
              }

              private fun registerCallback() {
                  if (Build.VERSION.SDK_INT < 31 || callback != null) return
                  try {
                      val tm = ctx.getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
                      val cb = DisplayCb()
                      tm.registerTelephonyCallback(ctx.mainExecutor, cb)
                      callback = cb
                  } catch (_: Exception) {
                      // permission Téléphone pas encore accordée : on réessaie au prochain cycle
                  }
              }

              private fun unregisterCallback() {
                  if (Build.VERSION.SDK_INT < 31) return
                  val cb = callback as? TelephonyCallback ?: return
                  try {
                      val tm = ctx.getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
                      tm.unregisterTelephonyCallback(cb)
                  } catch (_: Exception) {
                  }
                  callback = null
              }
          }
