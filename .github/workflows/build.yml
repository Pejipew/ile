          package com.example.island

          import android.app.AlertDialog
          import android.content.Context
          import android.content.res.ColorStateList
          import android.graphics.Canvas
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.text.InputType
          import android.view.MotionEvent
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import androidx.core.widget.doAfterTextChanged

          /** Petits composants d'interface fabriqués en code (curseurs, pastilles, couleurs…) */
          class Ui(val ctx: Context, val onChange: () -> Unit) {
              val d: Float = ctx.resources.displayMetrics.density
              val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
              val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT

              fun dp(v: Int): Int = (v * d).toInt()

              fun round(color: Int, r: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(color)
                  g.cornerRadius = dp(r).toFloat()
                  return g
              }

              fun tv(t: String, size: Float, color: Int): TextView {
                  val v = TextView(ctx)
                  v.text = t
                  v.textSize = size
                  v.setTextColor(color)
                  return v
              }

              fun vbox(): LinearLayout {
                  val b = LinearLayout(ctx)
                  b.orientation = LinearLayout.VERTICAL
                  b.setPadding(dp(14), dp(10), dp(14), dp(24))
                  return b
              }

              fun box(): LinearLayout {
                  val b = LinearLayout(ctx)
                  b.orientation = LinearLayout.VERTICAL
                  b.setPadding(0, dp(6), 0, dp(6))
                  return b
              }

              fun hrow(): LinearLayout {
                  val b = LinearLayout(ctx)
                  b.orientation = LinearLayout.HORIZONTAL
                  b.gravity = Gravity.CENTER_VERTICAL
                  return b
              }

              fun section(t: String): TextView {
                  val v = tv(t.uppercase(), 12f, Pal.ACCENT)
                  v.setPadding(0, dp(18), 0, dp(4))
                  v.typeface = Typeface.DEFAULT_BOLD
                  return v
              }

              fun hint(t: String): TextView {
                  val v = tv(t, 12f, Pal.SUB)
                  v.setPadding(0, dp(2), 0, dp(6))
                  return v
              }

              fun button(text: String, onClick: () -> Unit): Button {
                  val b = Button(ctx)
                  b.text = text
                  b.isAllCaps = false
                  b.setTextColor(Pal.TXT)
                  b.background = round(Pal.ACCENT, 12)
                  b.setOnClickListener { onClick() }
                  return b
              }

              /** Rangée de boutons défilante (actions rapides) */
              fun buttons(names: List<String>, onClick: (Int) -> Unit): View {
                  val hs = HorizontalScrollView(ctx)
                  hs.isHorizontalScrollBarEnabled = false
                  val row = LinearLayout(ctx)
                  for ((i, n) in names.withIndex()) {
                      val b = button(n) { onClick(i) }
                      val lp = LinearLayout.LayoutParams(WRAP, WRAP)
                      lp.setMargins(0, 0, dp(8), 0)
                      row.addView(b, lp)
                  }
                  hs.addView(row)
                  return hs
              }

              fun chip(text: String): TextView {
                  val c = tv(text, 13f, Pal.TXT)
                  c.setPadding(dp(14), dp(8), dp(14), dp(8))
                  return c
              }

              fun styleChip(v: TextView, selected: Boolean) {
                  v.background = round(if (selected) Pal.ACCENT else Pal.CARD, 18)
                  v.setTextColor(if (selected) Pal.TXT else Pal.SUB)
              }

              private val rep = Handler(Looper.getMainLooper())

              /** Bouton qui répète son action tant qu'on le garde appuyé */
              private fun attachRepeat(v: View, action: () -> Unit) {
                  var running = false
                  val r = object : Runnable {
                      override fun run() {
                          if (!running) return
                          action()
                          rep.postDelayed(this, 70L)
                      }
                  }
                  v.setOnTouchListener { view, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              view.isPressed = true
                              action()
                              running = true
                              rep.postDelayed(r, 400L)
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              running = false
                              rep.removeCallbacks(r)
                              view.isPressed = false
                          }
                      }
                      true
                  }
              }

              private fun stepBtn(t: String): TextView {
                  val v = tv(t, 22f, Pal.TXT)
                  v.gravity = Gravity.CENTER
                  v.minWidth = dp(42)
                  v.setPadding(dp(8), dp(2), dp(8), dp(4))
                  v.background = round(Pal.CARD, 10)
                  return v
              }

              /** Curseur avec boutons − / + (appui long pour répéter) et valeur modifiable en tapant dessus */
              fun slider(title: String, min: Int, max: Int, get: () -> Int, set: (Int) -> Unit, unit: String = ""): View {
                  val b = box()
                  val head = hrow()
                  val vt = tv(get().toString() + unit, 14f, Pal.ACCENT)
                  vt.setPadding(dp(10), dp(4), dp(10), dp(4))
                  vt.background = round(Pal.CARD, 10)
                  head.addView(tv(title, 14f, Pal.TXT), LinearLayout.LayoutParams(0, WRAP, 1f))
                  head.addView(vt)
                  b.addView(head)

                  val row = hrow()
                  val sb = SeekBar(ctx)
                  sb.max = max - min
                  sb.progress = get().coerceIn(min, max) - min
                  sb.progressTintList = ColorStateList.valueOf(Pal.ACCENT)
                  sb.thumbTintList = ColorStateList.valueOf(Pal.ACCENT)

                  fun applyValue(v: Int) {
                      val nv = v.coerceIn(min, max)
                      set(nv)
                      vt.text = nv.toString() + unit
                      sb.progress = nv - min
                      onChange()
                  }

                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          if (fromUser) {
                              set(min + p)
                              vt.text = (min + p).toString() + unit
                              onChange()
                          }
                      }

                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })

                  val minus = stepBtn("−")
                  val plus = stepBtn("+")
                  attachRepeat(minus) { applyValue(get() - 1) }
                  attachRepeat(plus) { applyValue(get() + 1) }

                  vt.setOnClickListener {
                      val et = EditText(ctx)
                      et.inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_SIGNED
                      et.setText(get().toString())
                      et.setTextColor(Pal.TXT)
                      et.setSelectAllOnFocus(true)
                      AlertDialog.Builder(ctx, android.R.style.Theme_Material_Dialog_Alert)
                          .setTitle(title + " (" + min + " à " + max + ")")
                          .setView(et)
                          .setPositiveButton("OK") { _, _ ->
                              val n = et.text.toString().toIntOrNull()
                              if (n != null) applyValue(n)
                          }
                          .setNegativeButton("Annuler", null)
                          .show()
                  }

                  row.addView(minus)
                  row.addView(sb, LinearLayout.LayoutParams(0, WRAP, 1f))
                  row.addView(plus)
                  b.addView(row)
                  return b
              }

              fun toggle(title: String, get: () -> Boolean, set: (Boolean) -> Unit, after: (() -> Unit)? = null): View {
                  val s = Switch(ctx)
                  s.text = title
                  s.setTextColor(Pal.TXT)
                  s.textSize = 14f
                  s.isChecked = get()
                  s.setPadding(0, dp(8), 0, dp(8))
                  s.setOnCheckedChangeListener { _, on ->
                      set(on)
                      onChange()
                      after?.invoke()
                  }
                  return s
              }

              fun chips(title: String?, opts: List<String>, get: () -> Int, set: (Int) -> Unit, after: (() -> Unit)? = null): View {
                  val b = box()
                  if (title != null) b.addView(tv(title, 14f, Pal.TXT))
                  val hs = HorizontalScrollView(ctx)
                  hs.isHorizontalScrollBarEnabled = false
                  val row = LinearLayout(ctx)
                  val list = ArrayList<TextView>()
                  for ((i, o) in opts.withIndex()) {
                      val c = chip(o)
                      list.add(c)
                      c.setOnClickListener {
                          set(i)
                          for ((k, v) in list.withIndex()) styleChip(v, k == i)
                          onChange()
                          after?.invoke()
                      }
                      val lp = LinearLayout.LayoutParams(WRAP, WRAP)
                      lp.setMargins(0, dp(4), dp(8), dp(4))
                      row.addView(c, lp)
                  }
                  val cur = get()
                  for ((k, v) in list.withIndex()) styleChip(v, k == cur)
                  hs.addView(row)
                  b.addView(hs)
                  return b
              }

              fun colorRow(title: String, get: () -> Int, set: (Int) -> Unit, alpha: Boolean = true): View {
                  val row = hrow()
                  row.setPadding(0, dp(6), 0, dp(6))
                  row.addView(tv(title, 14f, Pal.TXT), LinearLayout.LayoutParams(0, WRAP, 1f))
                  val sw = View(ctx)
                  fun paint() {
                      val g = GradientDrawable()
                      g.cornerRadius = dp(10).toFloat()
                      g.setColor(get())
                      g.setStroke(dp(2), 0x66FFFFFF)
                      sw.background = g
                  }
                  paint()
                  sw.setOnClickListener {
                      ColorPicker.show(ctx, get(), alpha) { c ->
                          set(c)
                          paint()
                          onChange()
                      }
                  }
                  row.addView(sw, LinearLayout.LayoutParams(dp(56), dp(32)))
                  return row
              }

              fun edit(title: String, get: () -> String, set: (String) -> Unit, hintText: String = ""): View {
                  val b = box()
                  b.addView(tv(title, 14f, Pal.TXT))
                  val e = EditText(ctx)
                  e.setText(get())
                  e.setTextColor(Pal.TXT)
                  e.setHintTextColor(0x66FFFFFF)
                  e.hint = hintText
                  e.setSingleLine(true)
                  e.doAfterTextChanged {
                      set(it?.toString() ?: "")
                      onChange()
                  }
                  b.addView(e)
                  return b
              }
          }

          /** Aperçu en direct : un faux haut d'écran avec la barre, le trou et le halo */
          class PreviewFrame(ctx: Context, private val bar: BarView, private val halo: HaloView) : FrameLayout(ctx) {
              private val d: Float = ctx.resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              init {
                  addView(bar)
                  addView(halo)
                  setWillNotDraw(false)
              }

              fun relayout() {
                  requestLayout()
                  invalidate()
              }

              private fun exact(v: Int): Int = MeasureSpec.makeMeasureSpec(v, MeasureSpec.EXACTLY)

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val c = Store.cfg
                  val w = MeasureSpec.getSize(widthMeasureSpec)
                  val h = ((c.offY + c.height + 28) * d).toInt().coerceIn((90 * d).toInt(), (210 * d).toInt())
                  bar.measure(exact((c.width * d).toInt()), exact((c.height * d).toInt()))
                  val hs = halo.size(c)
                  halo.measure(exact(hs), exact(hs))
                  setMeasuredDimension(w, h)
              }

              override fun onLayout(changed: Boolean, l: Int, t: Int, r: Int, b: Int) {
                  val c = Store.cfg
                  val w = (r - l).toFloat()
                  val bx = (w / 2f + c.offX * d - c.width * d / 2f).toInt()
                  val by = (c.offY * d).toInt()
                  bar.layout(bx, by, bx + bar.measuredWidth, by + bar.measuredHeight)
                  val hs = halo.measuredWidth
                  val hx = (w / 2f + c.holeX * d - hs / 2f).toInt()
                  val hy = (c.holeY * d - hs / 2f).toInt()
                  halo.centerY = hs / 2f
                  halo.layout(hx, hy, hx + hs, hy + hs)
              }

              override fun dispatchDraw(canvas: Canvas) {
                  val c = Store.cfg
                  val w = width.toFloat()
                  val h = height.toFloat()
                  p.style = Paint.Style.FILL
                  p.shader = LinearGradient(0f, 0f, 0f, h, 0xFF2A2A3C.toInt(), 0xFF14141C.toInt(), Shader.TileMode.CLAMP)
                  canvas.drawRoundRect(0f, 0f, w, h, 18f * d, 18f * d, p)
                  p.shader = null
                  if (c.holeOn) {
                      val cx = w / 2f + c.holeX * d
                      val cy = c.holeY * d
                      val r = c.holeD * d / 2f
                      p.style = Paint.Style.FILL
                      p.color = 0xFF000000.toInt()
                      canvas.drawCircle(cx, cy, r, p)
                      p.style = Paint.Style.STROKE
                      p.strokeWidth = 1.2f * d
                      p.color = 0xFF3A3A4E.toInt()
                      canvas.drawCircle(cx, cy, r, p)
                  }
                  super.dispatchDraw(canvas)
              }
          }
