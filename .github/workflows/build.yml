          package com.example.island

          import android.animation.Animator
          import android.animation.AnimatorListenerAdapter
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.BlurMaskFilter
          import android.graphics.Canvas
          import android.graphics.CornerPathEffect
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PathMeasure
          import android.graphics.Shader
          import android.view.View
          import android.view.animation.AccelerateDecelerateInterpolator
          import android.view.animation.LinearInterpolator

          /** Barre de masquage : un contour à points réglables, rempli de la couleur choisie, avec bordure (unie, dégradée, rotative, néon) */
          class MaskView(ctx: Context) : View(ctx) {
              companion object {
                  /** Place gardée sous la forme (en pixels) pour que les points du bas puissent descendre */
                  const val EXTRA = 140

                  /** Nombre de points utilisés pour transformer une forme en une autre */
                  const val K = 240

                  /** Échantillonne un contour fermé en K points (x, y alternés), sens horaire, départ en haut à gauche */
                  fun outline(path: Path, dx: Float, dy: Float): FloatArray {
                      val pm = PathMeasure(path, true)
                      val len = pm.length
                      val raw = FloatArray(K * 2)
                      val pos = FloatArray(2)
                      for (i in 0 until K) {
                          pm.getPosTan(len * i / K, pos, null)
                          raw[i * 2] = pos[0] + dx
                          raw[i * 2 + 1] = pos[1] + dy
                      }
                      var area = 0f
                      for (i in 0 until K) {
                          val j = (i + 1) % K
                          area += raw[i * 2] * raw[j * 2 + 1] - raw[j * 2] * raw[i * 2 + 1]
                      }
                      var best = 0
                      var bv = Float.MAX_VALUE
                      for (i in 0 until K) {
                          val v = raw[i * 2] + raw[i * 2 + 1]
                          if (v < bv) {
                              bv = v
                              best = i
                          }
                      }
                      val res = FloatArray(K * 2)
                      for (i in 0 until K) {
                          val src = if (area >= 0f) (best + i) % K else ((best - i) % K + K) % K
                          res[i * 2] = raw[src * 2]
                          res[i * 2 + 1] = raw[src * 2 + 1]
                      }
                      return res
                  }
              }

              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val line = Paint(Paint.ANTI_ALIAS_FLAG)
              private val dot = Paint(Paint.ANTI_ALIAS_FLAG)
              private val border = Paint(Paint.ANTI_ALIAS_FLAG)
              private val glow = Paint(Paint.ANTI_ALIAS_FLAG)
              private var anim: ValueAnimator? = null
              private var animDur = 0L
              private var phase = 0f
              private var morphFrom: FloatArray? = null
              private var morphT = 1f
              private var morphAnim: ValueAnimator? = null

              init {
                  setLayerType(LAYER_TYPE_SOFTWARE, null)
                  fill.style = Paint.Style.FILL
                  line.style = Paint.Style.STROKE
                  line.strokeWidth = 2f
                  line.color = 0xFF18FFFF.toInt()
                  dot.style = Paint.Style.FILL
                  dot.color = 0xFFFF1744.toInt()
                  border.style = Paint.Style.STROKE
                  glow.style = Paint.Style.STROKE
              }

              /** Lance ou arrête le défilement des couleurs de la bordure selon les réglages */
              fun syncAnim(show: Boolean) {
                  val c = Store.cfg
                  val need = show && c.maskBorderOn && c.maskBorderRot && c.maskBorderN > 1
                  if (!need) {
                      anim?.cancel()
                      anim = null
                      return
                  }
                  val dur = 12000L / c.maskBorderSpeed
                  if (anim != null && animDur == dur) return
                  anim?.cancel()
                  animDur = dur
                  val a = ValueAnimator.ofFloat(0f, 1f)
                  a.duration = dur
                  a.repeatCount = ValueAnimator.INFINITE
                  a.interpolator = LinearInterpolator()
                  a.addUpdateListener {
                      phase = it.animatedValue as Float
                      invalidate()
                  }
                  anim = a
                  a.start()
              }

              /** Transforme le contour de la barre (from, en pixels écran) en celui du masque (toMask = true) ou l'inverse */
              fun startMorph(from: FloatArray, toMask: Boolean, ms: Long, end: () -> Unit) {
                  cancelMorph()
                  morphFrom = from
                  morphT = if (toMask) 0f else 1f
                  val a = ValueAnimator.ofFloat(morphT, if (toMask) 1f else 0f)
                  a.duration = ms
                  a.interpolator = AccelerateDecelerateInterpolator()
                  a.addUpdateListener {
                      morphT = it.animatedValue as Float
                      invalidate()
                  }
                  a.addListener(object : AnimatorListenerAdapter() {
                      private var cancelled = false

                      override fun onAnimationCancel(animation: Animator) {
                          cancelled = true
                      }

                      override fun onAnimationEnd(animation: Animator) {
                          if (cancelled) return
                          morphFrom = null
                          morphAnim = null
                          invalidate()
                          end()
                      }
                  })
                  morphAnim = a
                  a.start()
              }

              fun cancelMorph() {
                  morphAnim?.cancel()
                  morphAnim = null
                  morphFrom = null
              }

              override fun onDetachedFromWindow() {
                  anim?.cancel()
                  anim = null
                  cancelMorph()
                  super.onDetachedFromWindow()
              }

              /** Coordonnées réelles (en pixels de l'écran) des points : bord du haut de gauche à droite, puis bord du bas de droite à gauche */
              private fun pts(c: Config, xs: FloatArray, ys: FloatArray) {
                  val n = c.maskN
                  val x0 = (width / 2 + c.maskX - c.maskW / 2).toFloat()
                  val w = c.maskW.toFloat()
                  val yTop = c.maskY.toFloat()
                  val yBot = (c.maskY + c.maskH).toFloat()
                  for (i in 0 until n) {
                      val fx = Math.round(w * i / (n - 1)).toFloat()
                      val t = c.maskPt(true, i)
                      xs[i] = x0 + fx + t[0]
                      ys[i] = yTop + t[1]
                      val b = c.maskPt(false, i)
                      val k = n * 2 - 1 - i
                      xs[k] = x0 + fx + b[0]
                      ys[k] = yBot + b[1]
                  }
              }

              private fun buildPath(c: Config, xs: FloatArray, ys: FloatArray): Path {
                  val m = xs.size
                  val p = Path()
                  p.moveTo(xs[0], ys[0])
                  if (!c.maskSmooth) {
                      for (i in 1 until m) p.lineTo(xs[i], ys[i])
                  } else {
                      for (i in 0 until m) {
                          val i0 = (i - 1 + m) % m
                          val i2 = (i + 1) % m
                          val i3 = (i + 2) % m
                          p.cubicTo(
                              xs[i] + (xs[i2] - xs[i0]) / 6f, ys[i] + (ys[i2] - ys[i0]) / 6f,
                              xs[i2] - (xs[i3] - xs[i]) / 6f, ys[i2] - (ys[i3] - ys[i]) / 6f,
                              xs[i2], ys[i2]
                          )
                      }
                  }
                  p.close()
                  return p
              }

              private fun mix(a: Int, b: Int, t: Float): Int {
                  fun ch(s: Int): Int {
                      val x = (a shr s) and 0xFF
                      val y = (b shr s) and 0xFF
                      return (x + (y - x) * t).toInt().coerceIn(0, 255)
                  }
                  return (ch(24) shl 24) or (ch(16) shl 16) or (ch(8) shl 8) or ch(0)
              }

              /** Bordure (unie ou dégradée, néon ou non) ; a = opacité de 0 à 1 */
              private fun drawBorder(canvas: Canvas, c: Config, path: Path, pe: CornerPathEffect?, a: Float) {
                  val bw = c.maskBorderW.toFloat()
                  val k = c.maskBorderN
                  var shader: Shader? = null
                  if (k > 1) {
                      val x0 = (width / 2 + c.maskX - c.maskW / 2).toFloat()
                      val w = maxOf(1, c.maskW).toFloat()
                      val cols = IntArray(k + 1) { c.maskBorderColor(it % k) }
                      val sh = (if (c.maskBorderDir == 0) phase else -phase) * w
                      shader = LinearGradient(x0 + sh, 0f, x0 + sh + w, 0f, cols, null, Shader.TileMode.REPEAT)
                  }
                  val col = c.maskBorderColor(0)
                  val alpha = (255 * a).toInt().coerceIn(0, 255)
                  if (c.maskBorderNeon) {
                      val g = maxOf(2, c.maskGlow).toFloat()
                      glow.strokeWidth = bw + g * 0.5f
                      glow.pathEffect = pe
                      glow.shader = shader
                      glow.color = col
                      glow.alpha = alpha
                      glow.maskFilter = BlurMaskFilter(g, BlurMaskFilter.Blur.NORMAL)
                      canvas.drawPath(path, glow)
                      canvas.drawPath(path, glow)
                  }
                  border.strokeWidth = bw
                  border.pathEffect = pe
                  border.shader = shader
                  border.color = col
                  border.alpha = alpha
                  canvas.drawPath(path, border)
              }

              override fun onDraw(canvas: Canvas) {
                  val c = Store.cfg
                  val n = c.maskN
                  val xs = FloatArray(n * 2)
                  val ys = FloatArray(n * 2)
                  pts(c, xs, ys)
                  val path = buildPath(c, xs, ys)

                  // transformation en cours : le contour de la barre devient celui du masque
                  val from = morphFrom
                  if (from != null) {
                      val to = outline(path, 0f, 0f)
                      val t = morphT
                      val mp = Path()
                      for (i in 0 until K) {
                          val x = from[i * 2] + (to[i * 2] - from[i * 2]) * t
                          val y = from[i * 2 + 1] + (to[i * 2 + 1] - from[i * 2 + 1]) * t
                          if (i == 0) mp.moveTo(x, y) else mp.lineTo(x, y)
                      }
                      mp.close()
                      fill.pathEffect = null
                      fill.color = mix(c.fill, c.maskColor, t)
                      canvas.drawPath(mp, fill)
                      if (c.maskBorderOn) drawBorder(canvas, c, mp, null, t)
                      return
                  }

                  fill.color = c.maskColor
                  val pe = if (!c.maskSmooth && c.maskRound > 0) CornerPathEffect(c.maskRound.toFloat()) else null
                  fill.pathEffect = pe
                  canvas.drawPath(path, fill)
                  if (c.maskBorderOn) drawBorder(canvas, c, path, pe, 1f)

                  if (Store.maskEdit) {
                      if (c.maskGuide) {
                          line.pathEffect = pe
                          canvas.drawPath(path, line)
                      }
                      if (c.maskDot) {
                          val i = Store.maskSelIdx.coerceIn(0, n - 1)
                          val q = if (Store.maskSelTop) i else n * 2 - 1 - i
                          canvas.drawCircle(xs[q], ys[q], 7f, dot)
                      }
                  }
              }
          }
