          package com.example.island

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.BlurMaskFilter
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.SweepGradient
          import android.view.View
          import android.view.animation.LinearInterpolator
          import androidx.core.graphics.ColorUtils
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.max

          /** Halo lumineux autour de l'objectif */
          class HaloView(ctx: Context, private val engine: StatusEngine) : View(ctx) {
              private val d = ctx.resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE }
              private var t = 0f
              private var anim: ValueAnimator? = null
              private var animDur = 0L
              var centerY = -1f

              private val rainbow = intArrayOf(
                  Color.RED, Color.YELLOW, Color.GREEN, Color.CYAN, Color.BLUE, Color.MAGENTA, Color.RED
              )

              /** rouge, orange, jaune, vert, bleu, violet, rose */
              private val palette = intArrayOf(
                  0xFFFF1744.toInt(), 0xFFFF9100.toInt(), 0xFFFFEA00.toInt(), 0xFF00E676.toInt(),
                  0xFF2979FF.toInt(), 0xFFAA00FF.toInt(), 0xFFFF4081.toInt()
              )

              init {
                  setLayerType(LAYER_TYPE_SOFTWARE, null)
              }

              private fun hasNotif(): Boolean = NotifState.items.isNotEmpty()

              fun size(c: Config): Int {
                  val grow = if (c.haloPulse) (c.holeD / 2f + c.haloGap + c.haloW) * c.haloPulseGrow / 100f else 0f
                  val s = ((c.holeD / 2f + c.haloGap + c.haloW + c.haloGlow + grow + 4f) * 2f * d).toInt()
                  return s.coerceAtLeast((8 * d).toInt())
              }

              fun refresh() {
                  syncAnim()
                  invalidate()
              }

              fun syncAnim() {
                  val c = Store.cfg
                  val lit = !c.haloOnNotif || hasNotif()
                  val need = c.holeOn && c.haloOn && lit &&
                      (c.haloPulse || c.haloCycle || (c.haloStyle in 1..3) || (c.haloStyle == 4 && c.haloGradRotate)) &&
                      isAttachedToWindow && visibility == VISIBLE
                  if (!need) {
                      anim?.cancel()
                      anim = null
                      return
                  }
                  val dur = c.haloSpeed.toLong().coerceAtLeast(300L)
                  if (anim != null && animDur == dur) return
                  anim?.cancel()
                  animDur = dur
                  anim = ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = dur
                      repeatCount = ValueAnimator.INFINITE
                      interpolator = LinearInterpolator()
                      addUpdateListener {
                          t = it.animatedValue as Float
                          invalidate()
                      }
                      start()
                  }
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  syncAnim()
              }

              override fun onDetachedFromWindow() {
                  anim?.cancel()
                  anim = null
                  super.onDetachedFromWindow()
              }

              private fun bump(x: Float, center: Float, w: Float): Float = max(0f, 1f - abs(x - center) / w)

              private fun cycleColor(ms: Int, step: Boolean): Int {
                  val ph = (System.currentTimeMillis() % ms.toLong()).toFloat() / ms.toFloat()
                  val n = palette.size
                  val x = ph * n
                  val i = x.toInt() % n
                  if (step) return palette[i]
                  return ColorUtils.blendARGB(palette[i], palette[(i + 1) % n], x - x.toInt())
              }

              override fun onDraw(canvas: Canvas) {
                  val c = Store.cfg
                  if (!c.holeOn || !c.haloOn) return
                  if (c.haloOnNotif && !hasNotif()) return
                  val cx = width / 2f
                  val cy = if (centerY >= 0f) centerY else height / 2f

                  // pulsation : 0 douce, 1 clignotement, 2 battement de coeur
                  var pv = 1f
                  if (c.haloPulse) {
                      val per = c.haloPulseSpeed.coerceAtLeast(200).toLong()
                      val pt = (System.currentTimeMillis() % per).toFloat() / per.toFloat()
                      pv = when (c.haloPulseShape) {
                          1 -> if (pt < 0.5f) 1f else 0f
                          2 -> max(bump(pt, 0.10f, 0.10f), bump(pt, 0.32f, 0.08f))
                          else -> 0.5f - 0.5f * cos(2.0 * Math.PI * pt).toFloat()
                      }
                  }
                  val minA = c.haloPulseMin / 100f
                  val pulse = if (c.haloPulse) minA + (1f - minA) * pv else 1f
                  val grow = if (c.haloPulse) 1f + c.haloPulseGrow / 100f * pv else 1f

                  val r = (c.holeD / 2f + c.haloGap + c.haloW / 2f) * d * grow
                  val sw = c.haloW * d

                  var color = c.haloColor
                  if (c.haloCycle) {
                      color = cycleColor(c.haloCycleMs.coerceAtLeast(500), c.haloCycleStep)
                  } else if (c.haloReactive) {
                      val b = engine.batt()
                      color = if (b.plugged) tc("halo_charge", Pal.GREEN) else if (b.pct <= 15) tc("halo_low", Pal.RED) else c.haloColor
                  }
                  val baseAlpha = Color.alpha(color)

                  p.shader = null
                  p.pathEffect = null
                  p.maskFilter = null
                  p.color = color
                  canvas.save()
                  when (c.haloStyle) {
                      1 -> p.pathEffect = DashPathEffect(floatArrayOf(5f * d, 5f * d), t * 20f * d)
                      2 -> {
                          canvas.rotate(t * 360f, cx, cy)
                          p.shader = SweepGradient(cx, cy, intArrayOf(color and 0x00FFFFFF, color), floatArrayOf(0f, 1f))
                      }
                      3 -> {
                          canvas.rotate(t * 360f, cx, cy)
                          p.shader = SweepGradient(cx, cy, rainbow, null)
                      }
                      4 -> {
                          val n = c.haloGradCount.coerceIn(2, 6)
                          val cols = IntArray(n) { c.haloGradColor(it) }
                          canvas.rotate(c.haloGradAngle.toFloat() + (if (c.haloGradRotate) t * 360f else 0f), cx, cy)
                          if (c.haloGradSmooth) {
                              val arr = IntArray(n + 1) { cols[it % n] }
                              p.shader = SweepGradient(cx, cy, arr, null)
                          } else {
                              val arr = IntArray(n * 2)
                              val pos = FloatArray(n * 2)
                              for (i in 0 until n) {
                                  arr[2 * i] = cols[i]
                                  arr[2 * i + 1] = cols[i]
                                  pos[2 * i] = i.toFloat() / n
                                  pos[2 * i + 1] = (i + 1).toFloat() / n
                              }
                              pos[0] = 0f
                              pos[n * 2 - 1] = 1f
                              p.shader = SweepGradient(cx, cy, arr, pos)
                          }
                      }
                  }
                  val glow = c.haloGlow * d
                  if (glow > 0.5f) {
                      p.maskFilter = BlurMaskFilter(glow, BlurMaskFilter.Blur.NORMAL)
                      p.strokeWidth = sw * 1.8f
                      p.alpha = (baseAlpha * 0.55f * pulse).toInt()
                      canvas.drawCircle(cx, cy, r, p)
                      p.maskFilter = null
                  }
                  p.strokeWidth = sw
                  p.alpha = (baseAlpha * pulse).toInt()
                  canvas.drawCircle(cx, cy, r, p)
                  canvas.restore()
                  p.shader = null
                  p.pathEffect = null
              }
          }
