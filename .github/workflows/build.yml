      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E '^e: ' build.log | sed 's#file:///[^ ]*/##' | head -20 | while IFS= read -r l; do echo "::error::$l"; done || true
          grep -A6 'What went wrong' build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done || true
      - name: Rename APK with version number
        id: ver
        run: |
          V=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          C=$(grep -m1 'versionCode' app/build.gradle.kts | sed 's/[^0-9]//g')
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/CustomIsland-v${V}-build${C}.apk"
          echo "name=CustomIsland-v${V}-build${C}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: out/*.apk
