          package com.example.island

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var prefs: Prefs
              private lateinit var status: TextView
              private lateinit var signalList: LinearLayout
              private lateinit var bg1: LinearLayout
              private lateinit var bg3: LinearLayout
              private lateinit var appsList: LinearLayout
              private val handler = Handler(Looper.getMainLooper())

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              /** Applique les réglages à l'encoche, en direct */
              private fun reloadIsland() {
                  IslandAccessibilityService.instance?.reload()
              }

              /** Relit le niveau de signal et remet la LED à sa vraie couleur */
              private fun restoreLed() {
                  IslandAccessibilityService.instance?.refreshSource()
              }

              private fun hasPhonePermission() =
                  checkSelfPermission(Manifest.permission.READ_PHONE_STATE) == PackageManager.PERMISSION_GRANTED

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = Prefs(this)

                  // Le niveau de signal a besoin de l'autorisation Téléphone : on la demande dès le début
                  if (!hasPhonePermission()) {
                      requestPermissions(arrayOf(Manifest.permission.READ_PHONE_STATE), 7)
                  }

                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(40), dp(20), dp(40))
                  }

                  col.addView(TextView(this).apply {
                      text = "Custom Island"
                      textSize = 26f
                  })
                  status = TextView(this).apply { setPadding(0, dp(12), 0, 0) }
                  col.addView(status)

                  col.addView(button("1. Activer l'île (service d'accessibilité)") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })
                  col.addView(button("2. Autoriser « Téléphone » (niveau de signal)") { askPhone() })
                  col.addView(button("3. Activer l'accès aux notifications (icônes)") {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  })

                  // ----- Encoche : forme (réglages en pixels, en direct) -----
                  col.addView(section("Encoche : forme, réglage au pixel près en direct"))
                  col.addView(seek("Largeur", 20, 200, { prefs.width }, { prefs.width = it }))
                  col.addView(seek("Hauteur", 16, 80, { prefs.height }, { prefs.height = it }))
                  col.addView(seek("Évasement du haut", 0, 30, { prefs.flare }, { prefs.flare = it }))
                  col.addView(seek("Arrondi du bas", 0, 60, { prefs.bottomRadius }, { prefs.bottomRadius = it }))
                  col.addView(seek("Position horizontale (0 = centre)", -200, 200, { prefs.xOffset }, { prefs.xOffset = it }))
                  bg1 = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(bg1)

                  // ----- LED -----
                  col.addView(section("LED (niveau du signal mobile)"))
                  col.addView(switch("LED activée", prefs.ledEnabled) {
                      prefs.ledEnabled = it; reloadIsland()
                  })
                  col.addView(seek("LED : largeur", 2, 60, { prefs.ledWidth }, { prefs.ledWidth = it }))
                  col.addView(seek("LED : hauteur", 2, 60, { prefs.ledHeight }, { prefs.ledHeight = it }))
                  col.addView(seek("LED : arrondi", 0, 30, { prefs.ledRadius }, { prefs.ledRadius = it }))
                  col.addView(seek("LED : position horizontale (0 = centre)", -100, 100, { prefs.ledX }, { prefs.ledX = it }))
                  col.addView(seek("LED : position verticale (0 = centre)", -50, 50, { prefs.ledY }, { prefs.ledY = it }))
                  col.addView(button("Tester la LED (6 s)") {
                      IslandBus.update(Color.GREEN, 1)
                      handler.postDelayed({ restoreLed() }, 6000)
                  })

                  // ----- Couleurs du signal mobile -----
                  col.addView(section("Couleurs de la LED selon le signal (touche pour changer, clignote à 0/4)"))
                  signalList = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(signalList)

                  // ----- Encoche notifications (icônes) -----
                  col.addView(section("Encoche notifications (icônes) : forme, réglage au pixel près en direct"))
                  col.addView(switch("Encoche notifications activée", prefs.ntEnabled) { prefs.ntEnabled = it; reloadIsland() })
                  col.addView(seek("Largeur", 40, 300, { prefs.ntWidth }, { prefs.ntWidth = it }))
                  col.addView(seek("Hauteur", 16, 80, { prefs.ntHeight }, { prefs.ntHeight = it }))
                  col.addView(seek("Évasement du haut", 0, 30, { prefs.ntFlare }, { prefs.ntFlare = it }))
                  col.addView(seek("Arrondi du bas", 0, 60, { prefs.ntRadius }, { prefs.ntRadius = it }))
                  col.addView(seek("Position horizontale (0 = centre)", -200, 200, { prefs.ntX }, { prefs.ntX = it }))
                  bg3 = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(bg3)
                  col.addView(switch("Cacher la forme quand il n'y a aucune notification", prefs.ntHideEmpty) {
                      prefs.ntHideEmpty = it; reloadIsland()
                  })

                  col.addView(section("Icônes"))
                  col.addView(seek("Nombre d'icônes max (replié)", 1, 12, { prefs.ntMaxIcons }, { prefs.ntMaxIcons = it }, " icônes"))
                  col.addView(seek("Taille des icônes (replié)", 8, 48, { prefs.ntIconSize }, { prefs.ntIconSize = it }))
                  col.addView(seek("Espacement entre les icônes", 0, 20, { prefs.ntIconGap }, { prefs.ntIconGap = it }))
                  col.addView(switch("Pastille avec le nombre de notifications", prefs.ntShowBadge) {
                      prefs.ntShowBadge = it; reloadIsland()
                  })

                  col.addView(section("Panneau déployé (quand tu glisses vers le bas)"))
                  col.addView(seek("Largeur", 100, 400, { prefs.ntExpWidth }, { prefs.ntExpWidth = it }))
                  col.addView(seek("Hauteur", 40, 400, { prefs.ntExpHeight }, { prefs.ntExpHeight = it }))
                  col.addView(seek("Position horizontale (0 = centre)", -200, 200, { prefs.ntExpX }, { prefs.ntExpX = it }))
                  col.addView(seek("Taille des icônes (déployé)", 16, 64, { prefs.ntExpIconSize }, { prefs.ntExpIconSize = it }))
                  col.addView(seek("Repli automatique (0 = jamais)", 0, 30, { prefs.ntAutoCollapse }, { prefs.ntAutoCollapse = it }, " s"))

                  col.addView(section("Zone de glissement : là où tu touches pour déployer (bleue quand l'appli est ouverte)"))
                  col.addView(seek("Largeur", 20, 300, { prefs.zoneWidth }, { prefs.zoneWidth = it }))
                  col.addView(seek("Hauteur", 10, 150, { prefs.zoneHeight }, { prefs.zoneHeight = it }))
                  col.addView(seek("Position horizontale (0 = centre)", -200, 200, { prefs.zoneX }, { prefs.zoneX = it }))
                  col.addView(seek("Position verticale", 0, 150, { prefs.zoneY }, { prefs.zoneY = it }))
                  col.addView(switch("Toujours afficher la zone en bleu", prefs.zoneAlways) {
                      prefs.zoneAlways = it; reloadIsland()
                  })

                  col.addView(section("Applis : priorité et blocage"))
                  appsList = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(appsList)
                  col.addView(button("+ Ajouter une appli prioritaire") { addApp() })
                  col.addView(button("Tester avec des icônes factices (8 s)") { testIcons() })

                  setContentView(ScrollView(this).apply { addView(col) })
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  prefs.askedPhone = true
                  restoreLed()
                  refreshStatus()
              }

              override fun onPause() {
                  super.onPause()
                  NotifState.zoneHint = false
                  reloadIsland()
              }

              override fun onResume() {
                  super.onResume()
                  NotifState.zoneHint = true
                  reloadIsland()
                  refreshStatus()
                  refreshBg()
                  refreshSignal()
                  refreshApps()
              }

              private fun refreshStatus() {
                  val acc = IslandAccessibilityService.instance != null
                  status.text = "Île : " + (if (acc) "active ✔" else "inactive ✘") +
                      "\nAutorisation Téléphone : " + (if (hasPhonePermission()) "accordée ✔" else "refusée ✘") +
                      "\nAccès aux notifications : " + (if (NotifListener.instance != null) "actif ✔" else "inactif ✘")
              }

              /** Redemande l'autorisation Téléphone, ou ouvre les réglages de l'appli si elle est bloquée */
              private fun askPhone() {
                  if (hasPhonePermission()) {
                      restoreLed()
                      refreshStatus()
                      return
                  }
                  if (prefs.askedPhone &&
                      !shouldShowRequestPermissionRationale(Manifest.permission.READ_PHONE_STATE)
                  ) {
                      startActivity(
                          Intent(
                              Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                              android.net.Uri.parse("package:$packageName")
                          )
                      )
                  } else {
                      requestPermissions(arrayOf(Manifest.permission.READ_PHONE_STATE), 7)
                  }
              }

              // ---------- Couleur du fond (cercle chromatique) ----------

              private fun refreshBg() {
                  bg1.removeAllViews()
                  bg1.addView(row("Couleur de la forme", "touche pour choisir", prefs.bgColor) {
                      pickBg("Couleur de la forme", { prefs.bgColor }, { prefs.bgColor = it })
                  })
                  bg3.removeAllViews()
                  bg3.addView(row("Couleur de la forme", "touche pour choisir", prefs.ntBg) {
                      pickBg("Couleur de la forme", { prefs.ntBg }, { prefs.ntBg = it })
                  })
              }

              /** Choix du fond avec aperçu direct sur l'encoche, annulé si on ferme sans valider */
              private fun pickBg(title: String, get: () -> Int, set: (Int) -> Unit) {
                  val original = get()
                  var ok = false
                  pickColor(
                      title, original,
                      { c ->
                          ok = true
                          set(c)
                          reloadIsland()
                          refreshBg()
                      },
                      null,
                      onPreview = { pc ->
                          if (pc != 0) {
                              set(pc)
                              reloadIsland()
                          } else if (!ok) {
                              set(original)
                              reloadIsland()
                          }
                      }
                  )
              }

              // ---------- Couleurs du signal ----------

              private fun refreshSignal() {
                  signalList.removeAllViews()
                  val names = listOf(
                      "Aucun signal (0/4)", "Très faible (1/4)", "Faible (2/4)", "Bon (3/4)", "Excellent (4/4)"
                  )
                  names.forEachIndexed { i, n ->
                      val c = prefs.signalColor(i)
                      signalList.addView(row(n, "", c) {
                          pickColor(n, c, { nc ->
                              prefs.setSignalColor(i, nc)
                              refreshSignal()
                              restoreLed()
                          }, null)
                      })
                  }
              }

              // ---------- Applis : priorité et blocage ----------

              private fun appLabel(pkg: String): String = try {
                  packageManager.getApplicationLabel(packageManager.getApplicationInfo(pkg, 0)).toString()
              } catch (_: Exception) {
                  pkg
              }

              private fun appIcon(pkg: String): android.graphics.drawable.Drawable? = try {
                  packageManager.getApplicationIcon(pkg)
              } catch (_: Exception) {
                  null
              }

              private fun change(action: () -> Unit) {
                  action()
                  refreshApps()
                  reloadIsland()
              }

              private fun subtitle(t: String) = TextView(this).apply {
                  text = t
                  textSize = 13f
                  setTextColor(Color.GRAY)
                  setPadding(0, dp(14), 0, dp(4))
              }

              private fun appRow(pkg: String, buttons: List<Pair<String, () -> Unit>>): LinearLayout {
                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(4), 0, dp(4))
                  }
                  val iv = ImageView(this)
                  iv.setImageDrawable(appIcon(pkg))
                  r.addView(iv, LinearLayout.LayoutParams(dp(36), dp(36)).apply { marginEnd = dp(10) })
                  val t = TextView(this)
                  t.text = appLabel(pkg)
                  t.textSize = 15f
                  t.maxLines = 1
                  r.addView(t, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  buttons.forEach { (label, action) ->
                      r.addView(stepButton(label) { change(action) }, LinearLayout.LayoutParams(dp(42), dp(40)))
                  }
                  return r
              }

              private fun refreshApps() {
                  appsList.removeAllViews()
                  val prio = prefs.prioOrder()
                  val blocked = prefs.blockedPackages
                  val normal = (prefs.seenPackages - prio.toSet() - blocked).sortedBy { appLabel(it).lowercase() }

                  appsList.addView(subtitle("★ Prioritaires (la première est la plus importante)"))
                  if (prio.isEmpty()) appsList.addView(subtitle("Aucune. Utilise ★ ou le bouton ci-dessous."))
                  prio.forEach { pkg ->
                      appsList.addView(
                          appRow(
                              pkg,
                              listOf(
                                  "▲" to { prefs.moveUp(pkg) },
                                  "▼" to { prefs.moveDown(pkg) },
                                  "✕" to { prefs.unprioritize(pkg) },
                                  "🚫" to { prefs.block(pkg) }
                              )
                          )
                      )
                  }

                  appsList.addView(subtitle("Normales (celles qui t'ont notifié, triées par arrivée)"))
                  if (normal.isEmpty()) appsList.addView(subtitle("Aucune pour l'instant."))
                  normal.forEach { pkg ->
                      appsList.addView(
                          appRow(
                              pkg,
                              listOf(
                                  "★" to { prefs.prioritize(pkg) },
                                  "🚫" to { prefs.block(pkg) }
                              )
                          )
                      )
                  }

                  appsList.addView(subtitle("🚫 Bloquées (jamais affichées)"))
                  if (blocked.isEmpty()) appsList.addView(subtitle("Aucune."))
                  blocked.sortedBy { appLabel(it).lowercase() }.forEach { pkg ->
                      appsList.addView(appRow(pkg, listOf("↩" to { prefs.unblock(pkg) })))
                  }
              }

              private fun addApp() {
                  val pm = packageManager
                  val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(intent, 0)
                      .map { it.loadLabel(pm).toString() to it.activityInfo.packageName }
                      .distinctBy { it.second }
                      .sortedBy { it.first.lowercase() }
                  AlertDialog.Builder(this)
                      .setTitle("Choisir une appli prioritaire")
                      .setItems(apps.map { it.first }.toTypedArray()) { _, i ->
                          change { prefs.prioritize(apps[i].second) }
                      }
                      .show()
              }

              /** Affiche de fausses notifications pour tester la forme, les icônes et le déploiement */
              private fun testIcons() {
                  val pm = packageManager
                  val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val pkgs = pm.queryIntentActivities(intent, 0)
                      .map { it.activityInfo.packageName }
                      .distinct()
                      .filter { it != packageName }
                      .take(9)
                  val now = System.currentTimeMillis()
                  NotifState.update(pkgs.mapIndexed { i, p -> NotifItem(p, 1 + i % 3, now - i * 1000L, null) })
                  handler.postDelayed({
                      val l = NotifListener.instance
                      if (l != null) l.recompute() else NotifState.update(emptyList())
                  }, 8000)
              }

              private fun hexOf(c: Int) = String.format("#%06X", c and 0xFFFFFF)

              /** Sélecteur de couleur libre (cercle chromatique + luminosité), aperçu en direct */
              private fun pickColor(
                  title: String,
                  current: Int,
                  onOk: (Int) -> Unit,
                  onRemove: (() -> Unit)?,
                  onPreview: ((Int) -> Unit)? = null
              ) {
                  var color = if (current == 0) Color.WHITE else current
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(8), dp(20), dp(8))
                  }
                  val previewView = View(this)
                  previewView.setBackgroundColor(color)
                  box.addView(previewView, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(44)))

                  val hex = TextView(this).apply {
                      gravity = Gravity.CENTER
                      setPadding(0, dp(6), 0, dp(6))
                  }

                  fun choose(c: Int) {
                      color = c
                      previewView.setBackgroundColor(c)
                      hex.text = hexOf(c)
                      if (onPreview != null) onPreview(c) else IslandBus.update(c, 1)
                  }

                  val wheel = ColorWheelView(this) { c -> choose(c) }
                  wheel.setColor(color)
                  box.addView(hex)
                  box.addView(
                      wheel,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  box.addView(TextView(this).apply {
                      text = "Luminosité"
                      setPadding(0, dp(10), 0, 0)
                  })
                  val hsv = FloatArray(3)
                  Color.colorToHSV(color, hsv)
                  val bright = SeekBar(this)
                  bright.max = 100
                  bright.progress = (hsv[2] * 100).toInt()
                  bright.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          if (fromUser) wheel.setBrightness(p / 100f)
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  box.addView(bright)

                  // Couleurs prédéfinies : rouge, orange, jaune, vert, bleu, violet, rose
                  val presets = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, dp(10), 0, dp(4))
                  }
                  listOf("#FF0000", "#FF8C00", "#FFFF00", "#00FF00", "#0066FF", "#8000FF", "#FF4DA6")
                      .forEach { hexColor ->
                          val pc = Color.parseColor(hexColor)
                          val sw = View(this)
                          sw.background = GradientDrawable().apply {
                              shape = GradientDrawable.RECTANGLE
                              cornerRadius = dp(8).toFloat()
                              setColor(pc)
                              setStroke(dp(1), Color.GRAY)
                          }
                          sw.setOnClickListener {
                              wheel.setColor(pc)
                              bright.progress = 100
                              choose(pc)
                          }
                          presets.addView(sw, LinearLayout.LayoutParams(0, dp(36), 1f).apply {
                              setMargins(dp(2), 0, dp(2), 0)
                          })
                      }
                  box.addView(presets, 2)

                  val mute = Switch(this)
                  mute.text = "Pas de LED"
                  mute.isChecked = current == 0
                  mute.setPadding(0, dp(14), 0, dp(8))
                  box.addView(mute)
                  if (onPreview != null) mute.visibility = View.GONE

                  IslandBus.hold = true
                  choose(color)

                  val b = AlertDialog.Builder(this)
                      .setTitle(title)
                      .setView(ScrollView(this).apply { addView(box) })
                      .setPositiveButton("OK") { _, _ -> onOk(if (mute.isChecked) 0 else color) }
                      .setNegativeButton("Annuler", null)
                  if (onRemove != null) b.setNeutralButton("Supprimer") { _, _ -> onRemove() }
                  b.setOnDismissListener {
                      IslandBus.hold = false
                      onPreview?.invoke(0)
                      restoreLed()
                  }
                  b.show()
              }

              // ---------- Petits helpers d'UI ----------

              private fun row(title: String, sub: String, color: Int, onClick: () -> Unit): LinearLayout {
                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(8), 0, dp(8))
                      setOnClickListener { onClick() }
                  }
                  val sw = TextView(this).apply {
                      gravity = Gravity.CENTER
                      text = if (color == 0) "✕" else ""
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(if (color == 0) Color.LTGRAY else color)
                          setStroke(dp(1), Color.GRAY)
                      }
                  }
                  val t = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  t.addView(TextView(this).apply {
                      text = title
                      textSize = 16f
                  })
                  if (sub.isNotEmpty()) {
                      t.addView(TextView(this).apply {
                          text = sub
                          textSize = 11f
                          setTextColor(Color.GRAY)
                      })
                  }
                  r.addView(sw, LinearLayout.LayoutParams(dp(32), dp(32)).apply { marginEnd = dp(14) })
                  r.addView(t)
                  return r
              }

              private fun section(t: String) = TextView(this).apply {
                  text = t
                  textSize = 15f
                  setPadding(0, dp(24), 0, dp(6))
              }

              private fun button(t: String, onClick: () -> Unit) = Button(this).apply {
                  text = t
                  isAllCaps = false
                  layoutParams = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { topMargin = dp(10) }
                  setOnClickListener { onClick() }
              }

              private fun switch(t: String, checked: Boolean, onChange: (Boolean) -> Unit) = Switch(this).apply {
                  text = t
                  isChecked = checked
                  setPadding(0, dp(8), 0, dp(8))
                  setOnCheckedChangeListener { _, c -> onChange(c) }
              }

              private fun stepButton(label: String, onClick: () -> Unit) = Button(this).apply {
                  text = label
                  textSize = 20f
                  isAllCaps = false
                  setPadding(0, 0, 0, 0)
                  minWidth = 0
                  minHeight = 0
                  minimumWidth = 0
                  minimumHeight = 0
                  setOnClickListener { onClick() }
              }

              /**
               * Curseur avec un − et un + à chaque bout pour régler au pixel près.
               * Les bornes sont données en dp, les valeurs sont en pixels.
               */
              private fun seek(
                  title: String,
                  loIn: Int,
                  hiIn: Int,
                  get: () -> Int,
                  set: (Int) -> Unit,
                  rawUnit: String? = null
              ): LinearLayout {
                  // rawUnit == null : bornes en dp, valeurs en pixels. Sinon : valeurs brutes (ex. " s", " icônes").
                  val lo = if (rawUnit == null) dp(loIn) else loIn
                  val hi = if (rawUnit == null) dp(hiIn) else hiIn
                  val unit = rawUnit ?: " px"

                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val tv = TextView(this).apply {
                      text = "$title : ${get()}$unit"
                      setPadding(0, dp(12), 0, 0)
                  }
                  val sb = SeekBar(this)
                  sb.max = hi - lo
                  sb.progress = (get() - lo).coerceIn(0, hi - lo)
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          set(p + lo)
                          tv.text = "$title : ${p + lo}$unit"
                          if (fromUser) reloadIsland()
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })

                  fun nudge(delta: Int) {
                      val nv = (get() + delta).coerceIn(lo, hi)
                      sb.progress = nv - lo
                      set(nv)
                      tv.text = "$title : $nv$unit"
                      reloadIsland()
                  }

                  val line = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  line.addView(stepButton("−") { nudge(-1) }, LinearLayout.LayoutParams(dp(48), dp(44)))
                  line.addView(sb, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  line.addView(stepButton("+") { nudge(1) }, LinearLayout.LayoutParams(dp(48), dp(44)))

                  box.addView(tv)
                  box.addView(line)
                  return box
              }
          }
