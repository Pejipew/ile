          package com.example.island

          import android.os.Handler
          import android.os.Looper

          /** Pont entre l'écoute des notifications et l'île */
          object IslandBus {
              @Volatile
              var ledColor: Int = 0 // 0 = LED éteinte

              @Volatile
              var count: Int = 0

              /** Vrai : la LED clignote franchement (ex : plus de signal mobile) */
              @Volatile
              var blink: Boolean = false

              /** Vrai pendant l'aperçu d'une couleur : les mises à jour automatiques attendent */
              @Volatile
              var hold: Boolean = false

              var onChange: (() -> Unit)? = null
              private val main = Handler(Looper.getMainLooper())

              fun update(color: Int, count: Int, blink: Boolean = false) {
                  ledColor = color
                  this.count = count
                  this.blink = blink
                  main.post { onChange?.invoke() }
              }
          }
          KOTLIN_EOF
          mkdir -p app/src/main/java/com/example/island
          cat > app/src/main/java/com/example/island/IslandController.kt <<'KOTLIN_EOF'
          package com.example.island

          import android.content.Context
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.telephony.TelephonyManager
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout

          /** Forme d'encoche accrochée en haut de l'écran, avec une LED au centre */
          class IslandController(private val ctx: Context, private val windowType: Int) {

              private val wm = ctx.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private val prefs = Prefs(ctx)
              private val handler = Handler(Looper.getMainLooper())
              private val bg = IslandDrawable()
              private val ledView = View(ctx)
              private var root: FrameLayout? = null
              private var lp: WindowManager.LayoutParams? = null

              private var blinking = false
              private var blinkOn = false
              private val blinker = object : Runnable {
                  override fun run() {
                      if (!blinking) return
                      blinkOn = !blinkOn
                      ledView.alpha = if (blinkOn) 1f else 0f
                      handler.postDelayed(this, 500)
                  }
              }

              private fun stopBlink() {
                  if (blinking) {
                      blinking = false
                      handler.removeCallbacks(blinker)
                  }
              }

              private val signalPoll = object : Runnable {
                  override fun run() {
                      if (!IslandBus.hold) {
                          val level = signalLevel()
                          if (level < 0) IslandBus.update(0, 0)
                          else IslandBus.update(prefs.signalColor(level), level, level == 0)
                      }
                      handler.postDelayed(this, 2000)
                  }
              }

              /** Niveau de signal de 0 à 4, ou -1 si indisponible (permission refusée, etc.) */
              private fun signalLevel(): Int {
                  if (Build.VERSION.SDK_INT < 28) return -1
                  return try {
                      val tm = ctx.getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
                      tm.signalStrength?.level ?: 0
                  } catch (_: Exception) {
                      -1
                  }
              }

              /** (Re)lance la lecture du niveau de signal */
              fun updateSource() {
                  handler.removeCallbacks(signalPoll)
                  signalPoll.run()
              }

              fun start() {
                  stop()
                  (ledView.parent as? android.view.ViewGroup)?.removeView(ledView)
                  val v = FrameLayout(ctx).apply { background = bg }
                  v.addView(ledView, FrameLayout.LayoutParams(prefs.ledWidth, prefs.ledHeight, Gravity.CENTER))

                  val params = WindowManager.LayoutParams(
                      prefs.width,
                      prefs.height,
                      windowType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      if (Build.VERSION.SDK_INT >= 30) {
                          layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                      } else if (Build.VERSION.SDK_INT >= 28) {
                          layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                  }
                  root = v
                  lp = params
                  wm.addView(v, params)
                  applyLive()
                  updateSource()
              }

              fun stop() {
                  handler.removeCallbacksAndMessages(null)
                  blinking = false
                  root?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  root = null
              }

              /** Relit tous les réglages (en pixels) et met la fenêtre à jour immédiatement */
              fun applyLive() {
                  val v = root ?: return
                  val params = lp ?: return

                  bg.set(prefs.flare.toFloat(), prefs.bottomRadius.toFloat(), prefs.bgColor)

                  val ledLp = ledView.layoutParams as FrameLayout.LayoutParams
                  ledLp.width = prefs.ledWidth
                  ledLp.height = prefs.ledHeight
                  ledLp.gravity = Gravity.CENTER
                  ledView.layoutParams = ledLp
                  ledView.translationX = prefs.ledX.toFloat()
                  ledView.translationY = prefs.ledY.toFloat()

                  params.width = prefs.width
                  params.height = prefs.height
                  params.x = prefs.xOffset
                  params.y = 0
                  try { wm.updateViewLayout(v, params) } catch (_: Exception) {}

                  refreshLed()
              }

              fun refreshLed() {
                  val v = root ?: return
                  val c = IslandBus.ledColor
                  val on = prefs.ledEnabled && c != 0

                  if (on) {
                      ledView.visibility = View.VISIBLE
                      ledView.background = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          cornerRadius = prefs.ledRadius.toFloat()
                          setColor(c)
                      }
                      if (IslandBus.blink) {
                          // clignotement franc (ex : plus de signal)
                          if (!blinking) {
                              blinking = true
                              handler.post(blinker)
                          }
                      } else {
                          stopBlink()
                          ledView.alpha = 1f
                      }
                  } else {
                      stopBlink()
                      ledView.alpha = 1f
                      ledView.visibility = View.INVISIBLE
                  }
              }
          }
