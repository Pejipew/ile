      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E '^e: ' build.log | sed 's#file:///[^ ]*/##' | head -20 | while IFS= read -r l; do echo "::error::$l"; done || true
          grep -A6 'What went wrong' build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: CustomIsland-apk
          path: app/build/outputs/apk/debug/app-debug.apk
