          package com.example.island

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.content.res.Configuration
          import android.view.accessibility.AccessibilityEvent
          import android.view.inputmethod.InputMethodManager

          class IslandAccessibilityService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instance: IslandAccessibilityService? = null
              }

              private var controller: BarController? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  Store.ensure(this)
                  val c = BarController(this)
                  controller = c
                  NotifState.onChange = { c.refresh() }
                  c.start()
              }

              /** Appelé par l'appli de réglage après chaque modification */
              fun reload() {
                  controller?.apply()
              }

              fun playTest(key: String?) {
                  controller?.playTest(key)
              }

              fun detect(cb: (IntArray?) -> Unit) {
                  val c = controller
                  if (c == null) cb(null) else c.detectCutout(cb)
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  controller?.apply()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null || event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return
                  val cls = event.className?.toString() ?: ""
                  if (pkg == "com.android.systemui" || pkg == "android") return
                  if (cls.startsWith("android.widget.") || cls.startsWith("android.inputmethodservice.")) return
                  if (pkg == packageName && !cls.endsWith("MainActivity")) return
                  if (isKeyboard(pkg)) return
                  controller?.setForeground(pkg)
              }

              /** Les claviers ouvrent leur propre fenêtre : on ne les prend pas pour l'appli au premier plan */
              private fun isKeyboard(pkg: String): Boolean {
                  return try {
                      val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                      imm.enabledInputMethodList.any { it.packageName == pkg }
                  } catch (e: Exception) {
                      false
                  }
              }

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  NotifState.onChange = null
                  controller?.stop()
                  controller = null
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  controller?.stop()
                  controller = null
                  instance = null
                  super.onDestroy()
              }
          }
