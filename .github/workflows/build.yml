          /** Décalage [dx, dy] en pixels du point i du bord du haut (top = true) ou du bord du bas */
          fun maskPt(top: Boolean, i: Int): IntArray {
              val a = j.optJSONArray(if (top) "mktop" else "mkbot")
              if (a == null || a.length() < i * 2 + 2) return intArrayOf(0, 0)
              return intArrayOf(a.optInt(i * 2, 0), a.optInt(i * 2 + 1, 0))
          }

          fun setMaskPt(top: Boolean, i: Int, dx: Int, dy: Int) {
              val k = if (top) "mktop" else "mkbot"
              val old = j.optJSONArray(k)
              val n = maxOf(25, i + 1)
              val a = JSONArray()
              for (q in 0 until n * 2) a.put(if (old != null) old.optInt(q, 0) else 0)
              a.put(i * 2, dx)
              a.put(i * 2 + 1, dy)
              j.put(k, a)
              Store.rev++
          }

          fun resetMaskPts() {
              j.remove("mktop")
              j.remove("mkbot")
              Store.rev++
          }

          /** Recopie le côté gauche sur le côté droit (miroir) */
          fun mirrorMaskPts() {
              val n = maskN
              for (top in listOf(true, false)) {
                  for (i in 0 until n / 2) {
                      val q = maskPt(top, i)
                      setMaskPt(top, n - 1 - i, -q[0], q[1])
                  }
              }
          }
