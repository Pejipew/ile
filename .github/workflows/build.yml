          package com.example.island

          import android.graphics.Path
          import android.graphics.RectF
          import java.util.Random
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin

          /** Construit le contour de la barre selon la forme choisie */
          object Shapes {

              fun build(c: Config, w: Float, h: Float, d: Float, phase: Float): Path {
                  return when (c.shape) {
                      0 -> Path().apply { addRect(0f, 0f, w, h, Path.Direction.CW) }
                      1 -> roundRect(w, h, min(c.radius * d, min(w / 2f, h / 2f)))
                      2 -> roundRect(w, h, h / 2f)
                      3 -> Path().apply { addOval(RectF(0f, 0f, w, h), Path.Direction.CW) }
                      4 -> flared(w, h, c.flare * d, c.radius * d)
                      5 -> wave(c, w, h, d, phase)
                      6 -> blob(w / 2f, h / 2f, w / 2f, h / 2f, max(4, c.lobes), c.rough / 100f * 0.7f, Random(c.seed.toLong()))
                      else -> multi(c, w, h, d)
                  }
              }

              private fun roundRect(w: Float, h: Float, r: Float): Path {
                  val p = Path()
                  p.addRoundRect(RectF(0f, 0f, w, h), r, r, Path.Direction.CW)
                  return p
              }

              private fun flared(w: Float, h: Float, flare: Float, radius: Float): Path {
                  val f = max(0f, min(flare, min(w / 4f, h / 2f)))
                  val bodyW = w - 2f * f
                  val r = max(0f, min(radius, min(bodyW / 2f, h - f)))
                  val p = Path()
                  p.moveTo(0f, 0f)
                  p.lineTo(w, 0f)
                  if (f > 0.5f) p.arcTo(RectF(w - f, 0f, w + f, 2f * f), 270f, -90f)
                  if (r > 0.5f) {
                      p.lineTo(w - f, h - r)
                      p.arcTo(RectF(w - f - 2f * r, h - 2f * r, w - f, h), 0f, 90f)
                      p.lineTo(f + r, h)
                      p.arcTo(RectF(f, h - 2f * r, f + 2f * r, h), 90f, 90f)
                  } else {
                      p.lineTo(w - f, h)
                      p.lineTo(f, h)
                  }
                  p.lineTo(f, f)
                  if (f > 0.5f) p.arcTo(RectF(-f, 0f, f, 2f * f), 0f, -90f)
                  p.close()
                  return p
              }

              private fun wave(c: Config, w: Float, h: Float, d: Float, phase: Float): Path {
                  val a = min(c.waveAmp * d, h / 4f)
                  val n = max(1, c.waveCount)
                  val edges = c.waveEdges
                  val steps = 120
                  fun top(x: Float): Float =
                      if (edges == 0) 0f else a + a * sin(2.0 * PI * n * x / w + phase).toFloat()

                  fun bot(x: Float): Float {
                      val ph = if (edges == 2) PI else 0.0
                      return h - a + a * sin(2.0 * PI * n * x / w + phase + ph).toFloat()
                  }

                  val p = Path()
                  p.moveTo(0f, top(0f))
                  for (i in 1..steps) {
                      val x = w * i / steps
                      p.lineTo(x, top(x))
                  }
                  for (i in steps downTo 0) {
                      val x = w * i / steps
                      p.lineTo(x, bot(x))
                  }
                  p.close()
                  val r = min(c.radius * d, h / 2f)
                  val clip = roundRect(w, h, r)
                  p.op(clip, Path.Op.INTERSECT)
                  return p
              }

              /** Forme organique : courbe lisse passant par des points au rayon aléatoire */
              private fun blob(cx: Float, cy: Float, rx: Float, ry: Float, n: Int, rough: Float, rnd: Random): Path {
                  val xs = FloatArray(n)
                  val ys = FloatArray(n)
                  for (i in 0 until n) {
                      val jitter = (rnd.nextFloat() - 0.5f) * rough
                      val ang = 2.0 * PI * (i + jitter) / n
                      val k = 1f - rough * rnd.nextFloat()
                      xs[i] = cx + (cos(ang) * rx * k).toFloat()
                      ys[i] = cy + (sin(ang) * ry * k).toFloat()
                  }
                  val p = Path()
                  p.moveTo(xs[0], ys[0])
                  for (i in 0 until n) {
                      val i0 = (i - 1 + n) % n
                      val i1 = i
                      val i2 = (i + 1) % n
                      val i3 = (i + 2) % n
                      val c1x = xs[i1] + (xs[i2] - xs[i0]) / 6f
                      val c1y = ys[i1] + (ys[i2] - ys[i0]) / 6f
                      val c2x = xs[i2] - (xs[i3] - xs[i1]) / 6f
                      val c2y = ys[i2] - (ys[i3] - ys[i1]) / 6f
                      p.cubicTo(c1x, c1y, c2x, c2y, xs[i2], ys[i2])
                  }
                  p.close()
                  return p
              }

              /** Plusieurs formes aléatoires côte à côte */
              private fun multi(c: Config, w: Float, h: Float, d: Float): Path {
                  val rnd = Random(c.seed.toLong())
                  val k = c.blobs.coerceIn(2, 6)
                  val gap = c.blobGap * d
                  val ws = FloatArray(k) { 0.6f + rnd.nextFloat() * 0.8f }
                  val sum = ws.sum()
                  val usable = max(10f, w - gap * (k - 1))
                  var x = 0f
                  val p = Path()
                  for (i in 0 until k) {
                      val bw = usable * ws[i] / sum
                      val bh = h * (0.6f + 0.4f * rnd.nextFloat())
                      val cyb = h / 2f + (rnd.nextFloat() - 0.5f) * (h - bh)
                      p.addPath(blob(x + bw / 2f, cyb, bw / 2f, bh / 2f, max(6, c.lobes / 2), c.rough / 100f * 0.5f, rnd))
                      x += bw + gap
                  }
                  return p
              }
          }
