          class MainActivity : Activity() {
              private lateinit var ui: Ui
              private lateinit var engine: StatusEngine
              private lateinit var bar: BarView
              private lateinit var halo: HaloView
              private lateinit var preview: PreviewFrame
              private lateinit var content: FrameLayout
              private lateinit var tabRow: LinearLayout
              private var tab = 0
              private val handler = Handler(Looper.getMainLooper())
              private val tabNames = listOf("🎨 Forme", "🖌️ Style", "🎯 Objectif", "🧩 Infos", "↔️ Côté", "⚙️ Options")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Store.ensure(this)
                  window.statusBarColor = Pal.BG
                  window.navigationBarColor = Pal.BG

                  ui = Ui(this) { commit() }
                  engine = StatusEngine(this) { refreshViews() }
                  bar = BarView(this, engine)
                  halo = HaloView(this, engine)
                  preview = PreviewFrame(this, bar, halo)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Pal.BG)
                  val pl = LinearLayout.LayoutParams(ui.MATCH, ui.WRAP)
                  pl.setMargins(ui.dp(10), ui.dp(10), ui.dp(10), ui.dp(4))
                  root.addView(preview, pl)

                  val hs = HorizontalScrollView(this)
                  hs.isHorizontalScrollBarEnabled = false
                  tabRow = LinearLayout(this)
                  tabRow.setPadding(ui.dp(10), ui.dp(4), ui.dp(10), ui.dp(4))
                  for ((i, n) in tabNames.withIndex()) {
                      val c = ui.chip(n)
                      c.setOnClickListener { showTab(i) }
                      val lp = LinearLayout.LayoutParams(ui.WRAP, ui.WRAP)
                      lp.setMargins(0, 0, ui.dp(8), 0)
                      tabRow.addView(c, lp)
                  }
                  hs.addView(tabRow)
                  root.addView(hs, LinearLayout.LayoutParams(ui.MATCH, ui.WRAP))

                  content = FrameLayout(this)
                  root.addView(content, LinearLayout.LayoutParams(ui.MATCH, 0, 1f))
                  setContentView(root)
                  showTab(0)

                  val need = ArrayList<String>()
                  if (!granted(Manifest.permission.ACCESS_COARSE_LOCATION)) need.add(Manifest.permission.ACCESS_COARSE_LOCATION)
                  if (!granted(Manifest.permission.READ_PHONE_STATE)) need.add(Manifest.permission.READ_PHONE_STATE)
                  if (need.isNotEmpty()) requestPermissions(need.toTypedArray(), 42)
              }

              override fun onResume() {
                  super.onResume()
                  engine.start()
                  refreshViews()
                  if (tab == 5) showTab(5)
              }

              override fun onPause() {
                  engine.stop()
                  super.onPause()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  Weather.reset()
                  if (tab == 5) showTab(5)
              }

              private fun granted(p: String): Boolean = checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              private fun refreshViews() {
                  bar.refresh()
                  halo.refresh()
              }

              /** Enregistre, applique à la vraie barre et à l'aperçu */
              fun commit() {
                  Store.save()
                  IslandAccessibilityService.instance?.reload()
                  preview.relayout()
                  refreshViews()
              }

              private fun scroll(v: View): View {
                  val s = ScrollView(this)
                  s.addView(v)
                  return s
              }

              private fun showTab(i: Int) {
                  tab = i
                  for (k in 0 until tabRow.childCount) ui.styleChip(tabRow.getChildAt(k) as TextView, k == i)
                  content.removeAllViews()
                  val v = when (i) {
                      0 -> scroll(tabShape())
                      1 -> scroll(tabStyle())
                      2 -> scroll(tabHole())
                      3 -> tabInfos()
                      4 -> scroll(tabSide())
                      else -> scroll(tabOptions())
                  }
                  content.addView(v, FrameLayout.LayoutParams(ui.MATCH, ui.MATCH))
              }

              /** Reconstruit l'onglet courant en gardant la position de défilement */
              private fun rebuild() {
                  val sy = (content.getChildAt(0) as? ScrollView)?.scrollY ?: 0
                  showTab(tab)
                  handler.post { (content.getChildAt(0) as? ScrollView)?.scrollTo(0, sy) }
              }

              // ---------------------------------------------------------------- FORME

              private fun applyPreset(i: Int) {
                  val c = Store.cfg
                  when (i) {
                      0 -> { c.shape = 0; c.width = 200; c.height = 30; c.offY = 0 }
                      1 -> { c.shape = 2; c.width = 240; c.height = 34; c.offY = 6 }
                      2 -> { c.shape = 3; c.width = 200; c.height = 40; c.offY = 4 }
