              var cfg: Config = Config(JSONObject())
              private var sp: SharedPreferences? = null

              fun ensure(ctx: Context) {
                  if (sp != null) return
                  val s = ctx.applicationContext.getSharedPreferences("island_v2", Context.MODE_PRIVATE)
                  sp = s
                  val raw = s.getString("cfg", null)
                  var ok = false
                  if (raw != null) {
                      try {
                          cfg = Config(JSONObject(raw))
                          ok = cfg.mods.isNotEmpty()
                      } catch (e: Exception) {
                      }
                  }
                  if (!ok) cfg = Config.default()
                  // une seule fois : la LED du type de connexion suit la qualité du signal
                  if (!s.getBoolean("mig_net_led2", false)) {
                      for (m in cfg.mods) {
                          if (m.kind == Kind.NETWORK) m.autoLed = true
                      }
                      s.edit().putString("cfg", cfg.toJson().toString()).putBoolean("mig_net_led2", true).apply()
                  }
                  // une seule fois : la tuile Signal mobile affiche le type de réseau (5G, 4G+…) comme la tuile Type de connexion
                  if (!s.getBoolean("mig_sig_type", false)) {
                      for (m in cfg.mods) {
                          if (m.kind == Kind.SIGNAL) {
                              m.opt = 3
                              m.showText = true
                              m.showIcon = false
                          }
                      }
                      s.edit().putString("cfg", cfg.toJson().toString()).putBoolean("mig_sig_type", true).apply()
                  }
                  rev++
              }

              fun save() {
                  sp?.edit()?.putString("cfg", cfg.toJson().toString())?.apply()
              }
          }
