          /** Actions que l'on peut associer à un appui ou un glissement */
          object Actions {
              val names = listOf(
                  "Rien", "Panneau de notifications", "Réglages rapides", "Ouvrir cette appli", "Verrouiller l'écran",
                  "Capture d'écran", "Applis récentes", "Accueil", "Retour", "Lampe torche", "Appareil photo"
              )
          }

          /** Valeur calculée d'une info à un instant donné */
          class ModuleValue(
              val text: String = "",
              val active: Boolean = true,
              val led: Int = Pal.WHITE,
              val icon: String? = null,
              val blink: Boolean = false
          ) {
              /** Niveau de 0 à 1 (signal, batterie, RAM…) ou -1 si l'info n'a pas de niveau */
              var frac: Float = -1f
          }

          /** Réglages d'une info (stockés en JSON) */
          class Mod(val j: JSONObject) {
              private fun gi(k: String, d: Int): Int = j.optInt(k, d)
              private fun gb(k: String, d: Boolean): Boolean = j.optBoolean(k, d)
              private fun gs(k: String, d: String): String = j.optString(k, d)
              private fun p(k: String, v: Any) {
                  j.put(k, v)
                  Store.rev++
              }

              val id: String
                  get() = j.optString("id")

              val kind: Kind
                  get() = try {
                      Kind.valueOf(j.optString("kind"))
                  } catch (e: Exception) {
                      Kind.CUSTOM
                  }

              var enabled: Boolean
                  get() = gb("on", true)
                  set(v) {
                      p("on", v)
                  }

              var left: Boolean
                  get() = gb("left", true)
                  set(v) {
                      p("left", v)
                  }

              var showLed: Boolean
                  get() = gb("led", false)
                  set(v) {
                      p("led", v)
                  }

              var showIcon: Boolean
                  get() = gb("ico", true)
                  set(v) {
                      p("ico", v)
                  }

              var showText: Boolean
                  get() = gb("txt", true)
                  set(v) {
                      p("txt", v)
                  }

              var icon: String
                  get() = gs("icon", "")
                  set(v) {
                      p("icon", v)
                  }

              var autoIcon: Boolean
                  get() = gb("aico", true)
                  set(v) {
                      p("aico", v)
                  }

              var opt: Int
                  get() = gi("opt", 0)
                  set(v) {
                      p("opt", v)
                  }

              var label: String
                  get() = gs("label", "")
                  set(v) {
                      p("label", v)
                  }

              var text: String
                  get() = gs("text", "")
                  set(v) {
                      p("text", v)
                  }

              /** Texte personnalisé d'un interrupteur quand il est activé / désactivé (vide = texte d'origine) */
              var textOn: String
                  get() = gs("ton", "")
                  set(v) {
                      p("ton", v)
                  }

              var textOff: String
                  get() = gs("toff", "")
                  set(v) {
                      p("toff", v)
                  }

              /** Notifications : coupées en deux autour de l'appareil photo (moitié à gauche, moitié à droite) */
              var split: Boolean
                  get() = gb("split", kind == Kind.NOTIF_ICONS)
                  set(v) {
                      p("split", v)
                  }

              /** Utilisé au dessin seulement : 0 = tuile entière, 1 = moitié gauche, 2 = moitié droite */
              var part: Int = 0

              var autoLed: Boolean
                  get() = gb("aled", true)
                  set(v) {
                      p("aled", v)
                  }

              var ledColor: Int
                  get() = gi("lc", 0xFF00E676.toInt())
                  set(v) {
                      p("lc", v)
                  }

              var ledStyle: Int
                  get() = gi("ls", 0)
                  set(v) {
                      p("ls", v)
                  }

              var ledSize: Int
                  get() = gi("lsz", 8)
                  set(v) {
                      p("lsz", v)
                  }

              var ledBlink: Boolean
                  get() = gb("lb", false)
                  set(v) {
                      p("lb", v)
                  }

              var textColor: Int
                  get() = gi("tc", 0xFFFFFFFF.toInt())
                  set(v) {
                      p("tc", v)
                  }

              var textSize: Int
                  get() = gi("ts", 12)
                  set(v) {
                      p("ts", v)
                  }

              var bold: Boolean
                  get() = gb("b", false)
                  set(v) {
                      p("b", v)
                  }

              var font: Int
                  get() = gi("f", 0)
                  set(v) {
                      p("f", v)
                  }

              var hideInactive: Boolean
                  get() = gb("hide", false)
                  set(v) {
                      p("hide", v)
                  }

              var shiftX: Int
                  get() = gi("sx", 0)
                  set(v) {
                      p("sx", v)
                  }

              var shiftY: Int
                  get() = gi("sy", 0)
                  set(v) {
                      p("sy", v)
                  }


              /** 0 = bord gauche, 1 = à gauche du trou, 2 = à droite du trou, 3 = bord droit */
              var zone: Int
                  get() = if (j.has("zone")) j.optInt("zone", 1) else (if (left) 1 else 2)
                  set(v) {
                      p("zone", v)
                      p("left", v <= 1)
                  }

              companion object {
                  fun newId(): String = UUID.randomUUID().toString().take(8)

                  fun create(kind: Kind, left: Boolean): Mod {
                      val m = Mod(JSONObject())
                      m.j.put("id", newId())
                      m.j.put("kind", kind.name)
                      m.zone = if (left) 1 else 2
                      m.icon = kind.icon
                      m.showLed = kind.dLed
                      m.showIcon = kind.dIcon
                      m.showText = kind.dText
                      m.hideInactive = kind.dHide
                      if (kind == Kind.CUSTOM) m.text = "Hello"
                      if (kind == Kind.NOTIF_ICONS) m.opt = 2
                      return m
                  }

                  fun copyOf(m: Mod): Mod {
                      val c = Mod(JSONObject(m.j.toString()))
                      c.j.put("id", newId())
                      return c
                  }
              }
          }

          /** Tous les réglages de la barre (stockés en JSON) */
          class Config(val j: JSONObject) {
              val mods = ArrayList<Mod>()

              init {
                  val a = j.optJSONArray("mods")
                  if (a != null) {
                      for (i in 0 until a.length()) mods.add(Mod(a.getJSONObject(i)))
