          package com.example.island

          import android.app.AlertDialog
          import android.content.Context
          import android.graphics.Color
          import android.view.inputmethod.EditorInfo
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView
          import android.view.View

          /** Sélecteur de couleur : roue + luminosité + transparence + code hexadécimal, en direct */
          object ColorPicker {
              fun show(ctx: Context, initial: Int, withAlpha: Boolean, onPick: (Int) -> Unit) {
                  val d = ctx.resources.displayMetrics.density
                  var alpha = if (withAlpha) Color.alpha(initial) else 255
                  var rgb = initial and 0xFFFFFF

                  val box = LinearLayout(ctx)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding((16 * d).toInt(), (12 * d).toInt(), (16 * d).toInt(), (8 * d).toInt())

                  val swatch = View(ctx)
                  val hex = EditText(ctx)
                  hex.setSingleLine(true)
                  hex.setTextColor(Color.WHITE)
                  hex.imeOptions = EditorInfo.IME_ACTION_DONE

                  fun compose(): Int = (alpha shl 24) or rgb
                  fun push() {
                      val c = compose()
                      swatch.setBackgroundColor(c)
                      hex.setText(String.format("#%08X", c))
                      onPick(c)
                  }

                  val wheel = ColorWheelView(ctx) { c ->
                      rgb = c and 0xFFFFFF
                      push()
                  }
                  wheel.setColor(initial or (0xFF shl 24))
                  box.addView(wheel, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                  fun label(t: String): TextView {
                      val v = TextView(ctx)
                      v.text = t
                      v.setTextColor(Color.WHITE)
                      v.textSize = 13f
                      return v
                  }

                  val hsv = FloatArray(3)
                  Color.colorToHSV(initial or (0xFF shl 24), hsv)

                  box.addView(label("Luminosité"))
                  val bright = SeekBar(ctx)
                  bright.max = 100
                  bright.progress = (hsv[2] * 100f).toInt()
                  bright.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          if (fromUser) wheel.setBrightness(p / 100f)
                      }

                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  box.addView(bright)

                  if (withAlpha) {
                      box.addView(label("Transparence"))
                      val al = SeekBar(ctx)
                      al.max = 255
                      al.progress = alpha
                      al.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              if (fromUser) {
                                  alpha = p
                                  push()
                              }
                          }

                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                      box.addView(al)
                  }

                  box.addView(label("Code couleur (#RRGGBB ou #AARRGGBB)"))
                  hex.setText(String.format("#%08X", compose()))
                  hex.setOnEditorActionListener { _, _, _ ->
                      try {
                          val c = Color.parseColor(hex.text.toString().trim())
                          rgb = c and 0xFFFFFF
                          if (withAlpha && hex.text.toString().trim().length > 7) alpha = Color.alpha(c)
                          wheel.setColor(c or (0xFF shl 24))
                          push()
                      } catch (e: Exception) {
                      }
                      true
                  }
                  box.addView(hex)
                  swatch.setBackgroundColor(compose())
                  box.addView(swatch, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (28 * d).toInt()))

                  val sv = ScrollView(ctx)
                  sv.addView(box)
                  AlertDialog.Builder(ctx, android.R.style.Theme_Material_Dialog_Alert)
                      .setView(sv)
                      .setPositiveButton("OK", null)
                      .setNegativeButton("Annuler") { _, _ -> onPick(initial) }
                      .show()
              }
          }
