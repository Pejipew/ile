          package com.example.island

          import android.accessibilityservice.AccessibilityService
          import android.app.KeyguardManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.res.Configuration
          import android.graphics.PixelFormat
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.hardware.display.DisplayManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.view.Display
          import android.view.GestureDetector
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import androidx.core.content.ContextCompat

          /** Gère les deux fenêtres flottantes (barre + halo) au-dessus de tout, et leur visibilité */
          class BarController(private val svc: AccessibilityService) {
              private val wm = svc.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private val dm = svc.getSystemService(Context.DISPLAY_SERVICE) as DisplayManager
              private val km = svc.getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
              private val handler = Handler(Looper.getMainLooper())
              private val d = svc.resources.displayMetrics.density

              private val engine = StatusEngine(svc) { refresh() }
              private val bar = BarView(svc, engine)
              private val halo = HaloView(svc, engine)
              private val notch = View(svc)
              private val side = SideView(svc) { act(it) }
              private var barLp: WindowManager.LayoutParams? = null
              private var haloLp: WindowManager.LayoutParams? = null
              private var notchLp: WindowManager.LayoutParams? = null
              private var sideLp: WindowManager.LayoutParams? = null
              private var added = false

              private val displayListener = object : DisplayManager.DisplayListener {
                  override fun onDisplayAdded(displayId: Int) {}
                  override fun onDisplayRemoved(displayId: Int) {}
                  override fun onDisplayChanged(displayId: Int) {
                      updateVisibility()
                  }
              }

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      updateVisibility()
                  }
              }

              private val gesture = GestureDetector(svc, object : GestureDetector.SimpleOnGestureListener() {
                  override fun onDown(e: MotionEvent): Boolean = true

                  override fun onSingleTapUp(e: MotionEvent): Boolean {
                      act(Store.cfg.tapAction)
                      return true
                  }

                  override fun onLongPress(e: MotionEvent) {
                      act(Store.cfg.longAction)
                  }
              })

              /** Bouton invisible posé sur l'encoche : appui court, long ou double */
              private val notchGesture = GestureDetector(svc, object : GestureDetector.SimpleOnGestureListener() {
                  override fun onDown(e: MotionEvent): Boolean = true

                  override fun onSingleTapUp(e: MotionEvent): Boolean {
                      if (Store.cfg.holeDouble == 0) act(Store.cfg.holeTap)
                      return true
                  }

                  override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                      if (Store.cfg.holeDouble != 0) act(Store.cfg.holeTap)
                      return true
                  }

                  override fun onDoubleTap(e: MotionEvent): Boolean {
                      act(Store.cfg.holeDouble)
                      return true
                  }

                  override fun onLongPress(e: MotionEvent) {
                      act(Store.cfg.holeLong)
                  }
              })

              private fun setTouchable(lp: WindowManager.LayoutParams, touchable: Boolean) {
                  var fl = lp.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
                  fl = fl and WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL.inv()
                  fl = fl or (if (touchable) WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL else WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE)
                  lp.flags = fl
              }

              private fun makeLp(w: Int, h: Int, touchable: Boolean): WindowManager.LayoutParams {
                  var flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  flags = flags or (if (touchable) WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL else WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE)
                  val lp = WindowManager.LayoutParams(
                      w, h,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      flags,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                  if (Build.VERSION.SDK_INT >= 30) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                  } else if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  return lp
              }

              fun start() {
                  stop()
                  val c = Store.cfg
                  val bl = makeLp((c.width * d).toInt(), (c.height * d).toInt(), false)
                  val hl = makeLp(10, 10, false)
                  val nl = makeLp(10, 10, false)
                  val sl = makeLp(10, 10, false)
                  barLp = bl
                  haloLp = hl
                  notchLp = nl
                  sideLp = sl
                  try {
                      wm.addView(bar, bl)
                      wm.addView(halo, hl)
                      wm.addView(notch, nl)
                      wm.addView(side, sl)
                      added = true
                  } catch (e: Exception) {
                      added = false
                      return
                  }
                  bar.setOnTouchListener { _, e -> gesture.onTouchEvent(e) }
                  notch.setOnTouchListener { _, e -> notchGesture.onTouchEvent(e) }
                  dm.registerDisplayListener(displayListener, handler)
                  val f = IntentFilter()
                  f.addAction(Intent.ACTION_SCREEN_ON)
                  f.addAction(Intent.ACTION_SCREEN_OFF)
                  f.addAction(Intent.ACTION_USER_PRESENT)
                  ContextCompat.registerReceiver(svc, receiver, f, ContextCompat.RECEIVER_NOT_EXPORTED)
                  apply()
                  engine.start()
              }

              fun stop() {
                  engine.stop()
                  if (added) {
                      try { wm.removeView(bar) } catch (e: Exception) {}
                      try { wm.removeView(halo) } catch (e: Exception) {}
                      try { wm.removeView(notch) } catch (e: Exception) {}
                      try { wm.removeView(side) } catch (e: Exception) {}
                      try { dm.unregisterDisplayListener(displayListener) } catch (e: Exception) {}
                      try { svc.unregisterReceiver(receiver) } catch (e: Exception) {}
                      added = false
                  }
              }

              /** Relit tous les réglages et met les fenêtres à jour immédiatement */
              fun apply() {
                  if (!added) return
                  val c = Store.cfg
                  val bl = barLp ?: return
                  val hl = haloLp ?: return

                  bl.width = (c.width * d).toInt()
                  bl.height = (c.height * d).toInt()
                  bl.x = (c.offX * d).toInt()
                  bl.y = (c.offY * d).toInt()
                  val touch = c.tapAction != 0 || c.longAction != 0
                  var fl = bl.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
                  fl = fl and WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL.inv()
                  fl = fl or (if (touch) WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL else WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE)
                  bl.flags = fl
                  try { wm.updateViewLayout(bar, bl) } catch (e: Exception) {}

                  val size = halo.size(c)
                  val hyPx = c.holeY * d
                  val top = (hyPx - size / 2f).coerceAtLeast(0f)
                  hl.width = size
                  hl.height = size
                  hl.x = (c.holeX * d).toInt()
                  hl.y = top.toInt()
                  halo.centerY = hyPx - top
                  try { wm.updateViewLayout(halo, hl) } catch (e: Exception) {}

                  // bouton sur l'encoche
                  val nl = notchLp
                  if (nl != null) {
                      val hasNotch = c.holeOn && (c.holeTap != 0 || c.holeLong != 0 || c.holeDouble != 0)
                      if (hasNotch) {
                          val ns = (maxOf(c.holeD + 12, 44) * d).toInt()
                          nl.width = ns
                          nl.height = ns
                          nl.x = (c.holeX * d).toInt()
                          nl.y = (c.holeY * d - ns / 2f).coerceAtLeast(0f).toInt()
                      } else {
                          nl.width = 1
                          nl.height = 1
                          nl.x = 0
                          nl.y = 0
                      }
                      setTouchable(nl, hasNotch)
                      try { wm.updateViewLayout(notch, nl) } catch (e: Exception) {}
                  }

                  // poignée latérale
                  val sl = sideLp
                  if (sl != null) {
                      if (c.sideOn) {
                          sl.width = maxOf((c.sideTouchW * d).toInt(), (c.sideThick * d).toInt() + 2)
                          sl.height = (c.sideLen * d).toInt().coerceAtLeast(1)
                          sl.gravity = Gravity.TOP or (if (c.sideRight) Gravity.RIGHT else Gravity.LEFT)
                          sl.x = 0
                          sl.y = (c.sideY * d).toInt()
                      } else {
                          sl.width = 1
                          sl.height = 1
                      }
                      setTouchable(sl, c.sideOn)
                      try { wm.updateViewLayout(side, sl) } catch (e: Exception) {}
                  }

                  updateVisibility()
                  refresh()
              }

              fun refresh() {
                  if (!added) return
                  bar.refresh()
                  halo.refresh()
                  side.refresh()
              }

              /** Masque la barre sur l'AOD / l'écran verrouillé / en paysage selon les options */
              fun updateVisibility() {
                  if (!added) return
                  val c = Store.cfg
                  val disp = dm.getDisplay(Display.DEFAULT_DISPLAY)
                  val st = disp?.state ?: Display.STATE_ON
                  val aod = st == Display.STATE_DOZE || st == Display.STATE_DOZE_SUSPEND
                  val locked = st == Display.STATE_ON && km.isKeyguardLocked
                  val land = svc.resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE
                  val hidden = (c.hideAod && aod) || (c.hideLock && locked) || (c.hideLand && land)

                  val vis = if (hidden) View.INVISIBLE else View.VISIBLE
                  bar.visibility = vis
                  halo.visibility = vis
                  notch.visibility = vis
                  side.visibility = vis
                  bar.syncAnim()
                  halo.syncAnim()

                  if (hidden || st == Display.STATE_OFF) engine.stop() else engine.start()
              }

              private fun act(id: Int) {
                  when (id) {
                      1 -> svc.performGlobalAction(AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS)
                      2 -> svc.performGlobalAction(AccessibilityService.GLOBAL_ACTION_QUICK_SETTINGS)
                      3 -> {
                          val i = svc.packageManager.getLaunchIntentForPackage(svc.packageName)
                          if (i != null) {
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              svc.startActivity(i)
                          }
                      }
                      4 -> if (Build.VERSION.SDK_INT >= 28) svc.performGlobalAction(AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN)
                      5 -> if (Build.VERSION.SDK_INT >= 28) svc.performGlobalAction(AccessibilityService.GLOBAL_ACTION_TAKE_SCREENSHOT)
                      6 -> svc.performGlobalAction(AccessibilityService.GLOBAL_ACTION_RECENTS)
                      7 -> svc.performGlobalAction(AccessibilityService.GLOBAL_ACTION_HOME)
                      8 -> svc.performGlobalAction(AccessibilityService.GLOBAL_ACTION_BACK)
                      9 -> toggleTorch()
                      10 -> {
                          try {
                              val i = Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA)
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              svc.startActivity(i)
                          } catch (e: Exception) {
                          }
                      }
                  }
              }

              private fun toggleTorch() {
                  try {
                      val cm = svc.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      var id: String? = null
                      for (cid in cm.cameraIdList) {
                          val ch = cm.getCameraCharacteristics(cid)
                          val flash = ch.get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                          val back = ch.get(CameraCharacteristics.LENS_FACING) == CameraCharacteristics.LENS_FACING_BACK
                          if (flash && back) {
                              id = cid
                              break
                          }
                      }
                      if (id != null) cm.setTorchMode(id, !engine.torchOn)
                  } catch (e: Exception) {
                  }
              }

              /** Cherche l'emplacement du trou de l'appareil photo : renvoie [x par rapport au centre, y du centre, diamètre] en dp */
              fun detectCutout(cb: (IntArray?) -> Unit) {
                  if (Build.VERSION.SDK_INT < 28) {
                      cb(null)
                      return
                  }
                  val probe = View(svc)
                  var done = false
                  val lp = makeLp(WindowManager.LayoutParams.MATCH_PARENT, (90 * d).toInt(), false)
                  probe.setOnApplyWindowInsetsListener { _, ins ->
                      val cut = ins.displayCutout
                      val rects = cut?.boundingRects
                      if (!done && rects != null) {
                          val r = rects.firstOrNull { it.top <= 2 } ?: rects.firstOrNull()
                          if (r != null) {
                              done = true
                              val sw = svc.resources.displayMetrics.widthPixels
                              val x = (r.exactCenterX() - sw / 2f) / d
                              val y = r.exactCenterY() / d
                              val dia = minOf(r.width(), r.height()) / d
                              handler.post {
                                  try { wm.removeView(probe) } catch (e: Exception) {}
                                  cb(intArrayOf(x.toInt(), y.toInt(), dia.toInt().coerceAtLeast(4)))
                              }
                          }
                      }
                      ins
                  }
                  try {
                      wm.addView(probe, lp)
                  } catch (e: Exception) {
                      cb(null)
                      return
                  }
                  handler.postDelayed({
                      if (!done) {
                          done = true
                          try { wm.removeView(probe) } catch (e: Exception) {}
                          cb(null)
                      }
                  }, 1500L)
              }
          }
