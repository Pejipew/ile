          package com.example.island

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          /** Météo via Open-Meteo (gratuit, sans clé) à partir de la position approximative */
          object Weather {
              class Data(val temp: Float, val code: Int, val wind: Float, val hum: Int, val time: Long)

              @Volatile
              var data: Data? = null

              @Volatile
              private var fetching = false

              @Volatile
              private var lastTry = 0L

              @Volatile
              private var lat = Double.NaN

              @Volatile
              private var lon = Double.NaN

              fun reset() {
                  lastTry = 0L
              }

              fun maybeRefresh(ctx: Context, done: () -> Unit) {
                  val now = System.currentTimeMillis()
                  val d = data
                  val fresh = d != null && now - d.time < 20L * 60L * 1000L
                  if (fresh || fetching || now - lastTry < 60_000L) return
                  fetching = true
                  lastTry = now
                  Thread {
                      try {
                          val loc = findLocation(ctx)
                          if (loc != null) {
                              lat = loc.latitude
                              lon = loc.longitude
                          }
                          if (!lat.isNaN() && !lon.isNaN()) {
                              val url = URL(
                                  "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
                                      "&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&timezone=auto"
                              )
                              val c = url.openConnection() as HttpURLConnection
                              c.connectTimeout = 8000
                              c.readTimeout = 8000
                              val txt = c.inputStream.bufferedReader().use { it.readText() }
                              val cur = JSONObject(txt).getJSONObject("current")
                              data = Data(
                                  cur.optDouble("temperature_2m", 0.0).toFloat(),
                                  cur.optInt("weather_code", -1),
                                  cur.optDouble("wind_speed_10m", 0.0).toFloat(),
                                  cur.optInt("relative_humidity_2m", 0),
                                  System.currentTimeMillis()
                              )
                              Handler(Looper.getMainLooper()).post { done() }
                          }
                      } catch (e: Exception) {
                      } finally {
                          fetching = false
                      }
                  }.start()
              }

              private fun findLocation(ctx: Context): Location? {
                  if (ctx.checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) return null
                  val lm = ctx.getSystemService(Context.LOCATION_SERVICE) as LocationManager
                  var best: Location? = null
                  for (prov in listOf("passive", "network", "gps")) {
                      try {
                          val l = lm.getLastKnownLocation(prov)
                          if (l != null && (best == null || l.time > best.time)) best = l
                      } catch (e: Exception) {
                      }
                  }
                  if (best == null && Build.VERSION.SDK_INT >= 30) {
                      val latch = CountDownLatch(1)
                      var res: Location? = null
                      try {
                          lm.getCurrentLocation(LocationManager.NETWORK_PROVIDER, null, ctx.mainExecutor) { l ->
                              res = l
                              latch.countDown()
                          }
                          latch.await(8, TimeUnit.SECONDS)
                      } catch (e: Exception) {
                      }
                      best = res
                  }
                  return best
              }

              fun emoji(code: Int, night: Boolean): String = when (code) {
                  0 -> if (night) "🌙" else "☀️"
                  1 -> if (night) "🌙" else "🌤️"
                  2 -> "⛅"
                  3 -> "☁️"
                  45, 48 -> "🌫️"
                  51, 53, 55, 56, 57 -> "🌦️"
                  61, 63, 65, 66, 67, 80, 81, 82 -> "🌧️"
                  71, 73, 75, 77, 85, 86 -> "❄️"
                  95, 96, 99 -> "⛈️"
                  else -> "🌡️"
              }

              fun label(code: Int): String = when (code) {
                  0 -> "Dégagé"
                  1 -> "Éclaircies"
                  2 -> "Nuageux"
                  3 -> "Couvert"
                  45, 48 -> "Brouillard"
                  51, 53, 55, 56, 57 -> "Bruine"
                  61, 63, 65, 66, 67 -> "Pluie"
                  80, 81, 82 -> "Averses"
                  71, 73, 75, 77, 85, 86 -> "Neige"
                  95, 96, 99 -> "Orage"
                  else -> "—"
              }
          }
