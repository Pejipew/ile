          package com.example.island

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.BlurMaskFilter
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PorterDuff
          import android.graphics.PorterDuffXfermode
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.cos
          import kotlin.math.sin

          /** La barre : forme + infos + trou découpé pour l'appareil photo */
          class BarView(ctx: Context, private val engine: StatusEngine) : View(ctx) {
              private val d = ctx.resources.displayMetrics.density
              private var vals: Map<String, ModuleValue> = emptyMap()

              private val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val strokePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE }
              private val clearPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  xfermode = PorterDuffXfermode(PorterDuff.Mode.CLEAR)
              }
              private val fadePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  xfermode = PorterDuffXfermode(PorterDuff.Mode.DST_OUT)
              }
              private val tp = Paint(Paint.ANTI_ALIAS_FLAG)
              private val lp = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()
              private val ledPath = Path()

              private class Anim(val t0: Long, val color: Int, val kind: Int, val dir: Int, val dur: Long)

              private val anims = ArrayList<Anim>()
              private val animPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val gaugePaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private var prevSnap: EvSnap? = null
              private val gFrac = floatArrayOf(0f, 0f)
              private val gCol = intArrayOf(Pal.GREEN, Pal.GREEN)
              private val gMods = HashMap<Int, Mod>()

              private var path = Path()
              private var pathKey = ""
              private var phase = 0f
              private var anim: ValueAnimator? = null
              private val faces = HashMap<String, Typeface>()

              init {
                  setLayerType(LAYER_TYPE_SOFTWARE, null)
              }

              /** Recalcule toutes les valeurs puis redessine */
              fun refresh() {
                  val c = Store.cfg
                  val m = HashMap<String, ModuleValue>()
                  var needFast = false
                  for (mod in c.mods) {
                      if (!mod.enabled) continue
                      val v = engine.compute(mod)
                      m[mod.id] = v
                      if (mod.showLed && (mod.ledBlink || v.blink || mod.ledStyle == 12)) needFast = true
                  }
                  vals = m
                  for (gi in 1..2) {
                      if (c.gaugeBool(gi, "on", gi == 1)) {
                          computeGauge(gi)
                          if (c.gaugeInt(gi, "src", if (gi == 1) 0 else 1) == 9) needFast = true
                      }
                  }
                  detectEvents()
                  engine.fast = needFast
                  syncAnim()
                  invalidate()
              }

              // ---------- fines barres ----------

              private fun computeGauge(i: Int) {
                  val c = Store.cfg
                  val src = c.gaugeInt(i, "src", if (i == 1) 0 else 1)
                  var f = 0f
                  var col = Pal.CYAN
                  if (src == 8) {
                      val cal = java.util.Calendar.getInstance()
                      f = (cal.get(java.util.Calendar.HOUR_OF_DAY) * 3600 + cal.get(java.util.Calendar.MINUTE) * 60 + cal.get(java.util.Calendar.SECOND)) / 86400f
                      col = tc("time", Pal.CYAN)
                  } else if (src == 9) {
                      f = (System.currentTimeMillis() % 60000L) / 60000f
                      col = tc("time", Pal.CYAN)
                  } else {
                      val kinds = arrayOf(Kind.BATTERY, Kind.SIGNAL, Kind.WIFI_STATE, Kind.RAM, Kind.STORAGE, Kind.VOLUME, Kind.BRIGHTNESS, Kind.CHARGE_WATTS)
                      val k = kinds[src.coerceIn(0, 7)]
                      val mod = gMods.getOrPut(src) { Mod.create(k, false) }
                      val v = engine.compute(mod)
                      f = if (v.frac < 0f) 0f else v.frac
                      col = v.led
                  }
                  gFrac[i - 1] = f.coerceIn(0f, 1f)
                  gCol[i - 1] = col
              }

              private fun drawGauge(canvas: Canvas, c: Config, i: Int, w: Float, h: Float) {
                  if (!c.gaugeBool(i, "on", i == 1)) return
                  val th = c.gaugeInt(i, "th", 2) * d
                  val top = c.gaugeInt(i, "pos", if (i == 1) 0 else 1) == 1
                  val y0 = if (top) 0f else h - th
                  val col = if (c.gaugeBool(i, "auto", true)) gCol[i - 1] else c.gaugeInt(i, "col", Pal.CYAN)
                  val inset = c.gaugeInt(i, "inset", 0) * d
                  val x0 = inset
                  val x1 = w - inset
                  val len = x1 - x0
                  if (len <= 1f) return
                  gaugePaint.shader = null
                  if (c.gaugeBool(i, "trk", true)) {
                      gaugePaint.color = (col and 0x00FFFFFF) or (0x33 shl 24)
                      rect.set(x0, y0, x1, y0 + th)
                      canvas.drawRoundRect(rect, th / 2f, th / 2f, gaugePaint)
                  }
                  val fl = len * gFrac[i - 1]
                  if (fl < 0.5f) return
                  val from = c.gaugeInt(i, "from", 0)
                  val a: Float
                  val b: Float
                  if (from == 1) {
                      a = x0 + (len - fl) / 2f
                      b = x0 + (len + fl) / 2f
                  } else if (from == 2) {
                      a = x1 - fl
                      b = x1
                  } else {
                      a = x0
                      b = x0 + fl
                  }
                  gaugePaint.color = col
                  rect.set(a, y0, b, y0 + th)
                  canvas.drawRoundRect(rect, th / 2f, th / 2f, gaugePaint)
              }

              // ---------- animations ----------

              private fun addAnim(key: String, color: Int, kind: Int, dir: Int) {
                  val c = Store.cfg
                  if (!c.animOn || !c.animFlag(key)) return
                  anims.add(makeAnim(c, key, color, kind, dir, System.currentTimeMillis()))
                  while (anims.size > 6) anims.removeAt(0)
              }

              private fun makeAnim(c: Config, key: String, color: Int, kind: Int, dir: Int, t0: Long): Anim {
                  val k = if (kind == 0) c.animStyle else kind
                  val dd = when (c.animDirMode) {
                      1 -> 1
                      2 -> -1
                      else -> dir
                  }
                  return Anim(t0, c.animColor(key, color), k, dd, c.animDur.toLong())
              }

              /** Compare l'état du téléphone à celui d'avant et lance l'animation qui correspond */
              private fun detectEvents() {
                  val now = try {
                      engine.evSnap()
                  } catch (e: Exception) {
                      return
                  }
                  val p = prevSnap
                  prevSnap = now
                  if (p == null) return
                  if (!p.plugged && now.plugged) addAnim("plug", tc("batt_plug", Pal.GREEN), 0, 1)
                  if (p.plugged && !now.plugged) addAnim("unplug", Pal.ORANGE, 0, -1)
                  if (now.plugged && ((!p.full && now.full) || (p.pct < 100 && now.pct >= 100))) addAnim("full", tc("cs_full", Pal.CYAN), 3, 1)
                  if (!now.plugged && p.pct > 15 && now.pct <= 15) addAnim("low", Pal.RED, 3, 1)
                  if (p.gen != now.gen && p.gen.take(2) != now.gen.take(2) && p.gen != "Mobile" && now.gen != "Mobile") {
                      addAnim("net", if (now.gen.startsWith("5G")) Pal.PURPLE else Pal.BLUE, 0, 1)
                  }
                  if (p.wifi != now.wifi) addAnim("wifi", if (now.wifi) Pal.GREEN else Pal.ORANGE, 0, if (now.wifi) 1 else -1)
                  if (now.notif > p.notif) addAnim("notif", tc("notif", Pal.PINK), 0, 1)
                  if (p.airplane != now.airplane) addAnim("mode", Pal.ORANGE, 0, 1)
                  if (p.dnd != now.dnd) addAnim("mode", Pal.PURPLE, 0, 1)
                  if (p.ringer != now.ringer) addAnim("mode", Pal.YELLOW, 0, 1)
              }

              /** Joue une animation d'exemple (bouton « Tester ») : celle d'un événement, ou toutes à la suite si key est vide */
              fun playTest(key: String?) {
                  val c = Store.cfg
                  val t = System.currentTimeMillis()
                  val dur = c.animDur.toLong() * maxOf(1, c.animRep)
                  anims.clear()
                  val all = listOf(
                      Triple("plug", tc("batt_plug", Pal.GREEN), 1), Triple("unplug", Pal.ORANGE, -1),
                      Triple("full", tc("cs_full", Pal.CYAN), 1), Triple("low", Pal.RED, 1),
                      Triple("net", Pal.PURPLE, 1), Triple("wifi", Pal.GREEN, 1),
                      Triple("notif", tc("notif", Pal.PINK), 1), Triple("mode", Pal.ORANGE, 1)
                  )
                  var n = 0L
                  for (e in all) {
                      if (key != null && key != e.first) continue
                      val kind = if (e.first == "full" || e.first == "low") 3 else 0
                      anims.add(makeAnim(c, e.first, e.second, kind, e.third, t + n * dur))
                      n++
                      if (key == null && n >= 4) break
                  }
                  invalidate()
              }

              private fun drawAnims(canvas: Canvas, c: Config, w: Float, h: Float) {
                  val now = System.currentTimeMillis()
                  var k = 0
                  while (k < anims.size) {
                      if (now - anims[k].t0 > anims[k].dur * maxOf(1, c.animRep)) anims.removeAt(k) else k++
                  }
                  val pw = c.animPower / 100f
                  val rep = maxOf(1, c.animRep)
                  for (a in anims) {
                      val p0 = ((now - a.t0).toFloat() / (a.dur * rep)).coerceIn(0f, 1f)
                      val q = p0 * rep
                      val p = if (p0 >= 1f) 1f else q - Math.floor(q.toDouble()).toFloat()
                      val env = Math.sin(Math.PI * p).toFloat()
                      val rgb = a.color and 0x00FFFFFF
                      if (a.kind == 0 || a.kind == 2) {
                          val e = p * p * (3f - 2f * p)
                          val bw = w * c.animWidth / 100f
                          val cx = if (a.dir >= 0) -bw / 2f + (w + bw) * e else w + bw / 2f - (w + bw) * e
                          val al = (255 * pw * 0.9f * env).toInt().coerceIn(0, 255)
                          animPaint.shader = LinearGradient(cx - bw / 2f, 0f, cx + bw / 2f, 0f, intArrayOf(rgb, rgb or (al shl 24), rgb), floatArrayOf(0f, 0.5f, 1f), Shader.TileMode.CLAMP)
                          canvas.drawRect(0f, 0f, w, h, animPaint)
                      }
                      if (a.kind == 1 || a.kind == 2) {
                          val al = (255 * pw * 0.4f * env).toInt().coerceIn(0, 255)
                          animPaint.shader = null
                          animPaint.color = rgb or (al shl 24)
                          canvas.drawRect(0f, 0f, w, h, animPaint)
                      }
                      if (a.kind == 3) {
                          val e = Math.abs(Math.sin(2.0 * Math.PI * p)).toFloat()
                          val al = (255 * pw * 0.6f * e * (1f - p0 * 0.5f)).toInt().coerceIn(0, 255)
                          animPaint.shader = null
                          animPaint.color = rgb or (al shl 24)
                          canvas.drawRect(0f, 0f, w, h, animPaint)
                      }
                  }
                  animPaint.shader = null
              }

              fun syncAnim() {
                  val c = Store.cfg
                  val need = c.shape == 5 && c.waveAnim && isAttachedToWindow && visibility == VISIBLE
                  if (!need) {
                      anim?.cancel()
                      anim = null
                      return
                  }
                  if (anim != null) return
                  anim = ValueAnimator.ofFloat(0f, (2.0 * Math.PI).toFloat()).apply {
                      duration = 3000L
                      repeatCount = ValueAnimator.INFINITE
                      interpolator = LinearInterpolator()
                      addUpdateListener {
                          phase = it.animatedValue as Float
                          invalidate()
                      }
                      start()
                  }
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  syncAnim()
              }

              override fun onDetachedFromWindow() {
                  anim?.cancel()
                  anim = null
                  super.onDetachedFromWindow()
              }

              // ---------- mise en page ----------

              private fun face(m: Mod): Typeface {
                  val names = arrayOf("sans-serif", "serif", "monospace", "casual", "sans-serif-condensed")
                  val name = names[m.font.coerceIn(0, 4)]
                  val key = name + m.bold
                  return faces.getOrPut(key) { Typeface.create(name, if (m.bold) Typeface.BOLD else Typeface.NORMAL) }
              }

              private fun iconOf(m: Mod, v: ModuleValue): String =
                  if (m.autoIcon && v.icon != null) v.icon else m.icon

              private fun textOf(m: Mod, v: ModuleValue): String =
                  if (v.text.isEmpty() && m.kind != Kind.CUSTOM) "" else m.label + v.text

              private fun spacerW(m: Mod): Float = arrayOf(6f, 14f, 28f, 60f)[m.opt.coerceIn(0, 3)]

              /** Largeur de la LED selon son style, en multiple de sa taille */
              private fun ledWf(style: Int): Float = when (style) {
                  2 -> 1.8f
                  4, 7 -> 0.5f
                  9 -> 1.5f
                  10 -> 2.2f
                  11 -> 1.25f
                  14 -> 1.6f
                  15 -> 0.5f
                  16 -> 2.2f
                  else -> 1f
              }

              private fun ledW(m: Mod, s: Float): Float = m.ledSize * d * s * ledWf(m.ledStyle)

              private fun setText(m: Mod, s: Float, icon: Boolean) {
                  tp.typeface = face(m)
                  tp.textSize = m.textSize * (Store.cfg.fontScale / 100f) * d * s * (if (icon) 1.15f else 1f)
                  tp.color = m.textColor
              }

              private fun notifTotal(m: Mod): Int = minOf(m.opt + 2, engine.notifItems().size)

              /** Début (inclus) et fin (exclue) des icônes à dessiner : toutes, ou la moitié gauche / droite */
              private fun notifFrom(m: Mod): Int = if (m.part == 2) (notifTotal(m) + 1) / 2 else 0

              private fun notifTo(m: Mod): Int = if (m.part == 1) (notifTotal(m) + 1) / 2 else notifTotal(m)

              private fun notifN(m: Mod): Int = notifTo(m) - notifFrom(m)

              private fun measure(m: Mod, s: Float): Float {
                  val v = vals[m.id] ?: return 0f
                  if (m.kind == Kind.SPACER) return spacerW(m) * d * s
                  val g = 4f * d * s
                  var w = 0f
                  var parts = 0
                  if (m.showLed && m.part == 0) {
                      w += ledW(m, s)
                      parts++
                  }
                  if (m.showIcon) {
                      if (m.kind == Kind.NOTIF_ICONS) {
                          val isz = m.textSize * (Store.cfg.fontScale / 100f) * d * s * 1.35f
                          val n = notifN(m)
                          if (n > 0) {
                              w += n * (isz + 2f * d * s)
                              parts++
                          }
                      } else {
                          setText(m, s, true)
                          w += tp.measureText(iconOf(m, v))
                          parts++
                      }
                  }
                  val t = textOf(m, v)
                  if (m.showText && t.isNotEmpty() && m.part == 0) {
                      setText(m, s, false)
                      w += tp.measureText(t)
                      parts++
                  }
                  return w + g * (if (parts > 0) parts - 1 else 0)
              }

              private fun drawMod(canvas: Canvas, m: Mod, x0: Float, cy0: Float, s: Float) {
                  val v = vals[m.id] ?: return
                  if (m.kind == Kind.SPACER) return
                  val g = 4f * d * s
                  val cy = cy0 + (m.shiftY + Store.cfg.lineY) * d
                  var x = x0 + m.shiftX * d
                  var first = true
                  if (m.showLed && m.part == 0) {
                      drawLed(canvas, m, v, x, cy, s)
                      x += ledW(m, s)
                      first = false
                  }
                  if (m.showIcon) {
                      if (m.kind == Kind.NOTIF_ICONS) {
                          val items = engine.notifItems()
                          val n = notifN(m)
                          if (n > 0) {
                              if (!first) x += g
                              val isz = m.textSize * (Store.cfg.fontScale / 100f) * d * s * 1.35f
                              for (i in notifFrom(m) until notifTo(m)) {
                                  val dr = engine.appIcon(items[i].pkg)
                                  if (dr != null) {
                                      dr.setBounds(x.toInt(), (cy - isz / 2f).toInt(), (x + isz).toInt(), (cy + isz / 2f).toInt())
                                      dr.draw(canvas)
                                  }
                                  x += isz + 2f * d * s
                              }
                              first = false
                          }
                      } else {
                          if (!first) x += g
                          setText(m, s, true)
                          val ic = iconOf(m, v)
                          canvas.drawText(ic, x, cy - (tp.ascent() + tp.descent()) / 2f, tp)
                          x += tp.measureText(ic)
                          first = false
                      }
                  }
                  val t = textOf(m, v)
                  if (m.showText && t.isNotEmpty() && m.part == 0) {
                      if (!first) x += g
                      setText(m, s, false)
                      canvas.drawText(t, x, cy - (tp.ascent() + tp.descent()) / 2f, tp)
                  }
              }

              private fun drawLed(canvas: Canvas, m: Mod, v: ModuleValue, x: Float, cy: Float, s: Float) {
                  val blink = m.ledBlink || v.blink
                  if (blink && (System.currentTimeMillis() / 500L) % 2L == 1L) return
                  val color = if (!v.active && m.autoLed) tc("inactive", Pal.GRAY) else if (m.autoLed) v.led else m.ledColor
                  val ls = m.ledSize * d * s
                  lp.color = color
                  lp.maskFilter = null
                  lp.style = Paint.Style.FILL
                  when (m.ledStyle) {
                      1 -> { // anneau
                          lp.style = Paint.Style.STROKE
                          lp.strokeWidth = ls * 0.24f
                          canvas.drawCircle(x + ls / 2f, cy, ls / 2f - ls * 0.12f, lp)
                      }
                      2 -> { // barre horizontale
                          rect.set(x, cy - ls * 0.3f, x + ls * 1.8f, cy + ls * 0.3f)
                          canvas.drawRoundRect(rect, ls * 0.3f, ls * 0.3f, lp)
                      }
                      3 -> { // point lumineux
                          lp.maskFilter = BlurMaskFilter(ls * 0.7f, BlurMaskFilter.Blur.NORMAL)
                          lp.alpha = 170
                          canvas.drawCircle(x + ls / 2f, cy, ls * 0.8f, lp)
                          lp.maskFilter = null
                          lp.color = color
                          canvas.drawCircle(x + ls / 2f, cy, ls / 2f, lp)
                      }
                      4 -> { // barre verticale
                          rect.set(x, cy - ls * 1.2f, x + ls * 0.5f, cy + ls * 1.2f)
                          canvas.drawRoundRect(rect, ls * 0.25f, ls * 0.25f, lp)
                      }
                      5 -> { // carré arrondi
                          rect.set(x, cy - ls / 2f, x + ls, cy + ls / 2f)
                          canvas.drawRoundRect(rect, ls * 0.22f, ls * 0.22f, lp)
                      }
                      6 -> { // losange
                          ledPath.reset()
                          ledPath.moveTo(x + ls / 2f, cy - ls * 0.65f)
                          ledPath.lineTo(x + ls, cy)
                          ledPath.lineTo(x + ls / 2f, cy + ls * 0.65f)
                          ledPath.lineTo(x, cy)
                          ledPath.close()
                          canvas.drawPath(ledPath, lp)
                      }
                      7 -> { // barre verticale lumineuse
                          lp.maskFilter = BlurMaskFilter(ls * 0.6f, BlurMaskFilter.Blur.NORMAL)
                          lp.alpha = 170
                          rect.set(x - ls * 0.15f, cy - ls * 1.35f, x + ls * 0.65f, cy + ls * 1.35f)
                          canvas.drawRoundRect(rect, ls * 0.3f, ls * 0.3f, lp)
                          lp.maskFilter = null
                          lp.color = color
                          rect.set(x, cy - ls * 1.2f, x + ls * 0.5f, cy + ls * 1.2f)
                          canvas.drawRoundRect(rect, ls * 0.25f, ls * 0.25f, lp)
                      }
                      8 -> { // cible : anneau + point
                          lp.style = Paint.Style.STROKE
                          lp.strokeWidth = ls * 0.18f
                          canvas.drawCircle(x + ls / 2f, cy, ls / 2f - ls * 0.09f, lp)
                          lp.style = Paint.Style.FILL
                          canvas.drawCircle(x + ls / 2f, cy, ls * 0.19f, lp)
                      }
                      9 -> { // trois barres montantes
                          val bw = ls * 0.38f
                          val base = cy + ls
                          for (i in 0..2) {
                              val bh = ls * (0.8f + 0.6f * i)
                              val bx = x + i * (bw + ls * 0.18f)
                              rect.set(bx, base - bh, bx + bw, base)
                              canvas.drawRoundRect(rect, bw * 0.3f, bw * 0.3f, lp)
                          }
                      }
                      10 -> { // trait fin
                          rect.set(x, cy - ls * 0.12f, x + ls * 2.2f, cy + ls * 0.12f)
                          canvas.drawRoundRect(rect, ls * 0.12f, ls * 0.12f, lp)
                      }
                      11 -> { // étoile à 4 branches
                          val cx = x + ls * 0.625f
                          val ro = ls * 0.65f
                          val ri = ls * 0.2f
                          ledPath.reset()
                          for (i in 0 until 8) {
                              val ang = Math.PI / 4.0 * i - Math.PI / 2.0
                              val r = if (i % 2 == 0) ro else ri
                              val px = cx + (Math.cos(ang) * r).toFloat()
                              val py = cy + (Math.sin(ang) * r).toFloat()
                              if (i == 0) ledPath.moveTo(px, py) else ledPath.lineTo(px, py)
                          }
                          ledPath.close()
                          canvas.drawPath(ledPath, lp)
                      }
                      12 -> { // point qui respire
                          val k = 0.5f + 0.5f * Math.sin(System.currentTimeMillis() / 330.0).toFloat()
                          lp.maskFilter = BlurMaskFilter(ls * 0.6f, BlurMaskFilter.Blur.NORMAL)
                          lp.alpha = (60 + 120 * k).toInt()
                          canvas.drawCircle(x + ls / 2f, cy, ls * (0.65f + 0.2f * k), lp)
                          lp.maskFilter = null
                          lp.color = color
                          lp.alpha = (110 + 145 * k).toInt()
                          canvas.drawCircle(x + ls / 2f, cy, ls / 2f, lp)
                      }
                      13 -> { // triangle
                          ledPath.reset()
                          ledPath.moveTo(x + ls / 2f, cy - ls * 0.58f)
                          ledPath.lineTo(x + ls, cy + ls * 0.46f)
                          ledPath.lineTo(x, cy + ls * 0.46f)
                          ledPath.close()
                          canvas.drawPath(ledPath, lp)
                      }
                      14 -> { // niveau : 4 barres qui s'allument
                          val f = if (v.frac < 0f) 1f else v.frac
                          val dim = (color and 0x00FFFFFF) or (0x40 shl 24)
                          val on = if (f <= 0f) 0 else maxOf(1, Math.round(f * 4f))
                          val bw = ls * 0.3f
                          val base = cy + ls * 0.9f
                          for (i in 0..3) {
                              val bh = ls * (0.6f + 0.45f * i)
                              val bx = x + i * (bw + ls * 0.12f)
                              rect.set(bx, base - bh, bx + bw, base)
                              lp.color = if (i < on) color else dim
                              canvas.drawRoundRect(rect, bw * 0.3f, bw * 0.3f, lp)
                          }
                      }
                      15 -> { // niveau : jauge verticale
                          val f = if (v.frac < 0f) 1f else v.frac
                          val dim = (color and 0x00FFFFFF) or (0x40 shl 24)
                          val hh = ls * 2.4f
                          val ww = ls * 0.5f
                          rect.set(x, cy - hh / 2f, x + ww, cy + hh / 2f)
                          lp.color = dim
                          canvas.drawRoundRect(rect, ww / 2f, ww / 2f, lp)
                          if (f > 0f) {
                              val fh = maxOf(ww, hh * f)
                              rect.set(x, cy + hh / 2f - fh, x + ww, cy + hh / 2f)
                              lp.color = color
                              canvas.drawRoundRect(rect, ww / 2f, ww / 2f, lp)
                          }
                      }
                      16 -> { // niveau : jauge horizontale
                          val f = if (v.frac < 0f) 1f else v.frac
                          val dim = (color and 0x00FFFFFF) or (0x40 shl 24)
                          val ww = ls * 2.2f
                          val hh = ls * 0.45f
                          rect.set(x, cy - hh / 2f, x + ww, cy + hh / 2f)
                          lp.color = dim
                          canvas.drawRoundRect(rect, hh / 2f, hh / 2f, lp)
                          if (f > 0f) {
                              val fw = maxOf(hh, ww * f)
                              rect.set(x, cy - hh / 2f, x + fw, cy + hh / 2f)
                              lp.color = color
                              canvas.drawRoundRect(rect, hh / 2f, hh / 2f, lp)
                          }
                      }
                      17 -> { // niveau : cadran
                          val f = if (v.frac < 0f) 1f else v.frac
                          val dim = (color and 0x00FFFFFF) or (0x40 shl 24)
                          val sw = ls * 0.24f
                          rect.set(x + sw / 2f, cy - ls / 2f + sw / 2f, x + ls - sw / 2f, cy + ls / 2f - sw / 2f)
                          lp.style = Paint.Style.STROKE
                          lp.strokeWidth = sw
                          lp.color = dim
                          canvas.drawOval(rect, lp)
                          if (f > 0f) {
                              lp.color = color
                              lp.strokeCap = Paint.Cap.ROUND
                              canvas.drawArc(rect, -90f, 360f * f, false, lp)
                              lp.strokeCap = Paint.Cap.BUTT
                          }
                      }
                      else -> { // point
                          canvas.drawCircle(x + ls / 2f, cy, ls / 2f, lp)
                      }
                  }
                  lp.alpha = 255
                  lp.maskFilter = null
              }

              private fun visibleMods(c: Config, zone: Int): List<Mod> {
                  val out = ArrayList<Mod>()
                  for (m in c.mods) {
                      if (!m.enabled) continue
                      if (m.kind == Kind.NOTIF_ICONS && m.split) {
                          // tuile coupée par l'appareil photo : moitié à gauche du trou, moitié à droite
                          if (zone != 1 && zone != 2) continue
                          val vs = vals[m.id] ?: continue
                          if (m.hideInactive && !vs.active) continue
                          val half = Mod(m.j)
                          half.part = if (zone == 1) 1 else 2
                          if (notifN(half) > 0) out.add(half)
                          continue
                      }
                      if (m.zone != zone) continue
                      val v = vals[m.id] ?: continue
                      if (m.hideInactive && !v.active) continue
                      if (!m.showLed && !m.showIcon && !m.showText && m.kind != Kind.SPACER) continue
                      out.add(m)
                  }
                  return out
              }

              /** Une moitié de barre : la zone a part du début, la zone b colle à la fin */
              private fun drawRegion(canvas: Canvas, a: List<Mod>, b: List<Mod>, start: Float, end: Float, cy: Float, gap: Float) {
                  val avail = end - start
                  if (avail <= 0f || (a.isEmpty() && b.isEmpty())) return
                  val wa1 = a.map { measure(it, 1f) }
                  val wb1 = b.map { measure(it, 1f) }
                  val ga1 = if (a.size > 1) gap * (a.size - 1) else 0f
                  val gb1 = if (b.size > 1) gap * (b.size - 1) else 0f
                  val mid = if (a.isNotEmpty() && b.isNotEmpty()) gap else 0f
                  val total1 = wa1.sum() + ga1 + wb1.sum() + gb1 + mid
                  val s = if (total1 > avail) (avail / total1).coerceIn(0.45f, 1f) else 1f
                  val wa = if (s == 1f) wa1 else a.map { measure(it, s) }
                  val wb = if (s == 1f) wb1 else b.map { measure(it, s) }
                  val gbs = if (b.size > 1) gap * s * (b.size - 1) else 0f
                  var x = start
                  for (i in a.indices) {
                      drawMod(canvas, a[i], x, cy, s)
                      x += wa[i] + gap * s
                  }
                  var xb = end - (wb.sum() + gbs)
                  for (i in b.indices) {
                      drawMod(canvas, b[i], xb, cy, s)
                      xb += wb[i] + gap * s
                  }
              }

              // ---------- dessin ----------

              override fun onDraw(canvas: Canvas) {
                  val c = Store.cfg
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0f || h <= 0f) return

                  val hr0 = c.holeD * d / 2f
                  val hxReal = w / 2f + (c.holeX - c.offX) * d
                  val hy = (c.holeY - c.offY) * d
                  val half = c.padEdge * d * 0.5f
                  val inside = c.holeOn && hxReal - hr0 > half && hxReal + hr0 < w - half
                  val hr = if (inside) hr0 else 0f
                  val hx = if (inside) hxReal else w / 2f

                  val key = Store.rev.toString() + "|" + w.toInt() + "|" + h.toInt() + "|" + (phase * 20f).toInt()
                  if (key != pathKey) {
                      path = Shapes.build(c, w, h, d, phase)
                      pathKey = key
                  }

                  val sc = canvas.saveLayer(0f, 0f, w, h, null)

                  // fond
                  fillPaint.style = Paint.Style.FILL
                  if (c.grad) {
                      val rad = Math.toRadians(c.gradAngle.toDouble())
                      val dx = (cos(rad) * w / 2f).toFloat()
                      val dy = (sin(rad) * h / 2f).toFloat()
                      fillPaint.shader = LinearGradient(w / 2f - dx, h / 2f - dy, w / 2f + dx, h / 2f + dy, c.fill, c.fill2, Shader.TileMode.CLAMP)
                  } else {
                      fillPaint.shader = null
                      fillPaint.color = c.fill
                  }
                  canvas.drawPath(path, fillPaint)
                  if (c.borderW > 0) {
                      strokePaint.color = c.border
                      strokePaint.strokeWidth = c.borderW * d
                      canvas.drawPath(path, strokePaint)
                  }

                  // fondu (fade) transparent sur le bas de la barre : il n'efface que le fond, pas les infos
                  if (c.fadeOn && c.fadeH > 0 && c.fadeAmt > 0) {
                      val fh = (h * c.fadeH / 100f).coerceIn(1f, h)
                      val a = (255 * c.fadeAmt / 100f).toInt().coerceIn(0, 255)
                      fadePaint.shader = LinearGradient(0f, h - fh, 0f, h, 0x00000000, Color.argb(a, 0, 0, 0), Shader.TileMode.CLAMP)
                      canvas.drawRect(0f, h - fh, w, h, fadePaint)
                  }

                  // infos
                  val cy = h / 2f
                  val gap = c.spacing * d
                  val edge = c.padEdge * d
                  val hp = if (inside) c.holePad * d else gap / 2f
                  drawRegion(canvas, visibleMods(c, 0), visibleMods(c, 1), edge, hx - hr - hp, cy, gap)
                  drawRegion(canvas, visibleMods(c, 2), visibleMods(c, 3), hx + hr + hp, w - edge, cy, gap)

                  // fines barres de progression, puis animations
                  drawGauge(canvas, c, 1, w, h)
                  drawGauge(canvas, c, 2, w, h)
                  if (anims.isNotEmpty()) drawAnims(canvas, c, w, h)

                  // trou de l'appareil photo : rien derrière
                  if (c.holeOn && c.cut) {
                      canvas.drawCircle(hxReal, hy, hr0, clearPaint)
                  }
                  canvas.restoreToCount(sc)
                  if (anims.isNotEmpty()) postInvalidateOnAnimation()
              }
          }
