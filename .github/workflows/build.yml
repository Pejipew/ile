          cat > app/src/main/java/com/example/island/IslandBus.kt <<'KOTLIN_EOF'
          package com.example.island

          import android.os.Handler
          import android.os.Looper

          /** Pont entre l'écoute des notifications et l'île */
          object IslandBus {
              @Volatile
              var ledColor: Int = 0 // 0 = LED éteinte

              @Volatile
              var count: Int = 0

              /** Vrai : la LED clignote franchement (ex : plus de signal mobile) */
              @Volatile
              var blink: Boolean = false

              /** Vrai pendant l'aperçu d'une couleur : les mises à jour automatiques attendent */
              @Volatile
              var hold: Boolean = false

              var onChange: (() -> Unit)? = null
              private val main = Handler(Looper.getMainLooper())

              fun update(color: Int, count: Int, blink: Boolean = false) {
                  ledColor = color
                  this.count = count
                  this.blink = blink
                  main.post { onChange?.invoke() }
              }
          }
          KOTLIN_EOF
          mkdir -p app/src/main/java/com/example/island
          cat > app/src/main/java/com/example/island/IslandController.kt <<'KOTLIN_EOF'
          package com.example.island

          import android.content.Context
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.telephony.TelephonyManager
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout

          /** Forme d'encoche accrochée en haut de l'écran, avec une LED au centre */
          class IslandController(private val ctx: Context, private val windowType: Int) {

              private val wm = ctx.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private val prefs = Prefs(ctx)
              private val handler = Handler(Looper.getMainLooper())
              private val bg = IslandDrawable()
              private val ledView = View(ctx)
              private var root: FrameLayout? = null
              private var lp: WindowManager.LayoutParams? = null

              private var blinking = false
              private var blinkOn = false
              private val blinker = object : Runnable {
                  override fun run() {
                      if (!blinking) return
                      blinkOn = !blinkOn
                      ledView.alpha = if (blinkOn) 1f else 0f
                      handler.postDelayed(this, 500)
                  }
              }

              private fun stopBlink() {
                  if (blinking) {
                      blinking = false
                      handler.removeCallbacks(blinker)
                  }
              }

              private val signalPoll = object : Runnable {
                  override fun run() {
                      if (prefs.ledMode != "signal") return
                      if (!IslandBus.hold) {
                          val level = signalLevel()
                          if (level < 0) IslandBus.update(0, 0)
                          else IslandBus.update(prefs.signalColor(level), level, level == 0)
                      }
                      handler.postDelayed(this, 2000)
                  }
              }

              /** Niveau de signal de 0 à 4, ou -1 si indisponible (permission refusée, etc.) */
              private fun signalLevel(): Int {
                  if (Build.VERSION.SDK_INT < 28) return -1
                  return try {
                      val tm = ctx.getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
                      tm.signalStrength?.level ?: 0
                  } catch (_: Exception) {
                      -1
                  }
              }

              /** Choisit la source de la LED selon le mode réglé dans l'appli */
              fun updateSource() {
                  handler.removeCallbacks(signalPoll)
                  if (prefs.ledMode == "signal") {
                      signalPoll.run()
                  } else {
                      val l = NotifListener.instance
                      if (l != null) l.recompute() else IslandBus.update(0, 0)
                  }
              }

              fun start() {
                  stop()
                  (ledView.parent as? android.view.ViewGroup)?.removeView(ledView)
                  val v = FrameLayout(ctx).apply { background = bg }
                  v.addView(ledView, FrameLayout.LayoutParams(prefs.ledWidth, prefs.ledHeight, Gravity.CENTER))

                  val params = WindowManager.LayoutParams(
                      prefs.width,
                      prefs.height,
                      windowType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      if (Build.VERSION.SDK_INT >= 30) {
                          layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                      } else if (Build.VERSION.SDK_INT >= 28) {
                          layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                  }
                  root = v
                  lp = params
                  wm.addView(v, params)
                  applyLive()
                  updateSource()
              }

              fun stop() {
                  handler.removeCallbacksAndMessages(null)
                  blinking = false
                  root?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  root = null
              }

              /** Relit tous les réglages (en pixels) et met la fenêtre à jour immédiatement */
              fun applyLive() {
                  val v = root ?: return
                  val params = lp ?: return

                  bg.set(prefs.flare.toFloat(), prefs.bottomRadius.toFloat(), prefs.bgColor)

                  val ledLp = ledView.layoutParams as FrameLayout.LayoutParams
                  ledLp.width = prefs.ledWidth
                  ledLp.height = prefs.ledHeight
                  ledLp.gravity = Gravity.CENTER
                  ledView.layoutParams = ledLp
                  ledView.translationX = prefs.ledX.toFloat()
                  ledView.translationY = prefs.ledY.toFloat()

                  params.width = prefs.width
                  params.height = prefs.height
                  params.x = prefs.xOffset
                  params.y = 0
                  try { wm.updateViewLayout(v, params) } catch (_: Exception) {}

                  refreshLed()
              }

              fun refreshLed() {
                  val v = root ?: return
                  val c = IslandBus.ledColor
                  val on = prefs.ledEnabled && c != 0

                  v.visibility = if (prefs.showOnlyWithLed && !on) View.INVISIBLE else View.VISIBLE

                  if (on) {
                      ledView.visibility = View.VISIBLE
                      ledView.background = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          cornerRadius = prefs.ledRadius.toFloat()
                          setColor(c)
                      }
                      if (IslandBus.blink) {
                          // clignotement franc (ex : plus de signal)
                          if (!blinking) {
                              blinking = true
                              handler.post(blinker)
                          }
                      } else {
                          stopBlink()
                          ledView.alpha = 1f
                      }
                  } else {
                      stopBlink()
                      ledView.alpha = 1f
                      ledView.visibility = View.INVISIBLE
                  }
              }
          }
          KOTLIN_EOF
          mkdir -p app/src/main/java/com/example/island
          cat > app/src/main/java/com/example/island/IslandDrawable.kt <<'KOTLIN_EOF'
          package com.example.island

          import android.graphics.Canvas
          import android.graphics.ColorFilter
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.RectF
          import android.graphics.drawable.Drawable

          /**
           * Forme d'encoche : accrochée au bord haut de l'écran, avec des raccords
           * concaves en haut (évasement) et un bas arrondi.
           */
          class IslandDrawable : Drawable() {

              private var flare = 0f
              private var radius = 0f
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val path = Path()

              fun set(flare: Float, radius: Float, fill: Int) {
                  this.flare = flare
                  this.radius = radius
                  paint.color = fill
                  invalidateSelf()
              }

              override fun draw(canvas: Canvas) {
                  val w = bounds.width().toFloat()
                  val h = bounds.height().toFloat()
                  if (w <= 0f || h <= 0f) return
                  canvas.save()
                  canvas.translate(bounds.left.toFloat(), bounds.top.toFloat())

                  val f = minOf(flare, w / 4f, h / 2f).coerceAtLeast(0f)
                  val bodyW = w - 2f * f
                  val r = minOf(radius, bodyW / 2f, h - f).coerceAtLeast(0f)

                  path.reset()
                  path.moveTo(0f, 0f)
                  path.lineTo(w, 0f)
                  if (f > 0.5f) path.arcTo(RectF(w - f, 0f, w + f, 2f * f), 270f, -90f)
                  if (r > 0.5f) {
                      path.lineTo(w - f, h - r)
                      path.arcTo(RectF(w - f - 2f * r, h - 2f * r, w - f, h), 0f, 90f)
                      path.lineTo(f + r, h)
                      path.arcTo(RectF(f, h - 2f * r, f + 2f * r, h), 90f, 90f)
                  } else {
                      path.lineTo(w - f, h)
                      path.lineTo(f, h)
                  }
                  path.lineTo(f, f)
                  if (f > 0.5f) path.arcTo(RectF(-f, 0f, f, 2f * f), 0f, -90f)
                  path.close()

                  canvas.drawPath(path, paint)
                  canvas.restore()
              }

              override fun setAlpha(alpha: Int) {
                  paint.alpha = alpha
              }

              override fun setColorFilter(colorFilter: ColorFilter?) {
                  paint.colorFilter = colorFilter
              }

              @Suppress("OVERRIDE_DEPRECATION")
              override fun getOpacity(): Int = PixelFormat.TRANSLUCENT
          }
          KOTLIN_EOF
          mkdir -p app/src/main/java/com/example/island
          cat > app/src/main/java/com/example/island/MainActivity.kt <<'KOTLIN_EOF'
          package com.example.island

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var prefs: Prefs
              private lateinit var status: TextView
              private lateinit var appList: LinearLayout
              private lateinit var signalList: LinearLayout
              private lateinit var netList: LinearLayout
              private lateinit var bg1: LinearLayout
              private lateinit var bg2: LinearLayout
              private val handler = Handler(Looper.getMainLooper())
              private var preview = true
              private var inForeground = false

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              /** Applique les réglages aux encoches, en direct */
              private fun reloadIsland() {
                  IslandAccessibilityService.instance?.reload()
              }

              private fun recomputeLed() {
                  NotifListener.instance?.recompute()
              }

              private fun restoreLed() {
                  if (prefs.ledMode == "signal") {
                      IslandAccessibilityService.instance?.refreshSource()
                      return
                  }
                  if (preview && inForeground) {
                      IslandBus.update(Color.GREEN, 1)
                      return
                  }
                  val l = NotifListener.instance
                  if (l != null) l.recompute() else IslandBus.update(0, 0)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = Prefs(this)

                  // Le mode signal mobile est actif par défaut : on demande l'autorisation dès le début
                  if (prefs.ledMode == "signal" &&
                      checkSelfPermission(Manifest.permission.READ_PHONE_STATE) !=
                      PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.READ_PHONE_STATE), 7)
                  }

                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(40), dp(20), dp(40))
                  }

                  col.addView(TextView(this).apply {
                      text = "Custom Island"
                      textSize = 26f
                  })
                  status = TextView(this).apply { setPadding(0, dp(12), 0, 0) }
                  col.addView(status)

                  col.addView(button("1. Activer l'île (service d'accessibilité)") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })
                  col.addView(button("2. Activer l'accès aux notifications (LED)") {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  })

                  // ----- Encoche 1 : forme (réglages en pixels, en direct) -----
                  col.addView(section("Encoche 1 (LED) : forme, réglage au pixel près en direct"))
                  col.addView(seek("Largeur", 20, 200, { prefs.width }, { prefs.width = it }))
                  col.addView(seek("Hauteur", 16, 80, { prefs.height }, { prefs.height = it }))
                  col.addView(seek("Évasement du haut", 0, 30, { prefs.flare }, { prefs.flare = it }))
                  col.addView(seek("Arrondi du bas", 0, 60, { prefs.bottomRadius }, { prefs.bottomRadius = it }))
                  col.addView(seek("Position horizontale (0 = centre)", -200, 200, { prefs.xOffset }, { prefs.xOffset = it }))
                  bg1 = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(bg1)
                  col.addView(switch("Cacher la forme quand la LED est éteinte", prefs.showOnlyWithLed) {
                      prefs.showOnlyWithLed = it; reloadIsland()
                  })

                  // ----- LED -----
                  col.addView(section("LED"))
                  col.addView(section("Ce que montre la LED"))
                  col.addView(
                      radios(
                          listOf("notif" to "Notifications", "signal" to "Qualité du signal mobile"),
                          prefs.ledMode
                      ) {
                          prefs.ledMode = it
                          if (it == "signal" &&
                              checkSelfPermission(Manifest.permission.READ_PHONE_STATE) !=
                              PackageManager.PERMISSION_GRANTED
                          ) {
                              requestPermissions(arrayOf(Manifest.permission.READ_PHONE_STATE), 7)
                          }
                          IslandAccessibilityService.instance?.refreshSource()
                      }
                  )
                  col.addView(switch("LED activée", prefs.ledEnabled) {
                      prefs.ledEnabled = it; recomputeLed(); reloadIsland()
                  })
                  col.addView(switch("Aperçu de la LED pendant les réglages", preview) {
                      preview = it; restoreLed()
                  })
                  col.addView(seek("LED : largeur", 2, 60, { prefs.ledWidth }, { prefs.ledWidth = it }))
                  col.addView(seek("LED : hauteur", 2, 60, { prefs.ledHeight }, { prefs.ledHeight = it }))
                  col.addView(seek("LED : arrondi", 0, 30, { prefs.ledRadius }, { prefs.ledRadius = it }))
                  col.addView(seek("LED : position horizontale (0 = centre)", -100, 100, { prefs.ledX }, { prefs.ledX = it }))
                  col.addView(seek("LED : position verticale (0 = centre)", -50, 50, { prefs.ledY }, { prefs.ledY = it }))
                  col.addView(button("Tester la LED (6 s)") {
                      IslandBus.update(Color.GREEN, 1)
                      handler.postDelayed({ restoreLed() }, 6000)
                  })

                  // ----- Couleurs du signal mobile -----
                  col.addView(section("Couleurs du signal mobile (touche pour changer, clignote à 0/4)"))
                  signalList = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(signalList)

                  // ----- Encoche 2 : type de réseau -----
                  col.addView(section("Encoche 2 : type de réseau (5G, 4G…), réglage au pixel près en direct"))
                  col.addView(switch("Encoche 2 activée", prefs.n2Enabled) { prefs.n2Enabled = it; reloadIsland() })
                  col.addView(seek("Largeur", 20, 200, { prefs.n2Width }, { prefs.n2Width = it }))
                  col.addView(seek("Hauteur", 16, 80, { prefs.n2Height }, { prefs.n2Height = it }))
                  col.addView(seek("Évasement du haut", 0, 30, { prefs.n2Flare }, { prefs.n2Flare = it }))
                  col.addView(seek("Arrondi du bas", 0, 60, { prefs.n2BottomRadius }, { prefs.n2BottomRadius = it }))
                  col.addView(seek("Position horizontale (0 = centre)", -200, 200, { prefs.n2XOffset }, { prefs.n2XOffset = it }))
                  col.addView(seek("Taille du texte", 6, 24, { prefs.n2TextSize }, { prefs.n2TextSize = it }, false))
                  bg2 = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(bg2)
                  col.addView(switch("Texte en couleur du réseau", prefs.n2Colored) { prefs.n2Colored = it; reloadIsland() })
                  col.addView(section("Couleurs par type de réseau (touche pour changer)"))
                  netList = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(netList)

                  // ----- Couleur par appli -----
                  col.addView(section("Mode notifications : couleur de la LED selon l'appli (touche une ligne pour changer)"))
                  appList = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(appList)
                  col.addView(button("+ Ajouter une appli") { addApp() })

                  setContentView(ScrollView(this).apply { addView(col) })
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  IslandAccessibilityService.instance?.refreshSource()
              }

              override fun onPause() {
                  super.onPause()
                  inForeground = false
                  restoreLed()
              }

              override fun onResume() {
                  super.onResume()
                  inForeground = true
                  restoreLed()
                  val acc = IslandAccessibilityService.instance != null
                  val notif = NotifListener.instance != null
                  status.text = "Île : " + (if (acc) "active ✔" else "inactive ✘") +
                      "\nLED notifications : " + (if (notif) "active ✔" else "inactive ✘")
                  refreshBg()
                  refreshApps()
                  refreshSignal()
                  refreshNet()
              }

              // ---------- Couleurs du fond (cercle chromatique) ----------

              private fun refreshBg() {
                  bg1.removeAllViews()
                  bg1.addView(row("Couleur de la forme", "touche pour choisir", prefs.bgColor) {
                      pickBg("Couleur de la forme", { prefs.bgColor }, { prefs.bgColor = it })
                  })
                  bg2.removeAllViews()
                  bg2.addView(row("Couleur du fond de l'encoche 2", "touche pour choisir", prefs.n2BgColor) {
                      pickBg("Fond de l'encoche 2", { prefs.n2BgColor }, { prefs.n2BgColor = it })
                  })
              }

              /** Choix du fond avec aperçu direct sur l'encoche, annulé si on ferme sans valider */
              private fun pickBg(title: String, get: () -> Int, set: (Int) -> Unit) {
                  val original = get()
                  var ok = false
                  pickColor(
                      title, original,
                      { c ->
                          ok = true
                          set(c)
                          reloadIsland()
                          refreshBg()
                      },
                      null,
                      onPreview = { pc ->
                          if (pc != 0) {
                              set(pc)
                              reloadIsland()
                          } else if (!ok) {
                              set(original)
                              reloadIsland()
                          }
                      }
                  )
              }

              // ---------- Couleurs du réseau et du signal ----------

              private fun refreshNet() {
                  netList.removeAllViews()
                  val names = listOf(
                      "none" to "Aucun service / inconnu",
                      "2G" to "2G (G, E)",
                      "3G" to "3G",
                      "3G+" to "3G+ (HSPA+)",
                      "4G" to "4G (LTE)",
                      "4G+" to "4G+ (LTE-A)",
                      "5G" to "5G",
                      "5G+" to "5G+"
                  )
                  names.forEach { (key, name) ->
                      val c = prefs.netColor(key)
                      netList.addView(row(name, "", c) {
                          pickColor(
                              name, c,
                              { nc ->
                                  prefs.setNetColor(key, nc)
                                  refreshNet()
                                  reloadIsland()
                              },
                              null,
                              onPreview = { pc ->
                                  NetworkIsland.previewColor = pc
                                  reloadIsland()
                              }
                          )
                      })
                  }
              }

              private fun refreshSignal() {
                  signalList.removeAllViews()
                  val names = listOf(
                      "Aucun signal (0/4)", "Très faible (1/4)", "Faible (2/4)", "Bon (3/4)", "Excellent (4/4)"
                  )
                  names.forEachIndexed { i, n ->
                      val c = prefs.signalColor(i)
                      signalList.addView(row(n, "", c) {
                          pickColor(n, c, { nc ->
                              prefs.setSignalColor(i, nc)
                              refreshSignal()
                              restoreLed()
                          }, null)
                      })
                  }
              }

              // ---------- Liste des applis ----------

              private fun appLabel(pkg: String): String = try {
                  packageManager.getApplicationLabel(packageManager.getApplicationInfo(pkg, 0)).toString()
              } catch (_: Exception) {
                  pkg
              }

              private fun refreshApps() {
                  appList.removeAllViews()
                  val def = prefs.ledDefaultColor
                  appList.addView(row("Toutes les autres applis", "sans couleur définie", def) {
                      pickColor("Autres applis", def, { c ->
                          prefs.ledDefaultColor = c
                          refreshApps()
                          recomputeLed()
                      }, null)
                  })
                  val rules = prefs.rules()
                  val pkgs = (rules.keys + prefs.seenPackages)
                      .distinct()
                      .map { appLabel(it) to it }
                      .sortedBy { it.first.lowercase() }
                  pkgs.forEach { (label, pkg) ->
                      val c = rules[pkg]
                      appList.addView(
                          row(label, if (c == null) "pas de couleur définie" else pkg, c ?: prefs.ledDefaultColor) {
                              openPicker(pkg, label)
                          }
                      )
                  }
              }

              private fun openPicker(pkg: String, label: String) {
                  pickColor(
                      label,
                      prefs.rules()[pkg] ?: Color.WHITE,
                      { c ->
                          prefs.setRule(pkg, c)
                          refreshApps()
                          recomputeLed()
                      },
                      {
                          prefs.hidePackage(pkg)
                          refreshApps()
                          recomputeLed()
                      }
                  )
              }

              private fun addApp() {
                  val pm = packageManager
                  val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(intent, 0)
                      .map { it.loadLabel(pm).toString() to it.activityInfo.packageName }
                      .distinctBy { it.second }
                      .sortedBy { it.first.lowercase() }
                  AlertDialog.Builder(this)
                      .setTitle("Choisir une appli")
                      .setItems(apps.map { it.first }.toTypedArray()) { _, i ->
                          openPicker(apps[i].second, apps[i].first)
                      }
                      .show()
              }

              private fun hexOf(c: Int) = String.format("#%06X", c and 0xFFFFFF)

              /** Sélecteur de couleur libre (cercle chromatique + luminosité), aperçu en direct */
              private fun pickColor(
                  title: String,
                  current: Int,
                  onOk: (Int) -> Unit,
                  onRemove: (() -> Unit)?,
                  onPreview: ((Int) -> Unit)? = null
              ) {
                  var color = if (current == 0) Color.WHITE else current
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(8), dp(20), dp(8))
                  }
                  val previewView = View(this)
                  previewView.setBackgroundColor(color)
                  box.addView(previewView, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(44)))

                  val hex = TextView(this).apply {
                      gravity = Gravity.CENTER
                      setPadding(0, dp(6), 0, dp(6))
                  }

                  fun choose(c: Int) {
                      color = c
                      previewView.setBackgroundColor(c)
                      hex.text = hexOf(c)
                      if (onPreview != null) onPreview(c) else IslandBus.update(c, 1)
                  }

                  val wheel = ColorWheelView(this) { c -> choose(c) }
                  wheel.setColor(color)
                  box.addView(hex)
                  box.addView(
                      wheel,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  box.addView(TextView(this).apply {
                      text = "Luminosité"
                      setPadding(0, dp(10), 0, 0)
                  })
                  val hsv = FloatArray(3)
                  Color.colorToHSV(color, hsv)
                  val bright = SeekBar(this)
                  bright.max = 100
                  bright.progress = (hsv[2] * 100).toInt()
                  bright.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          if (fromUser) wheel.setBrightness(p / 100f)
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  box.addView(bright)

                  val mute = Switch(this)
                  mute.text = "Pas de LED"
                  mute.isChecked = current == 0
                  mute.setPadding(0, dp(14), 0, dp(8))
                  box.addView(mute)
                  if (onPreview != null) mute.visibility = View.GONE

                  IslandBus.hold = true
                  choose(color)

                  val b = AlertDialog.Builder(this)
                      .setTitle(title)
                      .setView(ScrollView(this).apply { addView(box) })
                      .setPositiveButton("OK") { _, _ -> onOk(if (mute.isChecked) 0 else color) }
                      .setNegativeButton("Annuler", null)
                  if (onRemove != null) b.setNeutralButton("Supprimer") { _, _ -> onRemove() }
                  b.setOnDismissListener {
                      IslandBus.hold = false
                      onPreview?.invoke(0)
                      restoreLed()
                  }
                  b.show()
              }

              // ---------- Petits helpers d'UI ----------

              private fun row(title: String, sub: String, color: Int, onClick: () -> Unit): LinearLayout {
                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(8), 0, dp(8))
                      setOnClickListener { onClick() }
                  }
                  val sw = TextView(this).apply {
                      gravity = Gravity.CENTER
                      text = if (color == 0) "✕" else ""
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(if (color == 0) Color.LTGRAY else color)
                          setStroke(dp(1), Color.GRAY)
                      }
                  }
                  val t = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  t.addView(TextView(this).apply {
                      text = title
                      textSize = 16f
                  })
                  if (sub.isNotEmpty()) {
                      t.addView(TextView(this).apply {
                          text = sub
                          textSize = 11f
                          setTextColor(Color.GRAY)
                      })
                  }
                  r.addView(sw, LinearLayout.LayoutParams(dp(32), dp(32)).apply { marginEnd = dp(14) })
                  r.addView(t)
                  return r
              }

              private fun section(t: String) = TextView(this).apply {
                  text = t
                  textSize = 15f
                  setPadding(0, dp(24), 0, dp(6))
              }

              private fun button(t: String, onClick: () -> Unit) = Button(this).apply {
                  text = t
                  isAllCaps = false
                  layoutParams = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { topMargin = dp(10) }
                  setOnClickListener { onClick() }
              }

              private fun switch(t: String, checked: Boolean, onChange: (Boolean) -> Unit) = Switch(this).apply {
                  text = t
                  isChecked = checked
                  setPadding(0, dp(8), 0, dp(8))
                  setOnCheckedChangeListener { _, c -> onChange(c) }
              }

              private fun radios(
                  options: List<Pair<String, String>>,
                  current: String,
                  onPick: (String) -> Unit
              ): RadioGroup {
                  val g = RadioGroup(this)
                  options.forEachIndexed { i, (key, name) ->
                      g.addView(RadioButton(this).apply {
                          id = 5000 + i
                          text = name
                          isChecked = key == current
                      })
                  }
                  g.setOnCheckedChangeListener { _, id ->
                      onPick(options[id - 5000].first)
                      reloadIsland()
                  }
                  return g
              }

              private fun stepButton(label: String, onClick: () -> Unit) = Button(this).apply {
                  text = label
                  textSize = 20f
                  isAllCaps = false
                  setPadding(0, 0, 0, 0)
                  minWidth = 0
                  minHeight = 0
                  minimumWidth = 0
                  minimumHeight = 0
                  setOnClickListener { onClick() }
              }

              /**
               * Curseur avec un − et un + à chaque bout pour régler au pixel près.
               * Les bornes sont données en dp, les valeurs sont en pixels (inDp = false : valeur brute, ex. sp).
               */
              private fun seek(
                  title: String,
                  loIn: Int,
                  hiIn: Int,
                  get: () -> Int,
                  set: (Int) -> Unit,
                  inDp: Boolean = true
              ): LinearLayout {
                  val lo = if (inDp) dp(loIn) else loIn
                  val hi = if (inDp) dp(hiIn) else hiIn
                  val unit = if (inDp) " px" else " sp"

                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val tv = TextView(this).apply {
                      text = "$title : ${get()}$unit"
                      setPadding(0, dp(12), 0, 0)
                  }
                  val sb = SeekBar(this)
                  sb.max = hi - lo
                  sb.progress = (get() - lo).coerceIn(0, hi - lo)
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          set(p + lo)
                          tv.text = "$title : ${p + lo}$unit"
                          if (fromUser) reloadIsland()
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })

                  fun nudge(delta: Int) {
                      val nv = (get() + delta).coerceIn(lo, hi)
                      sb.progress = nv - lo
                      set(nv)
                      tv.text = "$title : $nv$unit"
                      reloadIsland()
                  }

                  val line = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  line.addView(stepButton("−") { nudge(-1) }, LinearLayout.LayoutParams(dp(48), dp(44)))
                  line.addView(sb, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  line.addView(stepButton("+") { nudge(1) }, LinearLayout.LayoutParams(dp(48), dp(44)))

                  box.addView(tv)
                  box.addView(line)
                  return box
              }
          }
