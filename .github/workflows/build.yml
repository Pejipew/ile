          package com.example.island

          import android.app.ActivityManager
          import android.app.AlarmManager
          import android.app.NotificationManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.drawable.Drawable
          import android.hardware.camera2.CameraManager
          import android.location.LocationManager
          import android.media.AudioManager
          import android.media.MediaMetadata
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.TrafficStats
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.os.StatFs
          import android.os.SystemClock
          import android.provider.Settings
          import android.telephony.TelephonyManager
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale
          import kotlin.math.abs
          import kotlin.math.roundToInt

          class BattInfo(
              val pct: Int,
              val plugged: Boolean,
              val full: Boolean,
              val tempC: Float,
              val mv: Int,
              val ma: Float,
              val watts: Float
          )

          /** Lit en direct toutes les infos du téléphone et les transforme en ModuleValue */
          class StatusEngine(ctx: Context, private val onUpdate: () -> Unit) {
              private val app: Context = ctx.applicationContext
              private val handler = Handler(Looper.getMainLooper())

              @Volatile
              var fast = false
              private var running = false
              var torchOn = false
                  private set
              private var torchCb: CameraManager.TorchCallback? = null

              private var lastRx = 0L
              private var lastTx = 0L
              private var lastT = 0L
              private var rxRate = 0f
              private var txRate = 0f

              private val fmts = HashMap<String, SimpleDateFormat>()
              private val icons = HashMap<String, Drawable?>()

              private val tick = object : Runnable {
                  override fun run() {
                      if (!running) return
                      sampleSpeed()
                      Weather.maybeRefresh(app) { onUpdate() }
                      onUpdate()
                      handler.postDelayed(this, if (fast) 500L else 1000L)
                  }
              }

              fun start() {
                  if (running) return
                  running = true
                  registerTorch()
                  handler.post(tick)
              }

              fun stop() {
                  running = false
                  handler.removeCallbacks(tick)
                  unregisterTorch()
                  lastT = 0L
              }

              private fun registerTorch() {
                  if (torchCb != null) return
                  try {
                      val cm = app.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      val cb = object : CameraManager.TorchCallback() {
                          override fun onTorchModeChanged(cameraId: String, enabled: Boolean) {
                              torchOn = enabled
                              onUpdate()
                          }

                          override fun onTorchModeUnavailable(cameraId: String) {}
                      }
                      cm.registerTorchCallback(cb, handler)
                      torchCb = cb
                  } catch (e: Exception) {
                  }
              }

              private fun unregisterTorch() {
                  val cb = torchCb ?: return
                  try {
                      val cm = app.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      cm.unregisterTorchCallback(cb)
                  } catch (e: Exception) {
                  }
                  torchCb = null
              }

              private fun sampleSpeed() {
                  val now = SystemClock.elapsedRealtime()
                  val rx = TrafficStats.getTotalRxBytes()
                  val tx = TrafficStats.getTotalTxBytes()
                  if (lastT == 0L) {
                      lastRx = rx
                      lastTx = tx
                      lastT = now
                      return
                  }
                  if (now - lastT >= 400L) {
                      val dt = (now - lastT) / 1000f
                      rxRate = max0((rx - lastRx) / dt)
                      txRate = max0((tx - lastTx) / dt)
                      lastRx = rx
                      lastTx = tx
                      lastT = now
                  }
              }

              private fun max0(v: Float): Float = if (v < 0f) 0f else v

              // ---------- accès utiles pour le dessin ----------

              fun notifItems(): List<NotifItem> = NotifState.items.sortedByDescending { it.time }

              fun appIcon(pkg: String): Drawable? {
                  if (icons.containsKey(pkg)) return icons[pkg]
                  val dr = try {
                      app.packageManager.getApplicationIcon(pkg)
                  } catch (e: Exception) {
                      null
                  }
                  icons[pkg] = dr
                  return dr
              }

              fun batt(): BattInfo {
                  val i = app.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val lvl = i?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = i?.getIntExtra(BatteryManager.EXTRA_SCALE, 100) ?: 100
                  val pct = if (lvl >= 0 && scale > 0) lvl * 100 / scale else 0
                  val plugged = (i?.getIntExtra(BatteryManager.EXTRA_PLUGGED, 0) ?: 0) != 0
                  val status = i?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                  val full = status == BatteryManager.BATTERY_STATUS_FULL
                  val temp = (i?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0) / 10f
                  val mv = i?.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0) ?: 0
                  var cur = 0
                  try {
                      val bm = app.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                      cur = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CURRENT_NOW)
                      if (cur == Int.MIN_VALUE) cur = 0
                  } catch (e: Exception) {
                  }
                  val a = abs(cur.toLong())
                  val ua = if (a < 20000L) a * 1000L else a
                  val ma = ua / 1000f
                  val watts = ma / 1000f * mv / 1000f
                  return BattInfo(pct, plugged, full, temp, mv, ma, watts)
              }

              // ---------- calcul des valeurs ----------

              fun compute(m: Mod): ModuleValue {
                  return try {
                      compute0(m)
                  } catch (e: Exception) {
                      ModuleValue("?", false, Pal.GRAY)
                  }
              }

              private fun fmt(p: String): String {
                  val f = fmts.getOrPut(p) { SimpleDateFormat(p, Locale.getDefault()) }
                  return f.format(Date())
              }

              private fun bars(level: Int, max: Int): String {
                  val chars = "▂▄▆█"
                  val sb = StringBuilder()
                  for (i in 0 until 4) {
                      sb.append(if (i < level * 4 / max) chars[i] else '▁')
                  }
                  return sb.toString()
              }

              private fun pctColor(p: Int): Int = when {
                  p >= 60 -> Pal.GREEN
                  p >= 30 -> Pal.YELLOW
                  p >= 15 -> Pal.ORANGE
                  else -> Pal.RED
              }

              private fun compute0(m: Mod): ModuleValue {
                  val opt = m.opt
                  return when (m.kind) {
                      Kind.TIME -> ModuleValue(
                          fmt(arrayOf("HH:mm", "h:mm a", "HH:mm:ss", "h:mm:ss a", "EEE HH:mm")[opt.coerceIn(0, 4)]),
                          true, Pal.CYAN
                      )
                      Kind.DATE -> ModuleValue(
                          fmt(arrayOf("dd/MM", "EEE dd/MM", "d MMM", "EEEE d MMMM", "d MMM yyyy")[opt.coerceIn(0, 4)]),
                          true, Pal.PURPLE
                      )
                      Kind.BATTERY -> {
                          val b = batt()
                          val txt = when (opt) {
                              1 -> "" + b.pct
                              2 -> bars(b.pct, 100)
                              else -> b.pct.toString() + "%"
                          }
                          val col = if (b.plugged) Pal.GREEN else pctColor(b.pct)
                          ModuleValue(txt, true, col, if (b.plugged) "⚡" else null, !b.plugged && b.pct <= 10)
                      }
                      Kind.CHARGE_WATTS -> {
                          val b = batt()
                          val txt = when (opt) {
                              1 -> b.watts.roundToInt().toString() + " W"
                              2 -> b.ma.roundToInt().toString() + " mA"
                              3 -> "%.2f V".format(b.mv / 1000f)
                              else -> "%.1f W".format(b.watts)
                          }
                          val col = if (b.watts < 5f) Pal.ORANGE else if (b.watts < 15f) Pal.GREEN else Pal.CYAN
                          ModuleValue(if (b.plugged) txt else "—", b.plugged, if (b.plugged) col else Pal.GRAY, "⚡")
                      }
                      Kind.CHARGE_STATE -> {
                          val b = batt()
                          when {
                              !b.plugged -> ModuleValue("Débranché", false, Pal.GRAY)
                              b.full || b.pct >= 100 -> ModuleValue("Pleine", true, Pal.CYAN)
                              b.watts >= 15f -> ModuleValue("Rapide", true, Pal.PURPLE)
                              else -> ModuleValue("Charge", true, Pal.GREEN)
                          }
                      }
                      Kind.CHARGE_TIME -> {
                          val b = batt()
                          var ms = -1L
                          if (Build.VERSION.SDK_INT >= 28) {
                              val bm = app.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                              ms = bm.computeChargeTimeRemaining()
                          }
                          if (b.plugged && ms > 0L) {
                              val min = (ms / 60000L).toInt()
                              val t = if (min >= 60) (min / 60).toString() + "h" + "%02d".format(min % 60) else min.toString() + " min"
                              ModuleValue(t, true, Pal.GREEN)
                          } else ModuleValue("—", false, Pal.GRAY)
                      }
                      Kind.BATT_TEMP -> {
                          val b = batt()
                          val txt = if (opt == 1) "%.0f°F".format(b.tempC * 9f / 5f + 32f) else "%.1f°C".format(b.tempC)
                          val col = if (b.tempC >= 42f) Pal.RED else if (b.tempC >= 38f) Pal.ORANGE else Pal.GREEN
                          ModuleValue(txt, true, col)
                      }
                      Kind.NETWORK -> network(opt == 1)
                      Kind.SIGNAL -> signal(opt)
                      Kind.SPEED -> {
                          val txt = when (opt) {
                              1 -> "↑" + rate(txRate)
                              2 -> "↓" + rate(rxRate) + " ↑" + rate(txRate)
                              else -> "↓" + rate(rxRate)
                          }
                          val on = rxRate + txRate > 1024f
                          ModuleValue(txt, on, if (on) Pal.CYAN else Pal.GRAY)
                      }
                      Kind.NOTIF_COUNT, Kind.NOTIF_ICONS -> {
                          val n = NotifState.items.sumOf { it.count }
                          ModuleValue(n.toString(), n > 0, Pal.PINK)
                      }
                      Kind.WEATHER -> weather(opt)
                      Kind.BLUETOOTH -> {
                          val on = Settings.Global.getInt(app.contentResolver, "bluetooth_on", 0) != 0
                          ModuleValue(if (on) "On" else "Off", on, if (on) Pal.BLUE else Pal.GRAY)
                      }
                      Kind.WIFI_STATE -> {
                          val on = Settings.Global.getInt(app.contentResolver, "wifi_on", 0) != 0
                          ModuleValue(if (on) "On" else "Off", on, if (on) Pal.CYAN else Pal.GRAY)
                      }
                      Kind.AIRPLANE -> {
                          val on = Settings.Global.getInt(app.contentResolver, Settings.Global.AIRPLANE_MODE_ON, 0) != 0
                          ModuleValue("Avion", on, if (on) Pal.ORANGE else Pal.GRAY)
                      }
                      Kind.DND -> {
                          val nm = app.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                          val f = nm.currentInterruptionFilter
                          val on = f != NotificationManager.INTERRUPTION_FILTER_ALL && f != NotificationManager.INTERRUPTION_FILTER_UNKNOWN
                          ModuleValue("NPD", on, if (on) Pal.PURPLE else Pal.GRAY)
                      }
                      Kind.RINGER -> {
                          val am = app.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          when (am.ringerMode) {
                              AudioManager.RINGER_MODE_NORMAL -> ModuleValue("Sonnerie", true, Pal.GREEN, "🔔")
                              AudioManager.RINGER_MODE_VIBRATE -> ModuleValue("Vibreur", true, Pal.ORANGE, "📳")
                              else -> ModuleValue("Silence", true, Pal.RED, "🔕")
                          }
                      }
                      Kind.ALARM -> {
                          val am = app.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                          val info = am.nextAlarmClock
                          if (info == null) ModuleValue("—", false, Pal.GRAY)
                          else {
                              val far = info.triggerTime - System.currentTimeMillis() > 20L * 3600L * 1000L
                              val f = fmts.getOrPut(if (far) "EEE HH:mm" else "HH:mm") {
                                  SimpleDateFormat(if (far) "EEE HH:mm" else "HH:mm", Locale.getDefault())
                              }
                              ModuleValue(f.format(Date(info.triggerTime)), true, Pal.YELLOW)
                          }
                      }
                      Kind.TORCH -> ModuleValue("On", torchOn, if (torchOn) Pal.YELLOW else Pal.GRAY)
                      Kind.VOLUME -> {
                          val am = app.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          val st = arrayOf(AudioManager.STREAM_MUSIC, AudioManager.STREAM_RING, AudioManager.STREAM_VOICE_CALL, AudioManager.STREAM_ALARM)[opt.coerceIn(0, 3)]
                          val mx = am.getStreamMaxVolume(st).coerceAtLeast(1)
                          val p = am.getStreamVolume(st) * 100 / mx
                          ModuleValue("$p%", true, Pal.CYAN, if (p == 0) "🔇" else null)
                      }
                      Kind.BRIGHTNESS -> {
                          val v = Settings.System.getInt(app.contentResolver, Settings.System.SCREEN_BRIGHTNESS, 128) * 100 / 255
                          ModuleValue("$v%", true, Pal.YELLOW)
                      }
                      Kind.STORAGE -> {
                          val sf = StatFs(Environment.getDataDirectory().path)
                          val total = sf.totalBytes.toFloat()
                          val free = sf.availableBytes.toFloat()
                          if (opt == 1) {
                              val used = ((total - free) * 100f / total).roundToInt()
                              ModuleValue("$used%", true, if (used > 90) Pal.RED else Pal.CYAN)
                          } else ModuleValue("%.0f Go".format(free / 1073741824f), true, Pal.CYAN)
                      }
                      Kind.RAM -> {
                          val am = app.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                          val mi = ActivityManager.MemoryInfo()
                          am.getMemoryInfo(mi)
                          if (opt == 1) ModuleValue("%.1f Go".format(mi.availMem / 1073741824f), true, Pal.CYAN)
                          else {
                              val used = ((mi.totalMem - mi.availMem) * 100f / mi.totalMem).roundToInt()
                              ModuleValue("$used%", true, if (used > 90) Pal.RED else Pal.CYAN)
                          }
                      }
                      Kind.UPTIME -> {
                          val mins = (SystemClock.elapsedRealtime() / 60000L).toInt()
                          val t = if (mins >= 1440) (mins / 1440).toString() + "j" + (mins % 1440 / 60).toString() + "h"
                          else (mins / 60).toString() + "h" + "%02d".format(mins % 60)
                          ModuleValue(t, true, Pal.PURPLE)
                      }
                      Kind.MEDIA -> media(opt)
                      Kind.LOCATION -> {
                          val lm = app.getSystemService(Context.LOCATION_SERVICE) as LocationManager
                          val on = if (Build.VERSION.SDK_INT >= 28) lm.isLocationEnabled else true
                          ModuleValue(if (on) "GPS" else "Off", on, if (on) Pal.GREEN else Pal.GRAY)
                      }
                      Kind.CUSTOM -> ModuleValue(m.text, true, Pal.WHITE)
                      Kind.SPACER -> ModuleValue("", true, Pal.WHITE)
                  }
              }

              private fun rate(b: Float): String = when {
                  b >= 1048576f -> "%.1fM".format(b / 1048576f)
                  b >= 1024f -> "%.0fK".format(b / 1024f)
                  else -> "%.0fB".format(b)
              }

              private fun network(simple: Boolean): ModuleValue {
                  val cm = app.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val net = cm.activeNetwork ?: return ModuleValue("Hors ligne", false, Pal.RED, "📵", true)
                  val caps = cm.getNetworkCapabilities(net) ?: return ModuleValue("Hors ligne", false, Pal.RED, "📵", true)
                  return when {
                      caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) -> ModuleValue("Wi‑Fi", true, Pal.CYAN, "📶")
                      caps.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) -> {
                          val g = if (simple) "Mobile" else cellGen()
                          val col = when (g) {
                              "5G" -> Pal.GREEN
                              "4G", "4G+" -> Pal.LIME
                              "3G" -> Pal.ORANGE
                              "2G" -> Pal.RED
                              else -> Pal.CYAN
                          }
                          ModuleValue(g, true, col, "📶")
                      }
                      caps.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET) -> ModuleValue("Ethernet", true, Pal.GREEN, "🔌")
                      caps.hasTransport(NetworkCapabilities.TRANSPORT_BLUETOOTH) -> ModuleValue("Bluetooth", true, Pal.BLUE, "🔵")
                      else -> ModuleValue("Réseau", true, Pal.WHITE, "📶")
                  }
              }

              private fun cellGen(): String {
                  return try {
                      val tm = app.getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
                      when (tm.dataNetworkType) {
                          20 -> "5G"
                          13 -> "4G"
                          19 -> "4G+"
                          15, 10, 8, 9, 3 -> "3G"
                          1, 2, 4, 7, 11 -> "2G"
                          else -> "Mobile"
                      }
                  } catch (e: Exception) {
                      "Mobile"
                  }
              }

              private fun signal(opt: Int): ModuleValue {
                  if (Build.VERSION.SDK_INT < 28) return ModuleValue("?", false, Pal.GRAY)
                  val tm = app.getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
                  val lvl = tm.signalStrength?.level ?: 0
                  val txt = if (opt == 1) "$lvl/4" else bars(lvl, 4)
                  val col = when (lvl) {
                      0 -> Pal.RED
                      1 -> Pal.ORANGE
                      2 -> Pal.YELLOW
                      3 -> Pal.LIME
                      else -> Pal.GREEN
                  }
                  return ModuleValue(txt, true, col, "📡", lvl == 0)
              }

              private fun weather(opt: Int): ModuleValue {
                  val w = Weather.data ?: return ModuleValue("--", true, Pal.GRAY, "🌡️")
                  val hour = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                  val night = hour < 7 || hour >= 21
                  val ic = Weather.emoji(w.code, night)
                  val col = when {
                      w.temp < 0f -> Pal.CYAN
                      w.temp < 12f -> Pal.BLUE
                      w.temp < 22f -> Pal.GREEN
                      w.temp < 30f -> Pal.ORANGE
                      else -> Pal.RED
                  }
                  val txt = when (opt) {
                      1 -> (w.temp * 9f / 5f + 32f).roundToInt().toString() + "°F"
                      2 -> w.wind.roundToInt().toString() + " km/h"
                      3 -> w.hum.toString() + "%"
                      4 -> Weather.label(w.code)
                      else -> w.temp.roundToInt().toString() + "°"
                  }
                  return ModuleValue(txt, true, col, ic)
              }

              private fun media(opt: Int): ModuleValue {
                  return try {
                      val msm = app.getSystemService(Context.MEDIA_SESSION_SERVICE) as MediaSessionManager
                      val list = msm.getActiveSessions(ComponentName(app, NotifListener::class.java))
                      val c = list.firstOrNull { it.playbackState?.state == PlaybackState.STATE_PLAYING }
                      if (c == null) ModuleValue("", false, Pal.GRAY)
                      else {
                          val md = c.metadata
                          val title = md?.getString(MediaMetadata.METADATA_KEY_TITLE) ?: ""
                          val artist = md?.getString(MediaMetadata.METADATA_KEY_ARTIST) ?: ""
                          var t = when (opt) {
                              1 -> artist
                              2 -> if (artist.isEmpty()) title else artist + " – " + title
                              else -> title
                          }
                          if (t.length > 22) t = t.substring(0, 21) + "…"
                          ModuleValue(t, t.isNotEmpty(), Pal.PURPLE)
                      }
                  } catch (e: Exception) {
                      ModuleValue("", false, Pal.GRAY)
                  }
              }
          }
