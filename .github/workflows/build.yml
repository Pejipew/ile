          package com.example.island

          import android.animation.Animator
          import android.animation.AnimatorListenerAdapter
          import android.animation.ValueAnimator
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.view.animation.DecelerateInterpolator
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.core.graphics.ColorUtils
          import kotlin.math.abs
          import kotlin.math.max

          /**
           * Encoche qui affiche les notifications sous forme d'icônes d'applis.
           * Deux fenêtres : la forme (qui ne reçoit pas les touches quand elle est repliée)
           * et une zone de glissement, réglable, qui passe par-dessus le tiroir d'origine.
           */
          class NotifIsland(private val ctx: Context, private val windowType: Int) {

              private val wm = ctx.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private val prefs = Prefs(ctx)
              private val handler = Handler(Looper.getMainLooper())
              private val bg = IslandDrawable()
              private val icons = HashMap<String, Drawable>()
              private val density = ctx.resources.displayMetrics.density

              private var root: FrameLayout? = null
              private var content: LinearLayout? = null
              private var lp: WindowManager.LayoutParams? = null
              private var zone: View? = null
              private var zoneLp: WindowManager.LayoutParams? = null

              private var expanded = false
              private var animating = false
              private var downY = 0f
              private var swiped = false

              private val autoCollapse = Runnable { if (expanded) setExpanded(false) }

              private fun threshold() = 24f * density
              private fun screenW() = ctx.resources.displayMetrics.widthPixels
              private fun curW() = if (expanded) minOf(prefs.ntExpWidth, screenW()) else prefs.ntWidth
              private fun curH() = if (expanded) prefs.ntExpHeight else prefs.ntHeight
              private fun curX() = if (expanded) prefs.ntExpX else prefs.ntX

              private fun textColor(): Int =
                  if (ColorUtils.calculateLuminance(prefs.ntBg) > 0.6) Color.BLACK else Color.WHITE

              private fun newParams(w: Int, h: Int, touchable: Boolean): WindowManager.LayoutParams {
                  var flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  if (!touchable) flags = flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  return WindowManager.LayoutParams(w, h, windowType, flags, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      if (Build.VERSION.SDK_INT >= 30) {
                          layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                      } else if (Build.VERSION.SDK_INT >= 28) {
                          layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                  }
              }

              // ---------- Cycle de vie ----------

              fun start() {
                  stop()

                  val r = FrameLayout(ctx).apply { background = bg }
                  val c = LinearLayout(ctx).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                  }
                  r.addView(
                      c,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )
                  r.setOnTouchListener { _, e -> onPanelTouch(e) }
                  val p = newParams(prefs.ntWidth, prefs.ntHeight, false)
                  wm.addView(r, p)
                  root = r
                  content = c
                  lp = p

                  val z = View(ctx)
                  z.setOnTouchListener { _, e -> onZoneTouch(e) }
                  val zp = newParams(prefs.zoneWidth, prefs.zoneHeight, true)
                  wm.addView(z, zp)
                  zone = z
                  zoneLp = zp

                  applyLive()
              }

              fun stop() {
                  handler.removeCallbacksAndMessages(null)
                  root?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  zone?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  root = null
                  content = null
                  zone = null
                  expanded = false
                  animating = false
              }

              fun refresh() = applyLive()

              /** Relit tous les réglages (en pixels) et met les fenêtres à jour immédiatement */
              fun applyLive() {
                  val v = root ?: return
                  val p = lp ?: return
                  val z = zone ?: return
                  val zp = zoneLp ?: return

                  bg.set(prefs.ntFlare.toFloat(), prefs.ntRadius.toFloat(), prefs.ntBg)
                  if (!animating) {
                      p.width = curW()
                      p.height = curH()
                      p.x = curX()
                      p.y = 0
                  }
                  updatePadding()

                  v.visibility = when {
                      !prefs.ntEnabled -> View.INVISIBLE
                      !expanded && prefs.ntHideEmpty && visibleItems().isEmpty() -> View.INVISIBLE
                      else -> View.VISIBLE
                  }

                  zp.width = prefs.zoneWidth
                  zp.height = prefs.zoneHeight
                  zp.x = prefs.zoneX
                  zp.y = prefs.zoneY
                  zp.flags = if (prefs.ntEnabled) {
                      zp.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
                  } else {
                      zp.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  }
                  z.setBackgroundColor(
                      if (prefs.zoneAlways || NotifState.zoneHint) 0x6600E5FF else Color.TRANSPARENT
                  )

                  try { wm.updateViewLayout(v, p) } catch (_: Exception) {}
                  try { wm.updateViewLayout(z, zp) } catch (_: Exception) {}
                  render()
              }

              private fun updatePadding() {
                  val w = curW()
                  val h = curH()
                  val f = minOf(prefs.ntFlare, w / 4, h / 2).coerceAtLeast(0)
                  val pad = f + (4 * density).toInt()
                  root?.setPadding(pad, 0, pad, 0)
              }

              // ---------- Geste : glisser vers le bas pour déployer ----------

              private fun onZoneTouch(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          downY = e.rawY
                          swiped = false
                      }
                      MotionEvent.ACTION_MOVE -> if (!swiped) {
                          val dy = e.rawY - downY
                          if (dy > threshold()) {
                              swiped = true
                              setExpanded(true)
                          } else if (dy < -threshold()) {
                              swiped = true
                              setExpanded(false)
                          }
                      }
                      MotionEvent.ACTION_UP -> {
                          if (!swiped && abs(e.rawY - downY) < threshold() / 2 && expanded) {
                              setExpanded(false)
                          }
                      }
                  }
                  return true
              }

              /** Touche sur le panneau déployé : un appui ou un glissement vers le haut le replie */
              private fun onPanelTouch(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          downY = e.rawY
                          swiped = false
                      }
                      MotionEvent.ACTION_MOVE -> if (!swiped && downY - e.rawY > threshold()) {
                          swiped = true
                          setExpanded(false)
                      }
                      MotionEvent.ACTION_UP -> {
                          if (!swiped && abs(e.rawY - downY) < threshold() / 2) setExpanded(false)
                      }
                  }
                  return true
              }

              private fun setExpanded(value: Boolean) {
                  val v = root ?: return
                  val p = lp ?: return
                  if (animating || expanded == value) return
                  expanded = value

                  handler.removeCallbacks(autoCollapse)
                  if (value && prefs.ntAutoCollapse > 0) {
                      handler.postDelayed(autoCollapse, prefs.ntAutoCollapse * 1000L)
                  }

                  // Replié : la forme laisse passer les touches. Déployé : elle les reçoit.
                  p.flags = if (value) {
                      p.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
                  } else {
                      p.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  }

                  val w0 = p.width
                  val h0 = p.height
                  val x0 = p.x
                  val w1 = curW()
                  val h1 = curH()
                  val x1 = curX()
                  v.visibility = View.VISIBLE
                  updatePadding()
                  render()

                  animating = true
                  ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = 260
                      interpolator = DecelerateInterpolator()
                      addUpdateListener {
                          val f = it.animatedValue as Float
                          p.width = (w0 + (w1 - w0) * f).toInt().coerceAtLeast(1)
                          p.height = (h0 + (h1 - h0) * f).toInt().coerceAtLeast(1)
                          p.x = (x0 + (x1 - x0) * f).toInt()
                          try { wm.updateViewLayout(v, p) } catch (_: Exception) {}
                      }
                      addListener(object : AnimatorListenerAdapter() {
                          override fun onAnimationEnd(animation: Animator) {
                              animating = false
                              applyLive()
                          }
                      })
                      start()
                  }
              }

              // ---------- Contenu : priorité, blocage, icônes ----------

              /** Applis notifiées, sans les bloquées, prioritaires d'abord, puis les plus récentes */
              private fun visibleItems(): List<NotifItem> {
                  val blocked = prefs.blockedPackages
                  val prio = prefs.prioOrder()
                  return NotifState.items
                      .filter { it.pkg !in blocked }
                      .sortedWith(
                          compareBy<NotifItem> {
                              val i = prio.indexOf(it.pkg)
                              if (i < 0) Int.MAX_VALUE else i
                          }.thenByDescending { it.time }
                      )
              }

              private fun icon(pkg: String): Drawable {
                  val base = icons.getOrPut(pkg) {
                      try {
                          ctx.packageManager.getApplicationIcon(pkg)
                      } catch (_: Exception) {
                          ctx.getDrawable(android.R.drawable.sym_def_app_icon)!!
                      }
                  }
                  return base.constantState?.newDrawable()?.mutate() ?: base
              }

              private fun iconView(item: NotifItem, size: Int, badge: Boolean): View {
                  val fl = FrameLayout(ctx)
                  val iv = ImageView(ctx)
                  iv.setImageDrawable(icon(item.pkg))
                  iv.scaleType = ImageView.ScaleType.FIT_CENTER
                  fl.addView(iv, FrameLayout.LayoutParams(size, size))

                  if (badge && prefs.ntShowBadge && item.count > 1) {
                      val b = TextView(ctx)
                      b.text = item.count.toString()
                      b.textSize = 9f
                      b.setTextColor(Color.WHITE)
                      b.setTypeface(Typeface.DEFAULT_BOLD)
                      b.gravity = Gravity.CENTER
                      val pad = (3 * density).toInt()
                      b.setPadding(pad, 0, pad, 0)
                      b.background = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          cornerRadius = 20f * density
                          setColor(Color.RED)
                      }
                      fl.addView(
                          b,
                          FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              Gravity.END or Gravity.BOTTOM
                          )
                      )
                  }
                  if (expanded) fl.setOnClickListener { openItem(item) }
                  return fl
              }

              private fun openItem(item: NotifItem) {
                  setExpanded(false)
                  try {
                      val pi = item.intent
                      if (pi != null) {
                          pi.send()
                      } else {
                          ctx.packageManager.getLaunchIntentForPackage(item.pkg)?.let {
                              it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              ctx.startActivity(it)
                          }
                      }
                  } catch (_: Exception) {
                  }
              }

              private fun render() {
                  val c = content ?: return
                  c.removeAllViews()
                  val items = visibleItems()
                  val gap = prefs.ntIconGap
                  val wrap = ViewGroup.LayoutParams.WRAP_CONTENT

                  if (!expanded) {
                      val size = prefs.ntIconSize
                      val shown = items.take(prefs.ntMaxIcons)
                      val row = LinearLayout(ctx).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER
                      }
                      shown.forEachIndexed { i, item ->
                          row.addView(
                              iconView(item, size, false),
                              LinearLayout.LayoutParams(size, size).apply { if (i > 0) marginStart = gap }
                          )
                      }
                      val extra = items.size - shown.size
                      if (extra > 0) {
                          row.addView(
                              TextView(ctx).apply {
                                  text = "+$extra"
                                  setTextColor(textColor())
                                  textSize = 10f
                                  setTypeface(Typeface.DEFAULT_BOLD)
                              },
                              LinearLayout.LayoutParams(wrap, wrap).apply { marginStart = gap }
                          )
                      }
                      c.addView(row)
                      return
                  }

                  if (items.isEmpty()) {
                      c.addView(TextView(ctx).apply {
                          text = "Aucune notification"
                          setTextColor(textColor())
                          textSize = 13f
                      })
                      return
                  }

                  val size = prefs.ntExpIconSize
                  val w = curW()
                  val h = curH()
                  val f = minOf(prefs.ntFlare, w / 4, h / 2).coerceAtLeast(0)
                  val avail = w - 2 * (f + (4 * density).toInt())
                  val perRow = max(1, (avail + gap) / (size + gap))
                  items.chunked(perRow).forEach { chunk ->
                      val row = LinearLayout(ctx).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER
                      }
                      chunk.forEachIndexed { i, item ->
                          row.addView(
                              iconView(item, size, true),
                              LinearLayout.LayoutParams(size, size).apply { if (i > 0) marginStart = gap }
                          )
                      }
                      c.addView(row, LinearLayout.LayoutParams(wrap, wrap).apply { topMargin = gap })
                  }
              }
          }
          KOTLIN_EOF
          mkdir -p app/src/main/java/com/example/island
          cat > app/src/main/java/com/example/island/NotifListener.kt <<'KOTLIN_EOF'
          package com.example.island

          import android.app.Notification
          import android.content.ComponentName
          import android.os.Build
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class NotifListener : NotificationListenerService() {

              companion object {
                  @Volatile
                  var instance: NotifListener? = null
              }

              override fun onListenerConnected() {
                  instance = this
                  recompute()
              }

              override fun onListenerDisconnected() {
                  instance = null
                  NotifState.update(emptyList())
                  if (Build.VERSION.SDK_INT >= 24) {
                      try {
                          requestRebind(ComponentName(this, NotifListener::class.java))
                      } catch (_: Exception) {
                      }
                  }
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  if (sbn != null && sbn.packageName != packageName && !sbn.isOngoing) {
                      Prefs(this).markSeen(sbn.packageName)
                  }
                  recompute()
              }

              override fun onNotificationRemoved(sbn: StatusBarNotification?) {
                  recompute()
              }

              /** Regroupe les notifications en cours par appli */
              fun recompute() {
                  val active = try {
                      activeNotifications
                  } catch (_: Exception) {
                      null
                  } ?: return

                  val groups = LinkedHashMap<String, MutableList<StatusBarNotification>>()
                  active.filter {
                      it.packageName != packageName &&
                          !it.isOngoing &&
                          (it.notification.flags and Notification.FLAG_GROUP_SUMMARY) == 0
                  }.forEach {
                      groups.getOrPut(it.packageName) { mutableListOf() }.add(it)
                  }

                  val items = groups.map { (pkg, list) ->
                      val latest = list.maxByOrNull { it.postTime }!!
                      NotifItem(pkg, list.size, latest.postTime, latest.notification.contentIntent)
                  }
                  NotifState.update(items)
              }
          }
          KOTLIN_EOF
          mkdir -p app/src/main/java/com/example/island
          cat > app/src/main/java/com/example/island/NotifState.kt <<'KOTLIN_EOF'
          package com.example.island

          import android.app.PendingIntent
          import android.os.Handler
          import android.os.Looper

          /** Une appli qui a au moins une notification en cours */
          data class NotifItem(
              val pkg: String,
              val count: Int,
              val time: Long,
              val intent: PendingIntent?
          )

          /** Pont entre l'écoute des notifications et l'encoche à icônes */
          object NotifState {
              @Volatile
              var items: List<NotifItem> = emptyList()

              /** Vrai pendant que l'appli de réglage est ouverte : la zone de glissement devient visible */
              @Volatile
              var zoneHint: Boolean = false

              var onChange: (() -> Unit)? = null
              private val main = Handler(Looper.getMainLooper())

              fun update(list: List<NotifItem>) {
                  items = list
                  main.post { onChange?.invoke() }
              }
          }
          KOTLIN_EOF
          mkdir -p app/src/main/java/com/example/island
          cat > app/src/main/java/com/example/island/Prefs.kt <<'KOTLIN_EOF'
          package com.example.island

          import android.content.Context
          import android.graphics.Color

          class Prefs(context: Context) {
              private val sp = context.getSharedPreferences("island", Context.MODE_PRIVATE)
              private val density = context.resources.displayMetrics.density

              /** Valeur par défaut en pixels, à partir d'une taille de départ en dp */
              private fun px(dp: Int) = (dp * density).toInt()

              private fun putB(k: String, v: Boolean) = sp.edit().putBoolean(k, v).apply()
              private fun putI(k: String, v: Int) = sp.edit().putInt(k, v).apply()

              companion object {
                  val DEFAULT_SIGNAL = intArrayOf(
                      Color.parseColor("#FF3B30"),
                      Color.parseColor("#FF9500"),
                      Color.parseColor("#FFFF00"),
                      Color.parseColor("#00FF00"),
                      Color.parseColor("#007AFF")
                  )
              }

              // ----- Encoche : toutes les tailles en pixels -----
              var width: Int
                  get() = sp.getInt("widthPx", px(44))
                  set(v) = putI("widthPx", v)
              var height: Int
                  get() = sp.getInt("heightPx", px(22))
                  set(v) = putI("heightPx", v)
              /** Évasement des coins du haut (raccord concave avec le bord de l'écran) */
              var flare: Int
                  get() = sp.getInt("flarePx", px(30))
                  set(v) = putI("flarePx", v)
              /** Arrondi des coins du bas */
              var bottomRadius: Int
                  get() = sp.getInt("bottomRadiusPx", px(60))
                  set(v) = putI("bottomRadiusPx", v)
              var xOffset: Int
                  get() = sp.getInt("xOffsetPx", px(70))
                  set(v) = putI("xOffsetPx", v)
              var bgColor: Int
                  get() = sp.getInt("bgColor", Color.BLACK)
                  set(v) = putI("bgColor", v)

              // ----- LED -----
              var ledEnabled: Boolean
                  get() = sp.getBoolean("ledEnabled", true)
                  set(v) = putB("ledEnabled", v)
              var ledWidth: Int
                  get() = sp.getInt("ledWidthPx", px(10))
                  set(v) = putI("ledWidthPx", v)
              var ledHeight: Int
                  get() = sp.getInt("ledHeightPx", px(10))
                  set(v) = putI("ledHeightPx", v)
              /** Arrondi de la LED (grand = ronde) */
              var ledRadius: Int
                  get() = sp.getInt("ledRadiusPx", px(30))
                  set(v) = putI("ledRadiusPx", v)
              /** Décalage de la LED par rapport au centre de la forme */
              var ledX: Int
                  get() = sp.getInt("ledXPx", 0)
                  set(v) = putI("ledXPx", v)
              var ledY: Int
                  get() = sp.getInt("ledYPx", 0)
                  set(v) = putI("ledYPx", v)

              fun signalColor(level: Int): Int =
                  sp.getInt("sig$level", DEFAULT_SIGNAL[level.coerceIn(0, 4)])

              fun setSignalColor(level: Int, c: Int) = putI("sig$level", c)

              /** Vrai une fois que la demande d'autorisation Téléphone a été affichée au moins une fois */
              var askedPhone: Boolean
                  get() = sp.getBoolean("askedPhone", false)
                  set(v) = putB("askedPhone", v)

              // ----- Encoche notifications (icônes d'applis) -----
              var ntEnabled: Boolean
                  get() = sp.getBoolean("ntEnabled", true)
                  set(v) = putB("ntEnabled", v)
              var ntWidth: Int
                  get() = sp.getInt("ntWidthPx", px(130))
                  set(v) = putI("ntWidthPx", v)
              var ntHeight: Int
                  get() = sp.getInt("ntHeightPx", px(26))
                  set(v) = putI("ntHeightPx", v)
              var ntFlare: Int
                  get() = sp.getInt("ntFlarePx", px(12))
                  set(v) = putI("ntFlarePx", v)
              var ntRadius: Int
                  get() = sp.getInt("ntRadiusPx", px(14))
                  set(v) = putI("ntRadiusPx", v)
              var ntX: Int
                  get() = sp.getInt("ntXPx", px(-85))
                  set(v) = putI("ntXPx", v)
              var ntBg: Int
                  get() = sp.getInt("ntBg", Color.BLACK)
                  set(v) = putI("ntBg", v)
              var ntHideEmpty: Boolean
                  get() = sp.getBoolean("ntHideEmpty", false)
                  set(v) = putB("ntHideEmpty", v)

              /** Nombre d'icônes affichées quand l'encoche est repliée */
              var ntMaxIcons: Int
                  get() = sp.getInt("ntMaxIcons", 4)
                  set(v) = putI("ntMaxIcons", v)
              var ntIconSize: Int
                  get() = sp.getInt("ntIconSizePx", px(16))
                  set(v) = putI("ntIconSizePx", v)
              var ntIconGap: Int
                  get() = sp.getInt("ntIconGapPx", px(4))
                  set(v) = putI("ntIconGapPx", v)
              var ntShowBadge: Boolean
                  get() = sp.getBoolean("ntShowBadge", true)
                  set(v) = putB("ntShowBadge", v)

              // Panneau déployé
              var ntExpWidth: Int
                  get() = sp.getInt("ntExpWidthPx", px(300))
                  set(v) = putI("ntExpWidthPx", v)
              var ntExpHeight: Int
                  get() = sp.getInt("ntExpHeightPx", px(140))
                  set(v) = putI("ntExpHeightPx", v)
              var ntExpX: Int
                  get() = sp.getInt("ntExpXPx", 0)
                  set(v) = putI("ntExpXPx", v)
              var ntExpIconSize: Int
                  get() = sp.getInt("ntExpIconSizePx", px(30))
                  set(v) = putI("ntExpIconSizePx", v)
              /** Secondes avant le repli automatique (0 = jamais) */
              var ntAutoCollapse: Int
                  get() = sp.getInt("ntAutoCollapse", 8)
                  set(v) = putI("ntAutoCollapse", v)

              // Zone de glissement (là où on touche pour déployer)
              var zoneWidth: Int
                  get() = sp.getInt("zoneWidthPx", px(130))
                  set(v) = putI("zoneWidthPx", v)
              var zoneHeight: Int
                  get() = sp.getInt("zoneHeightPx", px(40))
                  set(v) = putI("zoneHeightPx", v)
              var zoneX: Int
                  get() = sp.getInt("zoneXPx", px(-85))
                  set(v) = putI("zoneXPx", v)
              var zoneY: Int
                  get() = sp.getInt("zoneYPx", 0)
                  set(v) = putI("zoneYPx", v)
              var zoneAlways: Boolean
                  get() = sp.getBoolean("zoneAlways", false)
                  set(v) = putB("zoneAlways", v)

              // ----- Applis : vues, bloquées, ordre de priorité -----
              var seenPackages: Set<String>
                  get() = sp.getStringSet("seen", emptySet()) ?: emptySet()
                  set(v) {
                      sp.edit().putStringSet("seen", HashSet(v)).apply()
                  }

              var blockedPackages: Set<String>
                  get() = sp.getStringSet("blocked", emptySet()) ?: emptySet()
                  set(v) {
                      sp.edit().putStringSet("blocked", HashSet(v)).apply()
                  }

              private var prioRaw: String
                  get() = sp.getString("prio", "") ?: ""
                  set(v) {
                      sp.edit().putString("prio", v).apply()
                  }

              /** Applis prioritaires, de la plus importante à la moins importante */
              fun prioOrder(): List<String> =
                  prioRaw.lines().map { it.trim() }.filter { it.isNotEmpty() }

              private fun savePrio(l: List<String>) {
                  prioRaw = l.joinToString("\n")
              }

              fun markSeen(pkg: String) {
                  val s = HashSet(seenPackages)
                  if (s.add(pkg)) seenPackages = s
              }

              fun prioritize(pkg: String) {
                  unblock(pkg)
                  markSeen(pkg)
                  val l = prioOrder()
                  if (pkg !in l) savePrio(l + pkg)
              }

              fun unprioritize(pkg: String) {
                  savePrio(prioOrder() - pkg)
              }

              fun moveUp(pkg: String) {
                  val l = prioOrder().toMutableList()
                  val i = l.indexOf(pkg)
                  if (i > 0) {
                      l.removeAt(i)
                      l.add(i - 1, pkg)
                      savePrio(l)
                  }
              }

              fun moveDown(pkg: String) {
                  val l = prioOrder().toMutableList()
                  val i = l.indexOf(pkg)
                  if (i >= 0 && i < l.size - 1) {
                      l.removeAt(i)
                      l.add(i + 1, pkg)
                      savePrio(l)
                  }
              }

              fun block(pkg: String) {
                  unprioritize(pkg)
                  markSeen(pkg)
                  blockedPackages = HashSet(blockedPackages).apply { add(pkg) }
              }

              fun unblock(pkg: String) {
                  if (blockedPackages.contains(pkg)) {
                      blockedPackages = HashSet(blockedPackages).apply { remove(pkg) }
                  }
              }
          }
