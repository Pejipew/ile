          package com.example.island

          import android.app.ActivityManager
          import android.app.AlarmManager
          import android.app.NotificationManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.drawable.Drawable
          import android.hardware.camera2.CameraManager
          import android.location.LocationManager
          import android.media.AudioManager
          import android.media.Ringtone
          import android.media.RingtoneManager
          import android.media.MediaMetadata
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.TrafficStats
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.os.StatFs
          import android.os.SystemClock
          import android.provider.Settings
          import android.telephony.CellSignalStrengthLte
          import android.telephony.CellSignalStrengthNr
          import android.telephony.PhoneStateListener
          import android.telephony.TelephonyCallback
          import android.telephony.TelephonyDisplayInfo
          import android.telephony.TelephonyManager
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale
          import kotlin.math.abs
          import kotlin.math.roundToInt

          class BattInfo(
              val pct: Int,
              val plugged: Boolean,
              val full: Boolean,
              val tempC: Float,
              val mv: Int,
              val ma: Float,
              val watts: Float
          )

          /** Photo de l'état du téléphone, pour repérer ce qui change (branchement, réseau, notifications…) */
          class EvSnap(
              val plugged: Boolean,
              val pct: Int,
              val full: Boolean,
              val gen: String,
              val wifi: Boolean,
              val airplane: Boolean,
              val dnd: Boolean,
              val ringer: Int,
              val notif: Int
          )

          /** Lit en direct toutes les infos du téléphone et les transforme en ModuleValue */
          class StatusEngine(ctx: Context, private val onUpdate: () -> Unit) {
              private val app: Context = ctx.applicationContext
              private val handler = Handler(Looper.getMainLooper())

              @Volatile
              var fast = false
              private var running = false
              var torchOn = false
                  private set
              private var torchCb: CameraManager.TorchCallback? = null

              @Volatile
              private var ovrType = 0
              private var dispCb: Any? = null
              private var dispListener: Any? = null

              private var lastRx = 0L
              private var lastTx = 0L
              private var lastT = 0L
              private var rxRate = 0f
              private var txRate = 0f

              private val fmts = HashMap<String, SimpleDateFormat>()
              private val icons = HashMap<String, Drawable?>()

              private val tick = object : Runnable {
                  override fun run() {
                      if (!running) return
                      sampleSpeed()
                      watch5g()
                      Weather.maybeRefresh(app) { onUpdate() }
                      onUpdate()
                      handler.postDelayed(this, if (fast) 500L else 1000L)
                  }
              }

              fun start() {
                  if (running) return
                  running = true
                  registerTorch()
                  registerDisplay()
                  handler.post(tick)
              }

              fun stop() {
                  running = false
                  handler.removeCallbacks(tick)
                  unregisterTorch()
                  unregisterDisplay()
                  lastT = 0L
              }

              private fun hasPhonePerm(): Boolean =
                  app.checkSelfPermission(android.Manifest.permission.READ_PHONE_STATE) ==
                      android.content.pm.PackageManager.PERMISSION_GRANTED

              /** Écoute les changements d'affichage réseau (4G+, 5G NSA...) comme la barre système */
              @Suppress("DEPRECATION")
              private fun registerDisplay() {
                  if (Build.VERSION.SDK_INT < 30 || dispCb != null || dispListener != null) return
                  if (!hasPhonePerm()) return
                  try {
                      val tm = app.getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
                      if (Build.VERSION.SDK_INT >= 31) {
                          val cb = DisplayCb { t ->
                              ovrType = t
                              onUpdate()
                          }
                          tm.registerTelephonyCallback(app.mainExecutor, cb)
                          dispCb = cb
                      } else {
                          val l = DisplayLegacy { t ->
                              ovrType = t
                              onUpdate()
                          }
                          tm.listen(l, PhoneStateListener.LISTEN_DISPLAY_INFO_CHANGED)
                          dispListener = l
                      }
                  } catch (e: Exception) {
                  }
              }

              @Suppress("DEPRECATION")
              private fun unregisterDisplay() {
                  try {
                      val tm = app.getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
                      if (Build.VERSION.SDK_INT >= 31) {
                          (dispCb as? TelephonyCallback)?.let { tm.unregisterTelephonyCallback(it) }
                      } else if (Build.VERSION.SDK_INT >= 30) {
                          (dispListener as? PhoneStateListener)?.let { tm.listen(it, PhoneStateListener.LISTEN_NONE) }
                      }
                  } catch (e: Exception) {
                  }
                  dispCb = null
                  dispListener = null
                  ovrType = 0
              }

              @androidx.annotation.RequiresApi(31)
              private class DisplayCb(val f: (Int) -> Unit) : TelephonyCallback(), TelephonyCallback.DisplayInfoListener {
                  override fun onDisplayInfoChanged(telephonyDisplayInfo: TelephonyDisplayInfo) {
                      f(telephonyDisplayInfo.overrideNetworkType)
                  }
              }

              @Suppress("DEPRECATION")
              @androidx.annotation.RequiresApi(30)
              private class DisplayLegacy(val f: (Int) -> Unit) : PhoneStateListener() {
                  override fun onDisplayInfoChanged(telephonyDisplayInfo: TelephonyDisplayInfo) {
                      f(telephonyDisplayInfo.overrideNetworkType)
                  }
              }

              private var last5g: Boolean? = null
              private var lastSoundAt = 0L
              private var ringRef: Ringtone? = null

              /** Joue un son quand le téléphone passe de la 4G à la vraie 5G (connectée) */
              private fun watch5g() {
                  val gen = cellGen()
                  val now = gen.startsWith("5G")
                  val prev = last5g
                  last5g = now
                  if (Store.cfg.hist5g) {
                      if (prev == null && now) {
                          Hist5g.add(app, true, "déjà active au démarrage")
                      } else if (prev != null && prev != now) {
                          Hist5g.add(app, now, if (now) "" else gen)
                      }
                  }
                  if (!Store.cfg.sound5g) return
                  if (prev == false && now) {
                      val t = System.currentTimeMillis()
                      if (t - lastSoundAt > 20000L) {
                          lastSoundAt = t
                          try {
                              val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                              val r = RingtoneManager.getRingtone(app, uri)
                              ringRef = r
                              r.play()
                          } catch (e: Exception) {
                          }
                      }
                  }
              }

              private fun registerTorch() {
                  if (torchCb != null) return
                  try {
                      val cm = app.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      val cb = object : CameraManager.TorchCallback() {
                          override fun onTorchModeChanged(cameraId: String, enabled: Boolean) {
                              torchOn = enabled
                              onUpdate()
                          }

                          override fun onTorchModeUnavailable(cameraId: String) {}
                      }
                      cm.registerTorchCallback(cb, handler)
                      torchCb = cb
                  } catch (e: Exception) {
                  }
              }

              private fun unregisterTorch() {
                  val cb = torchCb ?: return
                  try {
                      val cm = app.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      cm.unregisterTorchCallback(cb)
                  } catch (e: Exception) {
                  }
                  torchCb = null
              }

              private fun sampleSpeed() {
                  val now = SystemClock.elapsedRealtime()
                  val rx = TrafficStats.getTotalRxBytes()
                  val tx = TrafficStats.getTotalTxBytes()
                  if (lastT == 0L) {
                      lastRx = rx
                      lastTx = tx
                      lastT = now
                      return
                  }
                  if (now - lastT >= 400L) {
                      val dt = (now - lastT) / 1000f
                      rxRate = max0((rx - lastRx) / dt)
                      txRate = max0((tx - lastTx) / dt)
                      lastRx = rx
                      lastTx = tx
                      lastT = now
                  }
              }

              private fun max0(v: Float): Float = if (v < 0f) 0f else v

              // ---------- accès utiles pour le dessin ----------

              fun notifItems(): List<NotifItem> = NotifState.items.sortedByDescending { it.time }

              fun appIcon(pkg: String): Drawable? {
                  if (icons.containsKey(pkg)) return icons[pkg]
                  val dr = try {
                      app.packageManager.getApplicationIcon(pkg)
                  } catch (e: Exception) {
                      null
                  }
                  icons[pkg] = dr
                  return dr
              }

              fun batt(): BattInfo {
                  val i = app.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val lvl = i?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = i?.getIntExtra(BatteryManager.EXTRA_SCALE, 100) ?: 100
                  val pct = if (lvl >= 0 && scale > 0) lvl * 100 / scale else 0
                  val plugged = (i?.getIntExtra(BatteryManager.EXTRA_PLUGGED, 0) ?: 0) != 0
                  val status = i?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                  val full = status == BatteryManager.BATTERY_STATUS_FULL
                  val temp = (i?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0) / 10f
                  val mv = i?.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0) ?: 0
                  var cur = 0
                  try {
                      val bm = app.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                      cur = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CURRENT_NOW)
                      if (cur == Int.MIN_VALUE) cur = 0
                  } catch (e: Exception) {
                  }
                  val a = abs(cur.toLong())
                  val ua = if (a < 20000L) a * 1000L else a
                  val ma = ua / 1000f
                  val watts = ma / 1000f * mv / 1000f
                  return BattInfo(pct, plugged, full, temp, mv, ma, watts)
              }

              // ---------- calcul des valeurs ----------

              fun compute(m: Mod): ModuleValue {
                  return try {
                      val v = compute0(m)
                      v.frac = try {
                          fracFor(m, v)
                      } catch (e: Exception) {
                          -1f
                      }
                      v
                  } catch (e: Exception) {
                      ModuleValue("?", false, Pal.GRAY)
                  }
              }

              /** Niveau de 0 à 1 d'une info (pour les LED « niveau » et les fines barres), -1 si elle n'en a pas */
              private fun fracFor(m: Mod, v: ModuleValue): Float = when (m.kind) {
                  Kind.BATTERY -> batt().pct / 100f
                  Kind.CHARGE_WATTS -> (batt().watts / 25f).coerceIn(0f, 1f)
                  Kind.SIGNAL, Kind.NETWORK -> cellLevel() / 4f
                  Kind.WIFI_STATE -> if (v.active && wifiConnectedNow()) wifiLevelNow() / 4f else 0f
                  Kind.VOLUME -> {
                      val am = app.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      val st = arrayOf(AudioManager.STREAM_MUSIC, AudioManager.STREAM_RING, AudioManager.STREAM_VOICE_CALL, AudioManager.STREAM_ALARM)[m.opt.coerceIn(0, 3)]
                      am.getStreamVolume(st).toFloat() / am.getStreamMaxVolume(st).coerceAtLeast(1)
                  }
                  Kind.BRIGHTNESS -> Settings.System.getInt(app.contentResolver, Settings.System.SCREEN_BRIGHTNESS, 128) / 255f
                  Kind.STORAGE -> {
                      val sf = StatFs(Environment.getDataDirectory().path)
                      ((sf.totalBytes - sf.availableBytes).toFloat() / sf.totalBytes.toFloat()).coerceIn(0f, 1f)
                  }
                  Kind.RAM -> {
                      val am = app.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val mi = ActivityManager.MemoryInfo()
                      am.getMemoryInfo(mi)
                      ((mi.totalMem - mi.availMem).toFloat() / mi.totalMem.toFloat()).coerceIn(0f, 1f)
                  }
                  Kind.BATT_TEMP -> ((batt().tempC - 20f) / 30f).coerceIn(0f, 1f)
                  else -> -1f
              }

              @Suppress("DEPRECATION")
              private fun wifiConnectedNow(): Boolean {
                  return try {
                      val cm = app.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      var ok = false
                      for (n in cm.allNetworks) {
                          val c = cm.getNetworkCapabilities(n)
                          if (c != null && c.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)) ok = true
                      }
                      ok
                  } catch (e: Exception) {
                      false
                  }
              }

              /** État actuel utilisé pour déclencher les animations */
              fun evSnap(): EvSnap {
                  val b = batt()
                  val am = app.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val nm = app.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val f = nm.currentInterruptionFilter
                  return EvSnap(
                      b.plugged, b.pct, b.full, cellGen(), wifiConnectedNow(),
                      Settings.Global.getInt(app.contentResolver, Settings.Global.AIRPLANE_MODE_ON, 0) != 0,
                      f != NotificationManager.INTERRUPTION_FILTER_ALL && f != NotificationManager.INTERRUPTION_FILTER_UNKNOWN,
                      am.ringerMode,
                      NotifState.items.sumOf { it.count }
                  )
              }

              private fun fmt(p: String): String {
                  val f = fmts.getOrPut(p) { SimpleDateFormat(p, Locale.getDefault()) }
                  return f.format(Date())
              }

              private fun bars(level: Int, max: Int): String {
                  val chars = "▂▄▆█"
                  val sb = StringBuilder()
                  for (i in 0 until 4) {
                      sb.append(if (i < level * 4 / max) chars[i] else '▁')
                  }
                  return sb.toString()
              }

              private fun pctColor(p: Int): Int = when {
                  p >= 60 -> tc("batt_hi", Pal.GREEN)
                  p >= 30 -> tc("batt_mid", Pal.YELLOW)
                  p >= 15 -> tc("batt_low", Pal.ORANGE)
                  else -> tc("batt_crit", Pal.RED)
              }

              private fun compute0(m: Mod): ModuleValue {
                  val opt = m.opt
                  return when (m.kind) {
                      Kind.TIME -> ModuleValue(
                          fmt(arrayOf("HH:mm", "h:mm a", "HH:mm:ss", "h:mm:ss a", "EEE HH:mm")[opt.coerceIn(0, 4)]),
                          true, tc("time", Pal.CYAN)
                      )
                      Kind.DATE -> ModuleValue(
                          fmt(arrayOf("dd/MM", "EEE dd/MM", "d MMM", "EEEE d MMMM", "d MMM yyyy")[opt.coerceIn(0, 4)]),
                          true, tc("date", Pal.PURPLE)
                      )
                      Kind.BATTERY -> {
                          val b = batt()
                          val txt = when (opt) {
                              1 -> "" + b.pct
                              2 -> bars(b.pct, 100)
                              else -> b.pct.toString() + "%"
                          }
                          val col = if (b.plugged) tc("batt_plug", Pal.GREEN) else pctColor(b.pct)
                          ModuleValue(txt, true, col, if (b.plugged) "⚡" else null, !b.plugged && b.pct <= 10)
                      }
                      Kind.CHARGE_WATTS -> {
                          val b = batt()
                          val txt = when (opt) {
                              1 -> b.watts.roundToInt().toString() + " W"
                              2 -> b.ma.roundToInt().toString() + " mA"
                              3 -> "%.2f V".format(b.mv / 1000f)
                              else -> "%.1f W".format(b.watts)
                          }
                          val col = if (b.watts < 5f) tc("chw_low", Pal.ORANGE) else if (b.watts < 15f) tc("chw_mid", Pal.GREEN) else tc("chw_high", Pal.CYAN)
                          ModuleValue(if (b.plugged) txt else "—", b.plugged, if (b.plugged) col else Pal.GRAY, "⚡")
                      }
                      Kind.CHARGE_STATE -> {
                          val b = batt()
                          when {
                              !b.plugged -> ModuleValue("Débranché", false, Pal.GRAY)
                              b.full || b.pct >= 100 -> ModuleValue("Pleine", true, tc("cs_full", Pal.CYAN))
                              b.watts >= 15f -> ModuleValue("Rapide", true, tc("cs_fast", Pal.PURPLE))
                              else -> ModuleValue("Charge", true, tc("cs_chg", Pal.GREEN))
                          }
                      }
                      Kind.CHARGE_TIME -> {
                          val b = batt()
                          var ms = -1L
                          if (Build.VERSION.SDK_INT >= 28) {
                              val bm = app.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                              ms = bm.computeChargeTimeRemaining()
                          }
                          if (b.plugged && ms > 0L) {
                              val min = (ms / 60000L).toInt()
                              val t = if (min >= 60) (min / 60).toString() + "h" + "%02d".format(min % 60) else min.toString() + " min"
                              ModuleValue(t, true, tc("ctime", Pal.GREEN))
                          } else ModuleValue("—", false, Pal.GRAY)
                      }
                      Kind.BATT_TEMP -> {
                          val b = batt()
                          val txt = if (opt == 1) "%.0f°F".format(b.tempC * 9f / 5f + 32f) else "%.1f°C".format(b.tempC)
                          val col = if (b.tempC >= 42f) tc("bt_hot", Pal.RED) else if (b.tempC >= 38f) tc("bt_warm", Pal.ORANGE) else tc("bt_ok", Pal.GREEN)
                          ModuleValue(txt, true, col)
                      }
                      Kind.NETWORK -> network(opt == 1)
                      Kind.SIGNAL -> signal(opt)
                      Kind.SPEED -> {
                          val txt = when (opt) {
                              1 -> "↑" + rate(txRate)
                              2 -> "↓" + rate(rxRate) + " ↑" + rate(txRate)
                              else -> "↓" + rate(rxRate)
                          }
                          val on = rxRate + txRate > 1024f
                          ModuleValue(txt, on, if (on) tc("speed", Pal.CYAN) else Pal.GRAY)
                      }
                      Kind.NOTIF_COUNT, Kind.NOTIF_ICONS -> {
                          val n = NotifState.items.sumOf { it.count }
                          ModuleValue(n.toString(), n > 0, tc("notif", Pal.PINK))
                      }
                      Kind.WEATHER -> weather(opt)
                      Kind.BLUETOOTH -> {
                          val on = Settings.Global.getInt(app.contentResolver, "bluetooth_on", 0) != 0
                          ModuleValue(sw(m, on, "On", "Off"), on, if (on) tc("bt_on", Pal.BLUE) else Pal.GRAY)
                      }
                      Kind.WIFI_STATE -> {
                          val wm = app.applicationContext.getSystemService(Context.WIFI_SERVICE) as android.net.wifi.WifiManager
                          val on = try {
                              wm.isWifiEnabled
                          } catch (e: Exception) {
                              Settings.Global.getInt(app.contentResolver, "wifi_on", 0) != 0
                          }
                          if (!on) {
                              // Wi‑Fi éteint : LED grise
                              ModuleValue(sw(m, false, "On", "Off"), false, Pal.GRAY)
                          } else {
                              val connected = wifiConnectedNow()
                              if (!connected) {
                                  // Wi‑Fi allumé mais relié à aucun réseau : LED orange
                                  ModuleValue(sw(m, true, "On", "Off"), true, tc("wifi_idle", Pal.ORANGE))
                              } else {
                                  // connecté : la LED suit la qualité de réception (rouge → vert), clignote à 0 barre
                                  val lvl = wifiLevelNow()
                                  ModuleValue(sw(m, true, "On", "Off"), true, levelColor(lvl, "wifi"), null, lvl == 0)
                              }
                          }
                      }
                      Kind.AIRPLANE -> {
                          val on = Settings.Global.getInt(app.contentResolver, Settings.Global.AIRPLANE_MODE_ON, 0) != 0
                          ModuleValue(sw(m, on, "Avion", "Avion"), on, if (on) tc("airplane", Pal.ORANGE) else Pal.GRAY)
                      }
                      Kind.DND -> {
                          val nm = app.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                          val f = nm.currentInterruptionFilter
                          val on = f != NotificationManager.INTERRUPTION_FILTER_ALL && f != NotificationManager.INTERRUPTION_FILTER_UNKNOWN
                          ModuleValue(sw(m, on, "NPD", "NPD"), on, if (on) tc("dnd", Pal.PURPLE) else Pal.GRAY)
                      }
                      Kind.RINGER -> {
                          val am = app.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          when (am.ringerMode) {
                              AudioManager.RINGER_MODE_NORMAL -> ModuleValue("Sonnerie", true, tc("ring_normal", Pal.GREEN), "🔔")
                              AudioManager.RINGER_MODE_VIBRATE -> ModuleValue("Vibreur", true, tc("ring_vibrate", Pal.ORANGE), "📳")
                              else -> ModuleValue("Silence", true, tc("ring_silent", Pal.RED), "🔕")
                          }
                      }
                      Kind.ALARM -> {
                          val am = app.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                          val info = am.nextAlarmClock
                          if (info == null) ModuleValue("—", false, Pal.GRAY)
                          else {
                              val far = info.triggerTime - System.currentTimeMillis() > 20L * 3600L * 1000L
                              val f = fmts.getOrPut(if (far) "EEE HH:mm" else "HH:mm") {
                                  SimpleDateFormat(if (far) "EEE HH:mm" else "HH:mm", Locale.getDefault())
                              }
                              ModuleValue(f.format(Date(info.triggerTime)), true, tc("alarm", Pal.YELLOW))
                          }
                      }
                      Kind.TORCH -> ModuleValue(sw(m, torchOn, "On", "On"), torchOn, if (torchOn) tc("torch", Pal.YELLOW) else Pal.GRAY)
                      Kind.VOLUME -> {
                          val am = app.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          val st = arrayOf(AudioManager.STREAM_MUSIC, AudioManager.STREAM_RING, AudioManager.STREAM_VOICE_CALL, AudioManager.STREAM_ALARM)[opt.coerceIn(0, 3)]
                          val mx = am.getStreamMaxVolume(st).coerceAtLeast(1)
                          val p = am.getStreamVolume(st) * 100 / mx
                          ModuleValue("$p%", true, tc("volume", Pal.CYAN), if (p == 0) "🔇" else null)
                      }
                      Kind.BRIGHTNESS -> {
                          val v = Settings.System.getInt(app.contentResolver, Settings.System.SCREEN_BRIGHTNESS, 128) * 100 / 255
                          ModuleValue("$v%", true, tc("bright", Pal.YELLOW))
                      }
                      Kind.STORAGE -> {
                          val sf = StatFs(Environment.getDataDirectory().path)
                          val total = sf.totalBytes.toFloat()
                          val free = sf.availableBytes.toFloat()
                          if (opt == 1) {
                              val used = ((total - free) * 100f / total).roundToInt()
                              ModuleValue("$used%", true, if (used > 90) tc("mem_hot", Pal.RED) else tc("mem_ok", Pal.CYAN))
                          } else ModuleValue("%.0f Go".format(free / 1073741824f), true, tc("mem_ok", Pal.CYAN))
                      }
                      Kind.RAM -> {
                          val am = app.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                          val mi = ActivityManager.MemoryInfo()
                          am.getMemoryInfo(mi)
                          if (opt == 1) ModuleValue("%.1f Go".format(mi.availMem / 1073741824f), true, tc("mem_ok", Pal.CYAN))
                          else {
                              val used = ((mi.totalMem - mi.availMem) * 100f / mi.totalMem).roundToInt()
                              ModuleValue("$used%", true, if (used > 90) tc("mem_hot", Pal.RED) else tc("mem_ok", Pal.CYAN))
                          }
                      }
                      Kind.UPTIME -> {
                          val mins = (SystemClock.elapsedRealtime() / 60000L).toInt()
                          val t = if (mins >= 1440) (mins / 1440).toString() + "j" + (mins % 1440 / 60).toString() + "h"
                          else (mins / 60).toString() + "h" + "%02d".format(mins % 60)
                          ModuleValue(t, true, tc("uptime", Pal.PURPLE))
                      }
                      Kind.MEDIA -> media(opt)
                      Kind.LOCATION -> {
                          val lm = app.getSystemService(Context.LOCATION_SERVICE) as LocationManager
                          val on = if (Build.VERSION.SDK_INT >= 28) lm.isLocationEnabled else true
                          ModuleValue(sw(m, on, "GPS", "Off"), on, if (on) tc("gps_on", Pal.GREEN) else Pal.GRAY)
                      }
                      Kind.CUSTOM -> ModuleValue(m.text, true, Pal.WHITE)
                      Kind.SPACER -> ModuleValue("", true, Pal.WHITE)
                  }
              }

              private fun rate(b: Float): String = when {
                  b >= 1048576f -> "%.1fM".format(b / 1048576f)
                  b >= 1024f -> "%.0fK".format(b / 1024f)
                  else -> "%.0fB".format(b)
              }

              private fun network(simple: Boolean): ModuleValue {
                  // Cette tuile ne parle que du réseau mobile, même quand le Wi‑Fi est connecté
                  // (le Wi‑Fi a sa propre tuile « Wi‑Fi activé »)
                  val airplane = Settings.Global.getInt(app.contentResolver, Settings.Global.AIRPLANE_MODE_ON, 0) != 0
                  if (airplane) return ModuleValue("Hors ligne", false, tc("offline", Pal.RED), "📵", true)
                  val g = if (simple) "Mobile" else cellGen()
                  // le texte donne le type de réseau, la LED donne la qualité du signal
                  val lvl = cellLevel()
                  return ModuleValue(g, true, levelColor(lvl), "📶", lvl == 0)
              }

              /** Texte d'un interrupteur : celui choisi par la personne (activé / désactivé), sinon le texte d'origine */
              private fun sw(m: Mod, on: Boolean, dOn: String, dOff: String): String {
                  val custom = if (on) m.textOn else m.textOff
                  return if (custom.isNotEmpty()) custom else (if (on) dOn else dOff)
              }

              /** Couleur de LED selon la qualité du signal : 0 aucun (rouge clignotant), 1 très faible (rouge), 2 moyen (orange), 3 bon (jaune), 4 excellent (vert) */
              private fun levelColor(l: Int, pre: String = "sig"): Int = when (l) {
                  0 -> tc(pre + "0", Pal.RED)
                  1 -> tc(pre + "1", Pal.RED)
                  2 -> tc(pre + "2", Pal.ORANGE)
                  3 -> tc(pre + "3", Pal.YELLOW)
                  else -> tc(pre + "4", Pal.GREEN)
              }

              /** Puissance réelle du signal en dBm (RSRP en 4G, SS-RSRP en 5G autonome), ou null si inconnue */
              private fun cellDbm(tm: TelephonyManager): Int? {
                  if (Build.VERSION.SDK_INT < 29) return null
                  val list = tm.signalStrength?.cellSignalStrengths ?: return null
                  var lte: Int? = null
                  var nr: Int? = null
                  var other: Int? = null
                  for (c in list) {
                      when (c) {
                          is CellSignalStrengthLte -> {
                              val v = c.rsrp
                              if (v != Int.MAX_VALUE && v < -30) lte = v
                          }
                          is CellSignalStrengthNr -> {
                              val v = c.ssRsrp
                              if (v != Int.MAX_VALUE && v < -30) nr = v
                          }
                          else -> {
                              val v = c.dbm
                              if (v != Int.MAX_VALUE && v < -30) other = v
                          }
                      }
                  }
                  val sa = try { tm.dataNetworkType == 20 } catch (e: Exception) { false }
                  return if (sa) (nr ?: lte ?: other) else (lte ?: other ?: nr)
              }

              /** Excellent >= -85 dBm, bon >= -95, moyen >= -105, très faible >= -125, sinon aucun */
              private fun dbmLevel(d: Int): Int = when {
                  d >= -85 -> 4
                  d >= -95 -> 3
                  d >= -105 -> 2
                  d >= -125 -> 1
                  else -> 0
              }

              /** Niveau du signal mobile de 0 à 4, calculé sur les dBm réels */
              private fun cellLevel(): Int {
                  return try {
                      val tm = app.getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
                      val dbm = cellDbm(tm)
                      if (dbm != null) dbmLevel(dbm)
                      else if (Build.VERSION.SDK_INT >= 28) (tm.signalStrength?.level ?: 0)
                      else 2
                  } catch (e: Exception) {
                      2
                  }
              }

              /** Vrai si une mesure 5G est réellement présente (comme les lignes « SS RSRP » de Cellular-Z) */
              private fun nrMeasured(tm: TelephonyManager): Boolean {
                  if (Build.VERSION.SDK_INT < 29) return true
                  return try {
                      val list = tm.signalStrength?.cellSignalStrengths
                      if (list == null) true
                      else list.any { it is CellSignalStrengthNr && it.ssRsrp != Int.MAX_VALUE && it.ssRsrp < -30 }
                  } catch (e: Exception) {
                      true
                  }
              }

              /** Niveau de réception Wi‑Fi de 0 à 4 (4 si illisible) */
              @Suppress("DEPRECATION")
              private fun wifiLevelNow(): Int {
                  try {
                      val wm = app.applicationContext.getSystemService(Context.WIFI_SERVICE) as android.net.wifi.WifiManager
                      val rssi = wm.connectionInfo.rssi
                      if (rssi > -127) {
                          return when {
                              rssi >= -55 -> 4
                              rssi >= -67 -> 3
                              rssi >= -78 -> 2
                              rssi >= -88 -> 1
                              else -> 0
                          }
                      }
                  } catch (e: Exception) {
                  }
                  return 4
              }

              @Suppress("DEPRECATION")
              private fun wifiValue(): ModuleValue {
                  var lvl = 4
                  try {
                      val wm = app.getSystemService(Context.WIFI_SERVICE) as android.net.wifi.WifiManager
                      val rssi = wm.connectionInfo.rssi
                      if (rssi > -127) {
                          lvl = when {
                              rssi >= -55 -> 4
                              rssi >= -67 -> 3
                              rssi >= -78 -> 2
                              rssi >= -88 -> 1
                              else -> 0
                          }
                      }
                  } catch (e: Exception) {
                  }
                  return ModuleValue("Wi‑Fi", true, levelColor(lvl, "wifi"), "📶", lvl == 0)
              }

              private val nrRe = Regex("nrState\\s*=\\s*([A-Za-z_]+)", RegexOption.IGNORE_CASE)
              private var genCache = ""
              private var genAt = 0L

              /** État de la 5G lu dans le téléphone : CONNECTED, NOT_RESTRICTED, RESTRICTED, NONE... ou « illisible » */
              @Suppress("DEPRECATION")
              private fun nrStateName(tm: TelephonyManager): String {
                  return try {
                      val ss = tm.serviceState ?: return "illisible"
                      nrRe.find(ss.toString())?.groupValues?.get(1)?.uppercase() ?: "illisible"
                  } catch (e: SecurityException) {
                      "illisible"
                  } catch (e: Exception) {
                      "illisible"
                  }
              }

              /** Type de réseau affiché (calculé au plus une fois par seconde) */
              private fun cellGen(): String {
                  val clock = android.os.SystemClock.elapsedRealtime()
                  if (genCache.isNotEmpty() && clock - genAt < 800L) return genCache
                  val r = try {
                      val tm = app.getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
                      var t = tm.dataNetworkType
                      // en Wi‑Fi, certains téléphones annoncent « IWLAN » (18) : on lit alors le vrai réseau mobile (voix)
                      if (t == 0 || t == 18) {
                          val vt = tm.voiceNetworkType
                          if (vt != 0 && vt != 18) t = vt
                      }
                      val o = ovrType
                      val ns = nrStateName(tm)
                      val lisible = ns == "CONNECTED" || ns == "NONE" || ns == "RESTRICTED" || ns == "NOT_RESTRICTED"
                      val large = Store.cfg.det5g == 1
                      // 5G NSA (4G + 5G) : l'ancre reste en LTE, seuls l'état NR et l'override le signalent
                      val nr = when {
                          t == 20 -> true
                          ns == "CONNECTED" -> true
                          large -> o == 3 || o == 4 || o == 5
                          !lisible -> (o == 3 || o == 4 || o == 5) && nrMeasured(tm)
                          else -> false
                      }
                      val res = when {
                          nr -> if (o == 4 || o == 5) "5G+" else "5G"
                          t == 19 || (t == 13 && (o == 1 || o == 2)) -> "4G+"
                          t == 13 -> "4G"
                          t in listOf(8, 9, 10, 15) -> "3G+"
                          t in listOf(3, 5, 6, 12, 14, 17) -> "3G"
                          t == 2 -> "2G+"
                          t in listOf(1, 4, 7, 11, 16) -> "2G"
                          else -> "Mobile"
                      }
                      Diag5g.text = "type réseau = " + t + " · override = " + o + " · état 5G = " + ns +
                          " · mode = " + (if (large) "large" else "strict") + " → " + res
                      res
                  } catch (e: Exception) {
                      "Mobile"
                  }
                  genCache = r
                  genAt = clock
                  return r
              }
              private fun signal(opt: Int): ModuleValue {
                  val tm = app.getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
                  val dbm = try { cellDbm(tm) } catch (e: Exception) { null }
                  val lvl = cellLevel()
                  val txt = when (opt) {
                      1 -> "$lvl/4"
                      2 -> if (dbm != null) "$dbm dBm" else "— dBm"
                      3 -> cellGen()
                      else -> bars(lvl, 4)
                  }
                  return ModuleValue(txt, true, levelColor(lvl), "📡", lvl == 0)
              }

              private fun weather(opt: Int): ModuleValue {
                  val w = Weather.data ?: return ModuleValue("--", true, Pal.GRAY, "🌡️")
                  val hour = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                  val night = hour < 7 || hour >= 21
                  val ic = Weather.emoji(w.code, night)
                  val col = when {
                      w.temp < 0f -> tc("wx0", Pal.CYAN)
                      w.temp < 12f -> tc("wx1", Pal.BLUE)
                      w.temp < 22f -> tc("wx2", Pal.GREEN)
                      w.temp < 30f -> tc("wx3", Pal.ORANGE)
                      else -> tc("wx4", Pal.RED)
                  }
                  val txt = when (opt) {
                      1 -> (w.temp * 9f / 5f + 32f).roundToInt().toString() + "°F"
                      2 -> w.wind.roundToInt().toString() + " km/h"
                      3 -> w.hum.toString() + "%"
                      4 -> Weather.label(w.code)
                      else -> w.temp.roundToInt().toString() + "°"
                  }
                  return ModuleValue(txt, true, col, ic)
              }

              private fun media(opt: Int): ModuleValue {
                  return try {
                      val msm = app.getSystemService(Context.MEDIA_SESSION_SERVICE) as MediaSessionManager
                      val list = msm.getActiveSessions(ComponentName(app, NotifListener::class.java))
                      val c = list.firstOrNull { it.playbackState?.state == PlaybackState.STATE_PLAYING }
                      if (c == null) ModuleValue("", false, Pal.GRAY)
                      else {
                          val md = c.metadata
                          val title = md?.getString(MediaMetadata.METADATA_KEY_TITLE) ?: ""
                          val artist = md?.getString(MediaMetadata.METADATA_KEY_ARTIST) ?: ""
                          var t = when (opt) {
                              1 -> artist
                              2 -> if (artist.isEmpty()) title else artist + " – " + title
                              else -> title
                          }
                          if (t.length > 22) t = t.substring(0, 21) + "…"
                          ModuleValue(t, t.isNotEmpty(), tc("media", Pal.PURPLE))
                      }
                  } catch (e: Exception) {
                      ModuleValue("", false, Pal.GRAY)
                  }
              }
          }
