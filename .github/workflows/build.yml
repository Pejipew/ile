              private val tabNames = listOf("🎨 Forme", "🖌️ Style", "🎯 Objectif", "🧩 Infos", "⚙️ Options", "🌈 Couleurs", "📊 Historique 5G", "📏 Jauges", "✨ Animations", "🕳️ Masque")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Store.ensure(this)
                  window.statusBarColor = Pal.BG
                  window.navigationBarColor = Pal.BG

                  ui = Ui(this) { commit() }
                  engine = StatusEngine(this) { refreshViews() }
                  bar = BarView(this, engine)
                  halo = HaloView(this, engine)
                  preview = PreviewFrame(this, bar, halo)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Pal.BG)
                  val ver = TextView(this)
                  var vName = "?"
                  var vCode = 0L
                  try {
                      val pi = packageManager.getPackageInfo(packageName, 0)
                      vName = pi.versionName ?: "?"
                      @Suppress("DEPRECATION")
                      vCode = if (Build.VERSION.SDK_INT >= 28) pi.longVersionCode else pi.versionCode.toLong()
                  } catch (e: Exception) {
                  }
                  ver.text = "Custom Island · v" + vName + " (build " + vCode + ")"
                  ver.setTextColor(Pal.SUB)
                  ver.textSize = 11f
                  ver.gravity = android.view.Gravity.CENTER
                  root.addView(ver, LinearLayout.LayoutParams(ui.MATCH, ui.WRAP))

                  val pl = LinearLayout.LayoutParams(ui.MATCH, ui.WRAP)
                  pl.setMargins(ui.dp(10), ui.dp(6), ui.dp(10), ui.dp(4))
                  root.addView(preview, pl)

                  val hs = HorizontalScrollView(this)
                  hs.isHorizontalScrollBarEnabled = false
                  tabRow = LinearLayout(this)
                  tabRow.setPadding(ui.dp(10), ui.dp(4), ui.dp(10), ui.dp(4))
                  for ((i, n) in tabNames.withIndex()) {
                      val c = ui.chip(n)
                      c.setOnClickListener { showTab(i) }
                      val lp = LinearLayout.LayoutParams(ui.WRAP, ui.WRAP)
                      lp.setMargins(0, 0, ui.dp(8), 0)
                      tabRow.addView(c, lp)
                  }
                  hs.addView(tabRow)
                  root.addView(hs, LinearLayout.LayoutParams(ui.MATCH, ui.WRAP))

                  content = FrameLayout(this)
                  root.addView(content, LinearLayout.LayoutParams(ui.MATCH, 0, 1f))
                  setContentView(root)
                  showTab(0)

                  val need = ArrayList<String>()
                  if (!granted(Manifest.permission.ACCESS_COARSE_LOCATION)) need.add(Manifest.permission.ACCESS_COARSE_LOCATION)
                  if (!granted(Manifest.permission.READ_PHONE_STATE)) need.add(Manifest.permission.READ_PHONE_STATE)
                  if (need.isNotEmpty()) requestPermissions(need.toTypedArray(), 42)
              }

              override fun onResume() {
                  super.onResume()
                  engine.start()
                  refreshViews()
                  if (tab == 4) showTab(4)
                  if (tab == 9) setMaskEdit(true)
              }

              override fun onPause() {
                  setMaskEdit(false)
                  engine.stop()
                  super.onPause()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  Weather.reset()
                  if (tab == 4) showTab(4)
              }

              private fun granted(p: String): Boolean = checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              private fun refreshViews() {
                  bar.refresh()
                  halo.refresh()
              }

              /** Enregistre, applique à la vraie barre et à l'aperçu */
              fun commit() {
                  Store.save()
                  IslandAccessibilityService.instance?.reload()
                  preview.relayout()
                  refreshViews()
              }

              private fun scroll(v: View): View {
                  val s = ScrollView(this)
                  s.addView(v)
                  return s
              }

              /** Montre (ou cache) la zone tactile de la poignée sur l'écran pendant qu'on la règle */
              /** Montre (ou cache) le masque en direct sur l'écran pendant que l'onglet Masque est ouvert */
              private fun setMaskEdit(v: Boolean) {
                  if (Store.maskEdit == v) return
                  Store.maskEdit = v
                  IslandAccessibilityService.instance?.reload()
              }

              private fun appLabel(pkg: String): String {
                  return try {
                      packageManager.getApplicationLabel(packageManager.getApplicationInfo(pkg, 0)).toString()
                  } catch (e: Exception) {
                      pkg
                  }
              }

              private fun pickMaskApps() {
                  val c = Store.cfg
                  val pm = packageManager
                  val q = Intent(Intent.ACTION_MAIN)
                  q.addCategory(Intent.CATEGORY_LAUNCHER)
                  val list = pm.queryIntentActivities(q, 0)
                      .map { Pair(it.activityInfo.packageName, it.loadLabel(pm).toString()) }
                      .distinctBy { it.first }
                      .sortedBy { it.second.lowercase() }
                  val sel = c.maskApps
                  val checked = BooleanArray(list.size) { sel.contains(list[it].first) }
                  AlertDialog.Builder(this, android.R.style.Theme_Material_Dialog_Alert)
                      .setTitle("Applis avec le masque")
                      .setMultiChoiceItems(list.map { it.second }.toTypedArray(), checked) { _, which, on -> checked[which] = on }
                      .setPositiveButton("OK") { _, _ ->
                          val keep = ArrayList<String>()
                          for (i in list.indices) if (checked[i]) keep.add(list[i].first)
                          c.maskApps = keep
                          commit()
                          rebuild()
                      }
                      .setNegativeButton("Annuler", null)
                      .show()
              }

