          package com.example.island

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.RectF
          import android.os.Handler
          import android.os.Looper
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewConfiguration
          import kotlin.math.abs
          import kotlin.math.min

          /** Poignée sur le côté de l'écran : appui, appui long ou glissement = action au choix */
          class SideView(ctx: Context, private val doAction: (Int) -> Unit) : View(ctx) {
              private val d = ctx.resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()
              private val slop = ViewConfiguration.get(ctx).scaledTouchSlop * 2
              private val handler = Handler(Looper.getMainLooper())
              private var downX = 0f
              private var downY = 0f
              private var longFired = false

              private val longRun = Runnable {
                  longFired = true
                  doAction(Store.cfg.sideLong)
              }

              fun refresh() {
                  invalidate()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  val c = Store.cfg
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          downX = e.rawX
                          downY = e.rawY
                          longFired = false
                          if (c.sideLong != 0) {
                              handler.postDelayed(longRun, ViewConfiguration.getLongPressTimeout().toLong())
                          }
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (!longFired && (abs(e.rawX - downX) > slop || abs(e.rawY - downY) > slop)) {
                              handler.removeCallbacks(longRun)
                          }
                      }
                      MotionEvent.ACTION_UP -> {
                          handler.removeCallbacks(longRun)
                          if (!longFired) {
                              val dx = e.rawX - downX
                              val dy = e.rawY - downY
                              val th = 24f * d
                              if (abs(dy) > th && abs(dy) > abs(dx)) {
                                  doAction(if (dy > 0f) c.sideDown else c.sideUp)
                              } else if (abs(dx) > th && abs(dx) > abs(dy)) {
                                  val inward = if (c.sideRight) dx < 0f else dx > 0f
                                  if (inward) doAction(c.sideIn)
                              } else if (abs(dx) <= slop && abs(dy) <= slop) {
                                  doAction(c.sideTap)
                              }
                          }
                      }
                      MotionEvent.ACTION_CANCEL -> handler.removeCallbacks(longRun)
                  }
                  return true
              }

              override fun onDraw(canvas: Canvas) {
                  val c = Store.cfg
                  if (!c.sideOn || !c.sideVisible) return
                  if (c.sideOnNotif && NotifState.items.isEmpty()) return
                  val th = c.sideThick * d
                  val len = min(height.toFloat(), c.sideLen * d)
                  val top = (height - len) / 2f
                  val left = if (c.sideRight) width - th else 0f
                  rect.set(left, top, left + th, top + len)
                  p.style = Paint.Style.FILL
                  p.color = c.sideColor
                  canvas.drawRoundRect(rect, th / 2f, th / 2f, p)
              }
          }
