                      c.mods.add(Mod.create(Kind.TIME, true))
                      c.mods.add(Mod.create(Kind.WEATHER, true))
                      c.mods.add(Mod.create(Kind.NOTIF_ICONS, false))
                      c.mods.add(Mod.create(Kind.NETWORK, false))
