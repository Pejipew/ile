          /** Historique des connexions 5G, gardé sur le téléphone (300 événements au maximum) */
          object Hist5g {
              class Ev(val t: Long, val on: Boolean, val note: String)

              private fun prefs(ctx: Context): SharedPreferences =
                  ctx.applicationContext.getSharedPreferences("island_v2", Context.MODE_PRIVATE)

              fun load(ctx: Context): List<Ev> {
                  val out = ArrayList<Ev>()
                  try {
                      val a = JSONArray(prefs(ctx).getString("h5g", "[]"))
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          out.add(Ev(o.getLong("t"), o.getBoolean("o"), o.optString("n", "")))
                      }
                  } catch (e: Exception) {
                  }
                  return out
              }

              fun add(ctx: Context, on: Boolean, note: String) {
                  try {
                      val cur = load(ctx).toMutableList()
                      cur.add(Ev(System.currentTimeMillis(), on, note))
                      while (cur.size > 300) cur.removeAt(0)
                      val a = JSONArray()
                      for (e in cur) a.put(JSONObject().put("t", e.t).put("o", e.on).put("n", e.note))
                      prefs(ctx).edit().putString("h5g", a.toString()).apply()
                  } catch (e: Exception) {
                  }
              }

              fun clear(ctx: Context) {
                  prefs(ctx).edit().remove("h5g").apply()
              }
          }

          object Store {
              @Volatile
              var rev = 0

              /** Vrai pendant le réglage de la poignée latérale : on montre sa zone tactile */
              @Volatile
              var sideEdit = false

              /** Vrai pendant que l'onglet Masque est ouvert : on montre le masque avec son contour */
