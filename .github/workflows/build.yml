          mkdir -p app/src/main/java/com/example/island
          cat > app/src/main/java/com/example/island/ColorWheelView.kt <<'KOTLIN_EOF'
          package com.example.island

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import android.graphics.SweepGradient
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.min
          import kotlin.math.sin

          /** Cercle chromatique : l'angle donne la teinte, la distance au centre la saturation */
          class ColorWheelView(context: Context, private val onColor: (Int) -> Unit) : View(context) {

              private var hue = 0f
              private var sat = 0f
              private var value = 1f
              private var cx = 0f
              private var cy = 0f
              private var radius = 0f
              private val density = context.resources.displayMetrics.density

              private val huePaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val satPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val dimPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val ring = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE }

              fun currentColor(): Int = Color.HSVToColor(floatArrayOf(hue, sat, value))

              fun setColor(c: Int) {
                  val hsv = FloatArray(3)
                  Color.colorToHSV(c, hsv)
                  hue = hsv[0]
                  sat = hsv[1]
                  value = hsv[2]
                  invalidate()
              }

              fun setBrightness(v: Float) {
                  value = v.coerceIn(0f, 1f)
                  invalidate()
                  onColor(currentColor())
              }

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val w = MeasureSpec.getSize(widthMeasureSpec)
                  val s = min(w, (280 * density).toInt())
                  setMeasuredDimension(s, s)
              }

              override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                  cx = w / 2f
                  cy = h / 2f
                  radius = min(w, h) / 2f - 6f * density
                  huePaint.shader = SweepGradient(
                      cx, cy,
                      intArrayOf(
                          Color.RED, Color.YELLOW, Color.GREEN,
                          Color.CYAN, Color.BLUE, Color.MAGENTA, Color.RED
                      ),
                      null
                  )
                  satPaint.shader = RadialGradient(
                      cx, cy, radius, Color.WHITE, Color.TRANSPARENT, Shader.TileMode.CLAMP
                  )
              }

              override fun onDraw(canvas: Canvas) {
                  canvas.drawCircle(cx, cy, radius, huePaint)
                  canvas.drawCircle(cx, cy, radius, satPaint)
                  dimPaint.color = Color.argb(((1f - value) * 255).toInt(), 0, 0, 0)
                  canvas.drawCircle(cx, cy, radius, dimPaint)

                  val rad = Math.toRadians(hue.toDouble())
                  val x = cx + (sat * radius * cos(rad)).toFloat()
                  val y = cy + (sat * radius * sin(rad)).toFloat()
                  ring.strokeWidth = 3f * density
                  ring.color = Color.WHITE
                  canvas.drawCircle(x, y, 10f * density, ring)
                  ring.strokeWidth = 1.5f * density
                  ring.color = Color.BLACK
                  canvas.drawCircle(x, y, 11.5f * density, ring)
              }

              override fun onTouchEvent(e: android.view.MotionEvent): Boolean {
                  parent?.requestDisallowInterceptTouchEvent(true)
                  if (e.actionMasked == MotionEvent.ACTION_DOWN || e.actionMasked == MotionEvent.ACTION_MOVE) {
                      val dx = e.x - cx
                      val dy = e.y - cy
                      sat = min(1f, hypot(dx, dy) / radius)
                      var deg = Math.toDegrees(atan2(dy, dx).toDouble()).toFloat()
                      if (deg < 0f) deg += 360f
                      hue = deg
                      invalidate()
                      onColor(currentColor())
                  }
                  return true
              }
          }
