name: Build APK Barre

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Générer le projet
        run: |
          set -e
          mkdir -p barre/app/src/main/java/com/pierrejean/barre
          echo '' | base64 -d > barre/barre.keystore
          cat > barre/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "barre"
          include ':app'
          EOF
          cat > barre/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          cat > barre/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=false
          EOF
          cat > barre/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

          android {
              namespace 'com.pierrejean.barre'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.pierrejean.barre'
                  minSdk 26
                  targetSdk 34
                  versionCode run
                  versionName "1." + run
              }

              signingConfigs {
                  debug {
                      storeFile file('../barre.keystore')
                      storePassword 'android'
                      keyAlias 'barre'
                      keyPassword 'android'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF
          cat > barre/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="Barre"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="overlay"/>
                  </service>
              </application>
          </manifest>
          EOF
          cat > barre/app/src/main/java/com/pierrejean/barre/Cfg.kt <<'EOF'
          package com.pierrejean.barre

          import android.content.Context
          import android.graphics.PointF

          object Cfg {
              fun sp(c: Context) = c.getSharedPreferences("cfg", Context.MODE_PRIVATE)

              // Coordonnées en dp : x depuis le centre de l'écran, y depuis le haut
              fun defaults(): MutableList<PointF> = mutableListOf(
                  PointF(-160f, 0f), PointF(-22f, 0f), PointF(-19f, 11f), PointF(-11f, 19f),
                  PointF(0f, 22f), PointF(11f, 19f), PointF(19f, 11f), PointF(22f, 0f),
                  PointF(160f, 0f), PointF(160f, 30f), PointF(-160f, 30f)
              )

              fun encode(p: List<PointF>) = p.joinToString(";") { "${it.x},${it.y}" }

              fun decode(s: String?): MutableList<PointF> {
                  if (s.isNullOrEmpty()) return defaults()
                  return try {
                      s.split(";").map {
                          val a = it.split(",")
                          PointF(a[0].toFloat(), a[1].toFloat())
                      }.toMutableList()
                  } catch (e: Exception) {
                      defaults()
                  }
              }
          }
          EOF
          cat > barre/app/src/main/java/com/pierrejean/barre/ShapeView.kt <<'EOF'
          package com.pierrejean.barre

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.CornerPathEffect
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PointF
          import android.view.MotionEvent
          import android.view.View

          class ShapeView(c: Context) : View(c) {
              var pts: MutableList<PointF> = mutableListOf()
              var color = Color.BLACK
              var corner = 6f
              var offX = 0f
              var offY = 0f
              var zoom = 1f
              var edit = false
              var mode = 0 // 0 deplacer, 1 ajouter, 2 supprimer
              var onChange: (() -> Unit)? = null

              private val d = resources.displayMetrics.density
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val dot = Paint(Paint.ANTI_ALIAS_FLAG)
              private var drag = -1

              private fun sx(x: Float) = width / 2f + (x + offX) * d * zoom
              private fun sy(y: Float) = (y + offY) * d * zoom
              private fun ux(px: Float) = (px - width / 2f) / (d * zoom) - offX
              private fun uy(py: Float) = py / (d * zoom) - offY

              override fun onDraw(cv: Canvas) {
                  if (edit) cv.drawColor(0xFF9E9E9E.toInt())
                  if (pts.size < 3) return
                  val p = Path()
                  pts.forEachIndexed { i, q ->
                      if (i == 0) p.moveTo(sx(q.x), sy(q.y)) else p.lineTo(sx(q.x), sy(q.y))
                  }
                  p.close()
                  fill.style = Paint.Style.FILL
                  fill.color = color
                  fill.pathEffect = if (corner > 0f) CornerPathEffect(corner * d * zoom) else null
                  cv.drawPath(p, fill)
                  if (edit) {
                      pts.forEachIndexed { i, q ->
                          dot.color = if (i == drag) Color.YELLOW else Color.CYAN
                          cv.drawCircle(sx(q.x), sy(q.y), 6 * d, dot)
                      }
                  }
              }

              private fun nearest(x: Float, y: Float): Int {
                  var best = -1
                  var bd = (24 * d) * (24 * d)
                  pts.forEachIndexed { i, q ->
                      val dx = sx(q.x) - x
                      val dy = sy(q.y) - y
                      val dd = dx * dx + dy * dy
                      if (dd < bd) {
                          bd = dd
                          best = i
                      }
                  }
                  return best
              }

              private fun insertOnEdge(x: Float, y: Float) {
                  var best = -1
                  var bd = Float.MAX_VALUE
                  var bx = 0f
                  var by = 0f
                  for (i in pts.indices) {
                      val a = pts[i]
                      val b = pts[(i + 1) % pts.size]
                      val ax = sx(a.x)
                      val ay = sy(a.y)
                      val dx = sx(b.x) - ax
                      val dy = sy(b.y) - ay
                      val l2 = dx * dx + dy * dy
                      val t = if (l2 == 0f) 0f else (((x - ax) * dx + (y - ay) * dy) / l2).coerceIn(0f, 1f)
                      val px = ax + t * dx
                      val py = ay + t * dy
                      val dd = (x - px) * (x - px) + (y - py) * (y - py)
                      if (dd < bd) {
                          bd = dd
                          best = i
                          bx = px
                          by = py
                      }
                  }
                  if (best >= 0) {
                      pts.add(best + 1, PointF(ux(bx), uy(by)))
                      drag = best + 1
                  }
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (!edit) return false
                  val x = e.x
                  val y = e.y
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          parent.requestDisallowInterceptTouchEvent(true)
                          val i = nearest(x, y)
                          if (mode == 0) {
                              drag = i
                          } else if (mode == 1) {
                              if (i >= 0) {
                                  drag = i
                              } else {
                                  insertOnEdge(x, y)
                              }
                          } else if (mode == 2) {
                              if (i >= 0 && pts.size > 3) {
                                  pts.removeAt(i)
                              }
                          }
                          onChange?.invoke()
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (drag >= 0) {
                              pts[drag].set(ux(x), uy(y))
                              onChange?.invoke()
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          drag = -1
                          onChange?.invoke()
                      }
                  }
                  invalidate()
                  return true
              }
          }
          EOF
          cat > barre/app/src/main/java/com/pierrejean/barre/OverlayService.kt <<'EOF'
          package com.pierrejean.barre

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.WindowManager

          class OverlayService : Service(), SharedPreferences.OnSharedPreferenceChangeListener {
              private lateinit var wm: WindowManager
              private var view: ShapeView? = null

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  Cfg.sp(this).registerOnSharedPreferenceChangeListener(this)
              }

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("barre", "Barre", NotificationManager.IMPORTANCE_MIN)
                  )
                  val n = Notification.Builder(this, "barre")
                      .setContentTitle("Barre active")
                      .setSmallIcon(android.R.drawable.ic_menu_edit)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, 0x40000000)
                  } else {
                      startForeground(1, n)
                  }
                  addOverlay()
                  return START_STICKY
              }

              private fun addOverlay() {
                  if (view != null) return
                  val v = ShapeView(this)
                  view = v
                  val lp = WindowManager.LayoutParams(
                      -1, (200 * resources.displayMetrics.density).toInt(),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode = if (Build.VERSION.SDK_INT >= 30) 3 else 1
                  }
                  wm.addView(v, lp)
                  refresh()
              }

              private fun refresh() {
                  val v = view ?: return
                  val s = Cfg.sp(this)
                  v.pts = Cfg.decode(s.getString("pts", null))
                  v.color = s.getInt("color", Color.BLACK)
                  v.corner = s.getFloat("corner", 6f)
                  v.offX = s.getFloat("offX", 0f)
                  v.offY = s.getFloat("offY", 0f)
                  v.invalidate()
              }

              override fun onSharedPreferenceChanged(sp: SharedPreferences?, key: String?) {
                  refresh()
              }

              override fun onDestroy() {
                  Cfg.sp(this).unregisterOnSharedPreferenceChangeListener(this)
                  view?.let { wm.removeView(it) }
                  view = null
                  super.onDestroy()
              }
          }
          EOF
          cat > barre/app/src/main/java/com/pierrejean/barre/MainActivity.kt <<'EOF'
          package com.pierrejean.barre

          import android.app.Activity
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.PointF
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var sp: SharedPreferences
              private lateinit var shape: ShapeView
              private lateinit var toggle: Button
              private val d by lazy { resources.displayMetrics.density }

              private var pts: MutableList<PointF> = mutableListOf()
              private var color = Color.BLACK
              private var corner = 6f
              private var offX = 0f
              private var offY = 0f
              private var zoom = 2f
              private var opa = 255
              private val hsv = FloatArray(3)

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  sp = Cfg.sp(this)
                  pts = Cfg.decode(sp.getString("pts", null))
                  color = sp.getInt("color", Color.BLACK)
                  corner = sp.getFloat("corner", 6f)
                  offX = sp.getFloat("offX", 0f)
                  offY = sp.getFloat("offY", 0f)
                  Color.colorToHSV(color, hsv)
                  opa = Color.alpha(color)
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  }

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding((16 * d).toInt(), (40 * d).toInt(), (16 * d).toInt(), (24 * d).toInt())
                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)

                  toggle = Button(this)
                  toggle.isAllCaps = false
                  toggle.setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(
                              Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                          )
                      } else {
                          sp.edit().putBoolean("on", !sp.getBoolean("on", false)).apply()
                          applyService()
                      }
                  }
                  root.addView(toggle)

                  val tip = TextView(this)
                  tip.text = "Modèle la forme ici. Le résultat apparaît en direct sur ton écran."
                  root.addView(tip)

                  shape = ShapeView(this)
                  shape.pts = pts
                  shape.color = color
                  shape.corner = corner
                  shape.zoom = zoom
                  shape.edit = true
                  shape.onChange = { save() }
                  root.addView(shape, LinearLayout.LayoutParams(-1, (110 * d * zoom).toInt()))

                  val names = arrayOf("Déplacer", "Ajouter", "Supprimer")
                  val btns = ArrayList<Button>()
                  val row = LinearLayout(this)
                  fun hl(sel: Int) {
                      btns.forEachIndexed { j, x -> x.alpha = if (j == sel) 1f else 0.45f }
                  }
                  names.forEachIndexed { i, m ->
                      val bt = Button(this)
                      bt.text = m
                      bt.isAllCaps = false
                      bt.setOnClickListener {
                          shape.mode = i
                          hl(i)
                      }
                      btns.add(bt)
                      row.addView(bt, LinearLayout.LayoutParams(0, -2, 1f))
                  }
                  hl(0)
                  root.addView(row)

                  val row2 = LinearLayout(this)
                  val sub = Button(this)
                  sub.text = "Subdiviser (plus de points)"
                  sub.isAllCaps = false
                  sub.setOnClickListener {
                      val n = ArrayList<PointF>()
                      for (i in pts.indices) {
                          val a = pts[i]
                          val c = pts[(i + 1) % pts.size]
                          n.add(a)
                          n.add(PointF((a.x + c.x) / 2f, (a.y + c.y) / 2f))
                      }
                      pts.clear()
                      pts.addAll(n)
                      save()
                  }
                  val rst = Button(this)
                  rst.text = "Réinitialiser"
                  rst.isAllCaps = false
                  rst.setOnClickListener {
                      pts.clear()
                      pts.addAll(Cfg.defaults())
                      save()
                  }
                  row2.addView(sub, LinearLayout.LayoutParams(0, -2, 1f))
                  row2.addView(rst, LinearLayout.LayoutParams(0, -2, 1f))
                  root.addView(row2)

                  slider(root, "Zoom éditeur", 1f, 5f, 0.5f, zoom) {
                      zoom = it
                      shape.zoom = it
                      shape.layoutParams.height = (110 * d * it).toInt()
                      shape.requestLayout()
                      shape.invalidate()
                  }
                  slider(root, "Arrondi", 0f, 40f, 0.5f, corner) {
                      corner = it
                      save()
                  }
                  slider(root, "Position X", -200f, 200f, 0.5f, offX) {
                      offX = it
                      save()
                  }
                  slider(root, "Position Y", -50f, 50f, 0.5f, offY) {
                      offY = it
                      save()
                  }
                  slider(root, "Teinte", 0f, 360f, 1f, hsv[0]) {
                      hsv[0] = it
                      save()
                  }
                  slider(root, "Saturation", 0f, 1f, 0.01f, hsv[1]) {
                      hsv[1] = it
                      save()
                  }
                  slider(root, "Luminosité", 0f, 1f, 0.01f, hsv[2]) {
                      hsv[2] = it
                      save()
                  }
                  slider(root, "Opacité", 0f, 255f, 5f, opa.toFloat()) {
                      opa = it.toInt()
                      save()
                  }
              }

              override fun onResume() {
                  super.onResume()
                  applyService()
              }

              private fun applyService() {
                  val on = sp.getBoolean("on", false)
                  val i = Intent(this, OverlayService::class.java)
                  if (on && Settings.canDrawOverlays(this)) {
                      startForegroundService(i)
                  } else {
                      stopService(i)
                  }
                  toggle.text = if (on) "Barre ACTIVE (toucher pour couper)" else "Barre éteinte (toucher pour activer)"
              }

              private fun save() {
                  color = Color.HSVToColor(opa, hsv)
                  sp.edit()
                      .putString("pts", Cfg.encode(pts))
                      .putInt("color", color)
                      .putFloat("corner", corner)
                      .putFloat("offX", offX)
                      .putFloat("offY", offY)
                      .apply()
                  shape.color = color
                  shape.corner = corner
                  shape.invalidate()
              }

              private fun fmt(v: Float, s: Float): String {
                  return if (s >= 1f) Math.round(v).toString()
                  else if (s >= 0.1f) "%.1f".format(v)
                  else "%.2f".format(v)
              }

              private fun slider(
                  root: LinearLayout, label: String, min: Float, max: Float,
                  step: Float, init: Float, on: (Float) -> Unit
              ) {
                  val tv = TextView(this)
                  val bar = SeekBar(this)
                  val minus = Button(this)
                  val plus = Button(this)
                  minus.text = "−"
                  plus.text = "+"
                  minus.minWidth = 0
                  minus.minimumWidth = 0
                  plus.minWidth = 0
                  plus.minimumWidth = 0
                  bar.max = Math.round((max - min) / step)
                  bar.progress = Math.round((init - min) / step)
                  tv.text = label + " : " + fmt(init, step)
                  tv.setPadding(0, (12 * d).toInt(), 0, 0)
                  bar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar, p: Int, u: Boolean) {
                          val v = min + p * step
                          tv.text = label + " : " + fmt(v, step)
                          on(v)
                      }

                      override fun onStartTrackingTouch(s: SeekBar) {}
                      override fun onStopTrackingTouch(s: SeekBar) {}
                  })
                  minus.setOnClickListener { bar.progress = bar.progress - 1 }
                  plus.setOnClickListener { bar.progress = bar.progress + 1 }
                  val r = LinearLayout(this)
                  r.gravity = Gravity.CENTER_VERTICAL
                  r.addView(minus, LinearLayout.LayoutParams((52 * d).toInt(), -2))
                  r.addView(bar, LinearLayout.LayoutParams(0, -2, 1f))
                  r.addView(plus, LinearLayout.LayoutParams((52 * d).toInt(), -2))
                  root.addView(tv)
                  root.addView(r)
              }
          }
          EOF

      - name: Compiler l'APK
        run: gradle -p barre assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Barre-APK
          path: barre/app/build/outputs/apk/debug/*.apk
