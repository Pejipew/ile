name: Build APK
run-name: Build APK 3.0.0 (${{ github.sha }})

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p app
          mkdir -p app/src/main/java/com/example/island
          cat > app/src/main/java/com/example/island/Models.kt <<'KOTLIN_EOF'
