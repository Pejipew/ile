              private fun detect() {
                  val s = IslandAccessibilityService.instance
                  if (s == null) {
                      toast("Active d'abord le service (onglet Options)")
                      return
                  }
                  s.detect { r ->
                      if (r == null) {
                          toast("Détection impossible, règle X / Y à la main")
                      } else {
                          val c = Store.cfg
                          c.holeX = r[0]
                          c.holeY = r[1]
                          c.holeD = r[2]
                          commit()
                          rebuild()
                          toast("Trou détecté ✔")
                      }
                  }
              }

              // ---------------------------------------------------------------- INFOS

              fun syncFromRows(rows: List<Row>) {
                  val c = Store.cfg
                  var zone = 0
                  val list = ArrayList<Mod>()
                  for (r in rows) {
                      if (r.header > 0) { zone = r.header - 1; continue }
                      val m = r.mod ?: continue
                      m.zone = zone
                      list.add(m)
                  }
                  c.mods.clear()
                  c.mods.addAll(list)
                  commit()
              }

              fun openMod(m: Mod) {
                  ModDialog.show(this, m,
                      onChange = { commit() },
                      onDuplicate = {
                          val cp = Mod.copyOf(m)
                          val idx = Store.cfg.mods.indexOf(m)
                          Store.cfg.mods.add(idx + 1, cp)
                          commit()
                      },
                      onRemove = {
                          Store.cfg.mods.remove(m)
                          commit()
                      },
                      onClose = { showTab(3) })
              }

              private fun tabInfos(): View {
                  val c = Store.cfg
                  val rows = ArrayList<Row>()
                  for (z in 0..3) {
                      rows.add(Row(z + 1, null))
                      for (m in c.mods) if (m.zone == z) rows.add(Row(0, m))
                  }

                  val adapter = ModAdapter(this, ui, rows)
                  val helper = ItemTouchHelper(object : ItemTouchHelper.SimpleCallback(ItemTouchHelper.UP or ItemTouchHelper.DOWN, 0) {
                      override fun getMovementFlags(rv: RecyclerView, vh: RecyclerView.ViewHolder): Int {
                          val pos = vh.bindingAdapterPosition
                          return if (pos in rows.indices && rows[pos].header == 0) super.getMovementFlags(rv, vh) else 0
                      }

                      override fun onMove(rv: RecyclerView, vh: RecyclerView.ViewHolder, target: RecyclerView.ViewHolder): Boolean {
                          val from = vh.bindingAdapterPosition
                          val to = target.bindingAdapterPosition
                          if (from < 0 || to <= 0) return false
                          rows.add(to, rows.removeAt(from))
                          adapter.notifyItemMoved(from, to)
                          return true
                      }

                      override fun onSwiped(vh: RecyclerView.ViewHolder, direction: Int) {}

                      override fun clearView(rv: RecyclerView, vh: RecyclerView.ViewHolder) {
                          super.clearView(rv, vh)
                          syncFromRows(rows)
                      }
                  })
                  adapter.helper = helper

                  val list = RecyclerView(this)
                  list.layoutManager = LinearLayoutManager(this)
                  list.adapter = adapter
                  list.clipToPadding = false
                  list.setPadding(0, ui.dp(6), 0, ui.dp(6))
                  helper.attachToRecyclerView(list)

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.addView(list, LinearLayout.LayoutParams(ui.MATCH, 0, 1f))
                  val foot = LinearLayout(this)
                  foot.orientation = LinearLayout.VERTICAL
                  foot.setPadding(ui.dp(14), ui.dp(4), ui.dp(14), ui.dp(10))
                  foot.addView(ui.hint("Maintiens ≡ pour glisser une info dans la zone de ton choix (bord gauche, autour du trou, bord droit), ou utilise ▲ ▼. ⚙ pour la régler et la décaler au pixel près."))
                  foot.addView(ui.button("➕ Ajouter une info") { addDialog() })
                  col.addView(foot, LinearLayout.LayoutParams(ui.MATCH, ui.WRAP))
                  return col
              }

              private fun addDialog() {
                  val kinds = Kind.values()
                  val names = Array(kinds.size) { kinds[it].icon + "  " + kinds[it].title }
                  AlertDialog.Builder(this, android.R.style.Theme_Material_Dialog_Alert)
                      .setTitle("Ajouter une info")
                      .setItems(names) { _, which ->
                          Store.cfg.mods.add(Mod.create(kinds[which], false))
                          commit()
                          showTab(3)
                      }
                      .show()
              }

