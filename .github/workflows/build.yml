          package com.example.island

          import android.content.Context
          import android.graphics.Color

          class Prefs(context: Context) {
              private val sp = context.getSharedPreferences("island", Context.MODE_PRIVATE)
              private val density = context.resources.displayMetrics.density

              /** Valeur par défaut en pixels, à partir d'une taille de départ en dp */
              private fun px(dp: Int) = (dp * density).toInt()

              private fun putB(k: String, v: Boolean) = sp.edit().putBoolean(k, v).apply()
              private fun putI(k: String, v: Int) = sp.edit().putInt(k, v).apply()
              private fun putS(k: String, v: String) = sp.edit().putString(k, v).apply()

              companion object {
                  const val DEFAULT_RULES = ""

                  val DEFAULT_SIGNAL = intArrayOf(
                      Color.parseColor("#FF3B30"),
                      Color.parseColor("#FF9500"),
                      Color.parseColor("#FFFF00"),
                      Color.parseColor("#00FF00"),
                      Color.parseColor("#007AFF")
                  )

                  val NET_KEYS = listOf("none", "2G", "3G", "3G+", "4G", "4G+", "5G", "5G+")
                  private val NET_DEFAULTS = mapOf(
                      "none" to "#8E8E93",
                      "2G" to "#FF3B30",
                      "3G" to "#FF9500",
                      "3G+" to "#FFD60A",
                      "4G" to "#34C759",
                      "4G+" to "#00E5FF",
                      "5G" to "#007AFF",
                      "5G+" to "#BF5AF2"
                  )
              }

              // ----- Encoche 1 (LED) : toutes les tailles en pixels -----
              var width: Int
                  get() = sp.getInt("widthPx", px(44))
                  set(v) = putI("widthPx", v)
              var height: Int
                  get() = sp.getInt("heightPx", px(22))
                  set(v) = putI("heightPx", v)
              /** Évasement des coins du haut (raccord concave avec le bord de l'écran) */
              var flare: Int
                  get() = sp.getInt("flarePx", px(30))
                  set(v) = putI("flarePx", v)
              /** Arrondi des coins du bas */
              var bottomRadius: Int
                  get() = sp.getInt("bottomRadiusPx", px(60))
                  set(v) = putI("bottomRadiusPx", v)
              var xOffset: Int
                  get() = sp.getInt("xOffsetPx", px(70))
                  set(v) = putI("xOffsetPx", v)
              var bgColor: Int
                  get() = sp.getInt("bgColor", Color.BLACK)
                  set(v) = putI("bgColor", v)
              var showOnlyWithLed: Boolean
                  get() = sp.getBoolean("showOnlyWithLed", false)
                  set(v) = putB("showOnlyWithLed", v)

              // ----- LED -----
              var ledEnabled: Boolean
                  get() = sp.getBoolean("ledEnabled", true)
                  set(v) = putB("ledEnabled", v)
              /** "notif" (notifications) ou "signal" (qualité du signal mobile) */
              var ledMode: String
                  get() = sp.getString("ledMode", "signal") ?: "signal"
                  set(v) = putS("ledMode", v)
              var ledWidth: Int
                  get() = sp.getInt("ledWidthPx", px(10))
                  set(v) = putI("ledWidthPx", v)
              var ledHeight: Int
                  get() = sp.getInt("ledHeightPx", px(10))
                  set(v) = putI("ledHeightPx", v)
              /** Arrondi de la LED (grand = ronde) */
              var ledRadius: Int
                  get() = sp.getInt("ledRadiusPx", px(30))
                  set(v) = putI("ledRadiusPx", v)
              /** Décalage de la LED par rapport au centre de la forme */
              var ledX: Int
                  get() = sp.getInt("ledXPx", 0)
                  set(v) = putI("ledXPx", v)
              var ledY: Int
                  get() = sp.getInt("ledYPx", 0)
                  set(v) = putI("ledYPx", v)

              fun signalColor(level: Int): Int =
                  sp.getInt("sig$level", DEFAULT_SIGNAL[level.coerceIn(0, 4)])

              fun setSignalColor(level: Int, c: Int) = putI("sig$level", c)

              /** Couleur pour les applis sans règle (0 = pas de LED) */
              var ledDefaultColor: Int
                  get() = sp.getInt("ledDefaultColor", 0)
                  set(v) = putI("ledDefaultColor", v)

              private var ledRules: String
                  get() = sp.getString("ledRules", DEFAULT_RULES) ?: DEFAULT_RULES
                  set(v) = putS("ledRules", v)

              var seenPackages: Set<String>
                  get() = sp.getStringSet("seen", emptySet()) ?: emptySet()
                  set(v) {
                      sp.edit().putStringSet("seen", HashSet(v)).apply()
                  }

              var hiddenPackages: Set<String>
                  get() = sp.getStringSet("hidden", emptySet()) ?: emptySet()
                  set(v) {
                      sp.edit().putStringSet("hidden", HashSet(v)).apply()
                  }

              fun markSeen(pkg: String) {
                  if (hiddenPackages.contains(pkg)) return
                  val s = HashSet(seenPackages)
                  if (s.add(pkg)) seenPackages = s
              }

              /** Retire une appli de la liste : sa règle disparaît et elle n'y revient plus toute seule */
              fun hidePackage(pkg: String) {
                  removeRule(pkg)
                  seenPackages = HashSet(seenPackages).apply { remove(pkg) }
                  hiddenPackages = HashSet(hiddenPackages).apply { add(pkg) }
              }

              fun unhidePackage(pkg: String) {
                  if (hiddenPackages.contains(pkg)) {
                      hiddenPackages = HashSet(hiddenPackages).apply { remove(pkg) }
                  }
              }

              // ----- Règles couleur par appli (0 = pas de LED pour cette appli) -----
              fun rules(): LinkedHashMap<String, Int> {
                  val m = LinkedHashMap<String, Int>()
                  ledRules.lines().forEach { line ->
                      val parts = line.trim().split("=")
                      if (parts.size == 2) {
                          val v = parts[1].trim()
                          try {
                              m[parts[0].trim()] = if (v == "off") 0 else Color.parseColor(v)
                          } catch (_: Exception) {
                          }
                      }
                  }
                  return m
              }

              fun setRule(pkg: String, color: Int) {
                  unhidePackage(pkg)
                  val m = rules()
                  m[pkg] = color
                  saveRules(m)
              }

              fun removeRule(pkg: String) {
                  val m = rules()
                  m.remove(pkg)
                  saveRules(m)
              }

              private fun saveRules(m: Map<String, Int>) {
                  ledRules = m.entries.joinToString("\n") { e ->
                      if (e.value == 0) "${e.key}=off"
                      else e.key + "=" + String.format("#%06X", e.value and 0xFFFFFF)
                  }
              }

              // ----- Encoche 2 : type de réseau -----
              var n2Enabled: Boolean
                  get() = sp.getBoolean("n2Enabled", true)
                  set(v) = putB("n2Enabled", v)
              var n2Width: Int
                  get() = sp.getInt("n2WidthPx", px(44))
                  set(v) = putI("n2WidthPx", v)
              var n2Height: Int
                  get() = sp.getInt("n2HeightPx", px(22))
                  set(v) = putI("n2HeightPx", v)
              var n2Flare: Int
                  get() = sp.getInt("n2FlarePx", px(30))
                  set(v) = putI("n2FlarePx", v)
              var n2BottomRadius: Int
                  get() = sp.getInt("n2BottomRadiusPx", px(60))
                  set(v) = putI("n2BottomRadiusPx", v)
              var n2XOffset: Int
                  get() = sp.getInt("n2XOffsetPx", px(-70))
                  set(v) = putI("n2XOffsetPx", v)
              var n2BgColor: Int
                  get() = sp.getInt("n2BgColor", Color.BLACK)
                  set(v) = putI("n2BgColor", v)
              /** Taille du texte en sp */
              var n2TextSize: Int
                  get() = sp.getInt("n2TextSize", 9)
                  set(v) = putI("n2TextSize", v)
              var n2Colored: Boolean
                  get() = sp.getBoolean("n2Colored", true)
                  set(v) = putB("n2Colored", v)

              fun netColor(key: String): Int =
                  sp.getInt("net_$key", Color.parseColor(NET_DEFAULTS[key] ?: "#FFFFFF"))

              fun setNetColor(key: String, c: Int) = putI("net_$key", c)
          }
          KOTLIN_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'KOTLIN_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Custom Island</string>
              <string name="acc_desc">Affiche la capsule flottante au dessus de tout, y compris le panneau de notifications.</string>
          </resources>
          KOTLIN_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'KOTLIN_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:description="@string/acc_desc"
              android:notificationTimeout="500" />
          KOTLIN_EOF
          cat > build.gradle.kts <<'KOTLIN_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          KOTLIN_EOF
          cat > gradle.properties <<'KOTLIN_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          KOTLIN_EOF
          cat > settings.gradle.kts <<'KOTLIN_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CustomIsland"
          include(":app")
          KOTLIN_EOF
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E '^e: ' build.log | sed 's#file:///[^ ]*/##' | head -20 | while IFS= read -r l; do echo "::error::$l"; done || true
          grep -A6 'What went wrong' build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: CustomIsland-apk
          path: app/build/outputs/apk/debug/app-debug.apk
