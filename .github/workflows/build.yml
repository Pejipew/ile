          package com.example.island

          import android.graphics.Canvas
          import android.graphics.ColorFilter
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.RectF
          import android.graphics.drawable.Drawable

          /**
           * Forme d'encoche : accrochée au bord haut de l'écran, avec des raccords
           * concaves en haut (évasement) et un bas arrondi.
           */
          class IslandDrawable : Drawable() {

              private var flare = 0f
              private var radius = 0f
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val path = Path()

              fun set(flare: Float, radius: Float, fill: Int) {
                  this.flare = flare
                  this.radius = radius
                  paint.color = fill
                  invalidateSelf()
              }

              override fun draw(canvas: Canvas) {
                  val w = bounds.width().toFloat()
                  val h = bounds.height().toFloat()
                  if (w <= 0f || h <= 0f) return
                  canvas.save()
                  canvas.translate(bounds.left.toFloat(), bounds.top.toFloat())

                  val f = minOf(flare, w / 4f, h / 2f).coerceAtLeast(0f)
                  val bodyW = w - 2f * f
                  val r = minOf(radius, bodyW / 2f, h - f).coerceAtLeast(0f)

                  path.reset()
                  path.moveTo(0f, 0f)
                  path.lineTo(w, 0f)
                  if (f > 0.5f) path.arcTo(RectF(w - f, 0f, w + f, 2f * f), 270f, -90f)
                  if (r > 0.5f) {
                      path.lineTo(w - f, h - r)
                      path.arcTo(RectF(w - f - 2f * r, h - 2f * r, w - f, h), 0f, 90f)
                      path.lineTo(f + r, h)
                      path.arcTo(RectF(f, h - 2f * r, f + 2f * r, h), 90f, 90f)
                  } else {
                      path.lineTo(w - f, h)
                      path.lineTo(f, h)
                  }
                  path.lineTo(f, f)
                  if (f > 0.5f) path.arcTo(RectF(-f, 0f, f, 2f * f), 0f, -90f)
                  path.close()

                  canvas.drawPath(path, paint)
                  canvas.restore()
              }

              override fun setAlpha(alpha: Int) {
                  paint.alpha = alpha
              }

              override fun setColorFilter(colorFilter: ColorFilter?) {
                  paint.colorFilter = colorFilter
              }

              @Suppress("OVERRIDE_DEPRECATION")
              override fun getOpacity(): Int = PixelFormat.TRANSLUCENT
          }
          KOTLIN_EOF
