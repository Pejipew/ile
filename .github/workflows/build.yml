              NOTIF_ICONS("Notifications (icônes d'applis)", "🔔", listOf("2 max", "3 max", "4 max", "5 max", "6 max"), dText = false, dHide = true),
              WEATHER("Météo", "☀️", listOf("Température °C", "Température °F", "Vent km/h", "Humidité %", "Condition (texte)")),
              BLUETOOTH("Bluetooth", "🔵", dLed = true, dText = false, dHide = true),
              WIFI_STATE("Wi‑Fi activé", "📶", dLed = true, dText = false, dHide = true),
              AIRPLANE("Mode avion", "✈️", dLed = true, dText = false, dHide = true),
              DND("Ne pas déranger", "🌙", dLed = true, dText = false, dHide = true),
              RINGER("Sonnerie / vibreur", "🔔"),
              ALARM("Prochain réveil", "⏰", dHide = true),
              TORCH("Lampe torche", "🔦", dLed = true, dText = false, dHide = true),
              VOLUME("Volume", "🔊", listOf("Média", "Sonnerie", "Appel", "Alarme")),
