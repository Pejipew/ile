          package com.example.island

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.content.res.Configuration
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent

          /**
           * Héberge les deux encoches. Un service d'accessibilité peut afficher des fenêtres
           * au-dessus de tout (y compris le tiroir de notifications) et reste
           * actif en permanence.
           */
          class IslandAccessibilityService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instance: IslandAccessibilityService? = null
              }

              private var controller: IslandController? = null
              private var netIsland: NetworkIsland? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  val type = WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY

                  val c = IslandController(this, type)
                  controller = c
                  IslandBus.onChange = { c.refreshLed() }
                  c.start()

                  val n = NetworkIsland(this, type)
                  netIsland = n
                  n.start()
              }

              /** Applique les réglages en direct, sans recréer les fenêtres */
              fun reload() {
                  controller?.applyLive()
                  netIsland?.applyLive()
              }

              /** Relit la source de la LED (notifications ou signal mobile) */
              fun refreshSource() {
                  controller?.updateSource()
                  netIsland?.applyLive()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  controller?.applyLive()
                  netIsland?.applyLive()
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  IslandBus.onChange = null
                  controller?.stop()
                  netIsland?.stop()
                  controller = null
                  netIsland = null
                  instance = null
                  return super.onUnbind(intent)
              }
          }
          KOTLIN_EOF
